<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenti AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #F3F4F6; --surface: #FFFFFF; --surface-2: #F9FAFB;
      --text: #1F2937; --muted: #4B5563; --faint: #9CA3AF;
      --accent: #2563EB; --accent-soft: #DBEAFE; --border: #E5E7EB;
      --radius: 12px; --ease: cubic-bezier(.2,.8,.2,1);
      --font-card: 'Manrope', 'Inter', system-ui, sans-serif;
    }
    body.dark {
      --bg: #0D0D10; --surface: #141417; --surface-2: #1A1A1F;
      --text: #EEEEF0; --muted: #9898A8; --faint: #6B6B7A;
      --accent: #3B82F6; --accent-soft: #1A1A1F; --border: #2A2A35;
    }
    [hidden] { display: none !important; }
    /* Palette DataSales: light #F3F4F6/#FFFFFF, dark #0D0D10/#141417 */
    body { font-family: system-ui, sans-serif; background: #F3F4F6; color: #1F2937; padding: 14px 24px 48px; }
    /* Footer fisso stile SCT Tool (uguale su tutte le pagine) */
    .mlt-footer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      border-top: 1px solid #E5E7EB; background: #FFFFFF; padding: 5px 18px;
      text-align: center; font-size: 0.7rem; color: #4B5563; }
    .mlt-footer a { color: inherit; text-decoration: none; font-weight: bold; }
    body.dark .mlt-footer { background: #141417; border-color: #2A2A35; color: #9898A8; }
    .wrap { max-width: 960px; margin: 0 auto; }

    svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2;
          stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

    /* Header stile Turni: titolo + sottotitolo a sinistra, pill a destra, riga blu sotto */
    header.page-head { display: flex; justify-content: space-between; align-items: center; gap: 14px;
      flex-wrap: nowrap; border-bottom: 2px solid #3B82F6; padding-bottom: 8px; margin-bottom: 12px; height: 60px; }
    .page-head .brand { display: flex; align-items: center; gap: 12px; min-width: 0; margin-left: 46px; transition: margin-left .25s ease; }
    .page-head .brand > div { min-width: 0; }
    @media (min-width: 1060px) { .page-head .brand { margin-left: 0; } }
    .page-head h1 { color: #1F2937; font-size: 20px; line-height: 1.25; margin: 0; display: flex; align-items: center; gap: 10px; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 800; letter-spacing: -.4px; }
    .page-head h1 svg { width: 20px; height: 20px; flex: none; }
    .page-head .sub { color: #4B5563; font-size: 11px; margin: 1px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .page-head .right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; position: relative; }
    .iconbtn { width: 40px; height: 40px; padding: 0; display: inline-flex; align-items: center; justify-content: center;
      border-radius: 999px; border: 1px solid #E5E7EB; background: #fff; color: #1F2937; cursor: pointer; flex: none; }
    .iconbtn:hover { background: #E5E7EB; }
    .iconbtn svg { width: 16px; height: 16px; }
    body.dark .iconbtn { background: #141417; border-color: #2A2A35; color: #EEEEF0; }
    body.dark .iconbtn:hover { background: #1F1F26; }
    /* Menu ingranaggio stile Turni */
    #drop { display: none; position: absolute; top: calc(100% + 8px); right: 0; z-index: 70;
      flex-direction: column; gap: 4px; min-width: 210px; background: #fff; border: 1px solid #E5E7EB;
      border-radius: 12px; padding: 8px; box-shadow: 0 16px 40px rgba(0,0,0,.18), 0 4px 12px rgba(0,0,0,.10); }
    .right.open #drop { display: flex; }
    #drop .btn { width: 100%; justify-content: flex-start; }
    body.dark #drop { background: #141417; border-color: #2A2A35; box-shadow: 0 16px 40px rgba(0,0,0,.5); }
    .pill { height: 40px; display: inline-flex; align-items: center; gap: 8px; padding: 0 14px;
      border: 1px solid #E5E7EB; border-radius: 999px; background: transparent; color: #4B5563;
      font-size: 12px; font-weight: 600; white-space: nowrap; }
    .pill svg { width: 14px; height: 14px; }
    body.dark .page-head h1 { color: #EEEEF0; }
    body.dark .page-head .sub { color: #9898A8; }
    body.dark .pill { border-color: #2A2A35; color: #9898A8; background: transparent; }
    @media (max-width: 600px) {
      .page-head { gap: 8px; }
      .page-head .brand { margin-left: 54px; }
      .page-head .right { gap: 8px; }
    }

    /* Barra strumenti */
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 24px; }
    .search-box { position: relative; flex: 1; min-width: 200px; max-width: 400px; }
    .search-box svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #9CA3AF; }
    #search { width: 100%; padding: 10px 14px 10px 40px; border: 1px solid #E5E7EB; border-radius: 8px; font-size: 15px; background: #FFFFFF; color: #1F2937; }

    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border: 1px solid #E5E7EB;
           border-radius: 8px; background: #fff; color: #1F2937; font: inherit; font-size: 14px;
           cursor: pointer; text-decoration: none; white-space: nowrap; }
    .btn:hover { background: #E5E7EB; }
    .btn.primary { background: #2563EB; border-color: #2563EB; color: #fff; }
    .btn.primary:hover { background: #3B82F6; border-color: #3B82F6; }

    /* Card — sobrio, piatto, niente neon */
    .category { margin-bottom: 28px; --cat: #2563EB; --cat-soft: #E8EEFE; }
    body.dark .category { --cat: #5B93FF; --cat-soft: #1B2233; }
    .category h2 { display: flex; align-items: center; gap: 10px; font-family: var(--font-card);
      font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 12px; }
    .category h2::before { content: ""; width: 8px; height: 8px; border-radius: 2px;
      background: var(--cat); flex: none; }
    .category h2::after { content: ""; flex: 1; height: 1px; background: var(--border); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
    body.wide .grid { grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); }
    body.wide .card-link { min-height: 104px; }

    .card { position: relative; border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--cat);
      box-shadow: 0 1px 2px rgba(16,24,40,.06);
      transition: border-color .2s var(--ease), box-shadow .2s var(--ease), transform .2s var(--ease); }
    body.dark .card { box-shadow: none; }
    .card:hover, .card:focus-within { transform: translateY(-1px);
      border-color: color-mix(in oklab, var(--cat) 40%, var(--border));
      box-shadow: 0 4px 12px rgba(16,24,40,.08); }
    body.dark .card:hover, body.dark .card:focus-within { box-shadow: 0 4px 16px rgba(0,0,0,.35); }
    .card-link { position: relative; display: flex; gap: 14px; align-items: flex-start;
      padding: 18px 46px 18px 16px; min-height: 92px; color: inherit; text-decoration: none;
      border-radius: var(--radius); }
    .card-link:focus-visible { outline: 2px solid var(--cat); outline-offset: 3px; }
    .card .icon { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 10px; flex-shrink: 0;
      color: var(--cat); background: var(--cat-soft); border: 1px solid transparent; }
    .card .icon svg { width: 22px; height: 22px; }
    .card h3 { font-family: var(--font-card); font-size: 16px; font-weight: 800; letter-spacing: -.01em;
      line-height: 1.35; color: var(--text); word-break: break-word; }
    .card p { font-family: var(--font-card); font-size: 13px; line-height: 1.5; color: var(--muted);
      margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .badge { position: absolute; top: 14px; right: 14px; color: var(--faint); pointer-events: none; }
    .badge svg { width: 15px; height: 15px; }
    .card:hover .badge { color: var(--cat); }

    .card-actions { position: absolute; bottom: 8px; right: 8px; display: flex; gap: 6px;
      opacity: 0; transition: opacity .15s var(--ease); }
    .card:hover .card-actions, .card:focus-within .card-actions { opacity: 1; }
    @media (hover: none) { .card-actions { opacity: 1; } }
    .card-actions button { display: grid; place-items: center; width: 30px; height: 30px;
      border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2);
      color: var(--muted); cursor: pointer;
      transition: color .15s var(--ease), background .15s, border-color .15s; }
    .card-actions button:hover { color: var(--cat); border-color: var(--cat); background: var(--surface); }
    .card-actions button:active { transform: translateY(1px); }
    .card-actions button:focus-visible { outline: 2px solid var(--cat); outline-offset: 2px; }
    .card-actions button[data-action="delete"]:hover { color: #B42318; border-color: #B42318; background: #FEF3F2; }
    body.dark .card-actions button[data-action="delete"]:hover { color: #F97066; border-color: #F97066; background: #2A1B18; }
    .card-actions svg { width: 15px; height: 15px; }
    @media (max-width: 600px) {
      .grid { grid-template-columns: 1fr; gap: 12px; }
      .card-link { min-height: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }

    .empty { padding: 40px; text-align: center; color: #4B5563; background: #FFFFFF;
             border: 2px dashed #E5E7EB; border-radius: 10px; }

    /* Tema scuro DataSales (comandato dal menu laterale di index.html) */
    body.dark { background: #0D0D10; color: #EEEEF0; }
    body.dark h1, body.dark .category h2, body.dark .dialog h2,
    body.dark .mode span b { color: #EEEEF0; }
    body.dark .sub, body.dark .card p, body.dark .mode small { color: #9898A8; }
    body.dark #search, body.dark .field input { background: #141417; border-color: #2A2A35; color: #EEEEF0; }
    body.dark .btn { background: #141417; border-color: #2A2A35; color: #EEEEF0; }
    body.dark .btn:hover { background: #1F1F26; }
    body.dark .btn.primary { background: #3B82F6; border-color: #3B82F6; color: #fff; }
    body.dark .dialog { background: #141417; }
    body.dark .empty { background: #141417; border-color: #2A2A35; color: #9898A8; }
    body.dark .icon-opt span, body.dark .mode span { border-color: #2A2A35; color: #9898A8; }
    body.dark .icon-opt input:checked + span, body.dark .mode input:checked + span { background: #1A1A1F; border-color: #3B82F6; color: #60A5FA; }
    body.dark .viewer-bar { background: #141417; border-color: #2A2A35; }
    body.dark .viewer-bar strong { color: #EEEEF0; }

    /* Finestra modulo */
    .modal { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center;
             padding: 20px; background: rgba(0,10,40,.5); }
    .dialog { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 500px; max-height: 100%;
              overflow: auto; padding: 24px; background: #fff; border-radius: 12px; }
    .dialog h2 { color: #1F2937; font-size: 20px; }
    .field { display: flex; flex-direction: column; gap: 5px; font-size: 14px; font-weight: 600; color: #1F2937; }
    .field .opt { font-weight: 400; color: #9CA3AF; }
    .field input { padding: 9px 12px; border: 1px solid #E5E7EB; border-radius: 8px; font: inherit; font-weight: 400; font-size: 15px; background: #FFFFFF; color: #1F2937; }
    fieldset { border: none; }
    legend { font-size: 14px; font-weight: 600; color: #1F2937; margin-bottom: 6px; }

    .icon-picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; }
    .icon-opt, .mode { position: relative; }
    .icon-opt input, .mode input { position: absolute; opacity: 0; pointer-events: none; }
    .icon-opt span { display: grid; place-items: center; height: 44px; border: 2px solid #E5E7EB;
                     border-radius: 8px; color: #4B5563; cursor: pointer; }
    .icon-opt svg { width: 22px; height: 22px; }

    .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .mode span { display: flex; flex-direction: column; gap: 4px; height: 100%; padding: 12px;
                 border: 2px solid #E5E7EB; border-radius: 8px; cursor: pointer; font-size: 14px; }
    .mode span b { display: flex; align-items: center; gap: 8px; color: #1F2937; }
    .mode small { color: #4B5563; font-size: 12px; }

    .icon-opt span:hover, .mode span:hover { border-color: #3B82F6; color: #3B82F6; }
    .icon-opt input:checked + span, .mode input:checked + span { border-color: #3B82F6; background: #DBEAFE; color: #2563EB; }
    .icon-opt input:focus-visible + span, .mode input:focus-visible + span { outline: 2px solid #2563EB; }

    .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }

    /* Visualizzatore integrato */
    #viewer { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; background: #FFFFFF; }
    .viewer-bar { display: flex; align-items: center; gap: 12px; padding: 12px 16px 12px 66px;
                  background: #F3F4F6; border-bottom: 1px solid #E5E7EB; }
    .viewer-bar strong { color: #1F2937; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .viewer-bar .hint { flex: 1; text-align: right; font-size: 12px; color: #9CA3AF; }
    #viewer-frame { flex: 1; width: 100%; border: none; }
    @media (max-width: 600px) { .viewer-bar .hint { display: none; } .viewer-bar strong { flex: 1; } }
  </style>
</head>
<body>

<div class="wrap">

  <header class="page-head">
    <div class="brand"><div><h1><svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M12 8V4H8"/><path d="M2 14h1M21 14h1M9 13v2M15 13v2"/></svg><span data-t="title">Agenti AI</span></h1><p class="sub" data-t="sub">I tuoi collegamenti rapidi agli agenti e strumenti AI</p></div></div>
    <div class="right" id="tools"><span class="pill" id="countPill"></span><button class="iconbtn" id="menuBtn" data-t-title="menuTitle" title="Menu"><svg viewBox="0 0 24 24"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg></button><span id="drop"><button class="btn" id="btn-export" data-t-title="exportTitle" title="Scarica la lista come file .json"><span data-i="download"></span><span data-t="export">Esporta</span></button><button class="btn" id="btn-import" data-t-title="importTitle" title="Carica una lista da file .json"><span data-i="upload"></span><span data-t="import">Importa</span></button></span></div>
  </header>

  <div class="toolbar">
    <div class="search-box">
      <span data-i="search"></span>
      <input id="search" type="text" data-t-ph="searchPh" placeholder="Cerca un agente...">
    </div>
    <button class="btn primary" id="btn-add"><span data-i="plus"></span><span data-t="add">Aggiungi agente</span></button>
    <button class="iconbtn" id="btn-width" data-t-title="widthTitle" title="Alterna card strette e larghe" aria-pressed="false"><span data-i="expand"></span></button>
    <input type="file" id="file-import" accept=".json,application/json" hidden>
  </div>

  <div id="container"></div>

</div>

  <!-- Modulo aggiungi / modifica -->
  <div id="modal" class="modal" hidden>
    <form id="form" class="dialog" autocomplete="off">
      <h2 id="form-title">Nuovo agente</h2>

      <label class="field"><span data-t="name">Nome</span>
        <input name="nome" type="text" required maxlength="40" data-t-ph="namePh" placeholder="Es. Assistente Vendite">
      </label>
      <label class="field"><span data-t="link">Link</span>
        <input name="url" type="url" required placeholder="https://bernard.swisscom.com/agents/...">
      </label>
      <label class="field"><span data-t="desc">Descrizione</span> <span class="opt" data-t="optional">(facoltativa)</span>
        <input name="descrizione" type="text" maxlength="80" data-t-ph="descPh" placeholder="A cosa serve">
      </label>
      <label class="field"><span data-t="cat">Categoria</span> <span class="opt" data-t="optional">(facoltativa)</span>
        <input name="categoria" type="text" maxlength="30" list="cat-list" data-t-ph="catPh" placeholder="Es. Swisscom, Esterni...">
        <datalist id="cat-list"></datalist>
      </label>

      <fieldset>
        <legend data-t="icon">Icona</legend>
        <div id="icon-picker" class="icon-picker"></div>
      </fieldset>

      <fieldset>
        <legend data-t="opening">Apertura</legend>
        <div class="modes">
          <label class="mode">
            <input type="radio" name="modo" value="tab">
            <span><b><span data-i="external"></span><span data-t="newTab">Nuova scheda</span></b><small data-t="alwaysWorks">Funziona sempre</small></span>
          </label>
          <label class="mode">
            <input type="radio" name="modo" value="frame">
            <span><b><span data-i="frame"></span><span data-t="integrated">Integrato</span></b><small data-t="onlyIfAllowed">Solo se il sito lo permette</small></span>
          </label>
        </div>
      </fieldset>

      <div class="actions">
        <button type="button" class="btn" id="btn-cancel" data-t="cancel">Annulla</button>
        <button type="submit" class="btn primary" data-t="save">Salva</button>
      </div>
    </form>
  </div>

  <!-- Visualizzatore integrato -->
  <div id="viewer" hidden>
    <div class="viewer-bar">
      <button class="btn" id="btn-back"><span data-i="back"></span><span data-t="back">Indietro</span></button>
      <strong id="viewer-title"></strong>
      <span class="hint" data-t="viewerHint">Pagina vuota o errore? Il sito non permette l'integrazione: apri in nuova scheda.</span>
      <a class="btn" id="viewer-ext" target="_blank" rel="noopener"><span data-i="external"></span><span data-t="newTab">Nuova scheda</span></a>
    </div>
    <iframe id="viewer-frame" data-t-title="viewerFrameTitle" title="Agente" allow="clipboard-read; clipboard-write; microphone"></iframe>
  </div>

  <script>
    // ===== Icone selezionabili: [etichetta, tracciati SVG 24x24] =====
    const ICONE = {
      bot:       ['Robot', '<rect x="3" y="8" width="18" height="12" rx="2"/><path d="M12 8V4H8M2 14h1M21 14h1M9 13v2M15 13v2"/>'],
      chat:      ['Chat', '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>'],
      sparkle:   ['AI', '<path d="M12 3l1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2z"/><path d="M19 3v4M17 5h4"/>'],
      lightbulb: ['Idea', '<path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/>'],
      doc:       ['Documento', '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/>'],
      book:      ['Conoscenza', '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>'],
      search:    ['Ricerca', '<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>'],
      code:      ['Codice', '<polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>'],
      chart:     ['Analisi', '<line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/>'],
      calendar:  ['Calendario', '<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>'],
      mail:      ['Email', '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/>'],
      users:     ['Team / Clienti', '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>'],

      } catch (e) {}
      window.addEventListener('message', (e) => {
        if (e?.data?.type === G && (e.data.theme === 'dark' || e.data.theme === 'light')) {
          apply(e.data.theme);
          try { localStorage.setItem(G, e.data.theme); } catch (err) {}
        }
      });
      window.addEventListener('storage', (e) => {
        if (e.key === G && (e.newValue === 'dark' || e.newValue === 'light')) {
          apply(e.newValue);
        }
      });
    })();

    // ===== Lingua globale (dal menu laterale di index.html) =====
    function applyLang(l) {
      curLang = LANGS.includes(l) ? l : 'it';
      document.documentElement.lang = curLang;
      try { localStorage.setItem(LANG_KEY, curLang); } catch (e) {}
      document.title = t('title');
      document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
      document.querySelectorAll('[data-t-ph]').forEach(el => { el.placeholder = t(el.dataset.tPh); });
      document.querySelectorAll('[data-t-title]').forEach(el => { el.title = t(el.dataset.tTitle); });
      renderIconPicker();
      render();
      try { applyWidth(document.body.classList.contains('wide') ? 'wide' : 'normal'); } catch (e) {}
    }
    window.addEventListener('message', (e) => {
      if (e?.data?.type === LANG_KEY && LANGS.includes(e.data.lang)) applyLang(e.data.lang);
    });
    window.addEventListener('storage', (e) => {
      if (e.key === LANG_KEY && LANGS.includes(e.newValue)) applyLang(e.newValue);
    });

    applyLang(curLang);
  </script>
