<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antistress</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #F3F4F6; --surface: #FFFFFF; --surface-2: #F9FAFB;
      --text: #1F2937; --muted: #4B5563; --faint: #9CA3AF;
      --accent: #2563EB; --accent-soft: #DBEAFE; --border: #E5E7EB;
      --teal: #0D9488;
      --radius: 16px; --ease: cubic-bezier(.2,.8,.2,1);
      --font-card: 'Manrope', 'Inter', system-ui, sans-serif;
    }
    body.dark {
      --bg: #0D0D10; --surface: #141417; --surface-2: #1A1A1F;
      --text: #EEEEF0; --muted: #9898A8; --faint: #6B6B7A;
      --accent: #3B82F6; --accent-soft: #1A1A1F; --border: #2A2A35;
      --teal: #5EEAD4;
    }
    [hidden] { display: none !important; }
    body { font-family: system-ui, sans-serif; color: #1F2937; padding: 14px 24px 64px; overflow-x: clip;
      background: radial-gradient(at 50% -60px, color-mix(in srgb, var(--teal) 7%, transparent) 0, transparent 60%), #F3F4F6; }
    body.dark { background: radial-gradient(at 50% -60px, rgba(94,234,212,.07) 0, transparent 60%), #0D0D10; color: #EEEEF0; }
    /* Footer fisso stile SCT Tool (uguale su tutte le pagine) */
    .mlt-footer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      border-top: 1px solid #E5E7EB; background: #FFFFFF; padding: 5px 18px;
      text-align: center; font-size: 0.7rem; color: #4B5563; }
    .mlt-footer a { color: inherit; text-decoration: none; font-weight: bold; }
    body.dark .mlt-footer { background: #141417; border-color: #2A2A35; color: #9898A8; }
    .wrap { max-width: 960px; margin: 0 auto; transition: max-width .5s cubic-bezier(.4,0,.2,1); }
    .wrap.expanded { max-width: none; }

    svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2;
          stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

    /* Testata full-bleed come SCT Tool: riga blu da bordo a bordo sotto il pulsante menu,
       titolo sempre a destra del pulsante via CSS (mai azzerato, nessuno spostamento JS) */
    header.page-head { display: flex; justify-content: space-between; align-items: center; gap: 14px;
      flex-wrap: nowrap; border-bottom: 2px solid #3B82F6; padding: 0 24px 8px; margin: 0 calc(50% - 50vw) 12px; width: 100vw; max-width: 100vw; min-height: 60px; }
    .page-head .brand { display: flex; align-items: center; gap: 12px; min-width: 0; margin-left: 52px; transition: margin-left .25s ease; }
    .page-head .brand > div { min-width: 0; flex: 1; overflow: hidden; }
    .page-head h1 { white-space: nowrap; }
    .page-head h1 { color: #1F2937; font-size: 20px; line-height: 1.25; margin: 0; display: flex; align-items: center; gap: 10px; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 800; letter-spacing: -.4px; }
    .page-head h1 svg { width: 20px; height: 20px; flex: none; }
    .page-head .sub { color: #4B5563; font-size: 11px; margin: 1px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .page-head .right { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; justify-content: flex-end; position: relative; flex: none; }
    .iconbtn { width: 40px; height: 40px; padding: 0; display: inline-flex; align-items: center; justify-content: center;
      border-radius: 999px; border: 1px solid #E5E7EB; background: #fff; color: #1F2937; cursor: pointer; flex: none; }
    .iconbtn:hover { background: #E5E7EB; }
    .iconbtn svg { width: 16px; height: 16px; }
    body.dark .iconbtn { background: #141417; border-color: #2A2A35; color: #EEEEF0; }
    body.dark .iconbtn:hover { background: #1F1F26; }
    .pill { height: 40px; display: inline-flex; align-items: center; gap: 8px; padding: 0 14px;
      border: 1px solid #E5E7EB; border-radius: 999px; background: transparent; color: #4B5563;
      font-size: 12px; font-weight: 600; white-space: nowrap; }
    body.dark .page-head h1 { color: #EEEEF0; }
    body.dark .page-head .sub { color: #9898A8; }
    body.dark .pill { border-color: #2A2A35; color: #9898A8; background: transparent; }
    @media (max-width: 600px) {
      .page-head { gap: 8px; }
      .page-head .brand { margin-left: 54px; }
      .page-head .right { gap: 8px; }
      .pill { padding: 0 10px; font-size: 11px; }
    }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    /* Barra ricerca: una sola riga calma e centrata */
    .toolbar { display: flex; justify-content: center; margin: 6px 0 30px; }
    .search-box { position: relative; width: 100%; max-width: 420px; }
    .search-box svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #9CA3AF; }
    #search { width: 100%; padding: 11px 16px 11px 42px; border: 1px solid #E5E7EB; border-radius: 999px; font-size: 15px; background: #FFFFFF; color: #1F2937; }
    #search::placeholder { color: #9CA3AF; }

    /* Cartoline zen: anteprima viva sopra, titolo + riga sotto */
    .grid { display: grid; grid-template-columns: 1fr; gap: 30px; max-width: 620px; margin: 0 auto; }
    .wrap.expanded .grid { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); max-width: none; }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      overflow: hidden; box-shadow: 0 1px 2px rgba(16,24,40,.05);
      transition: transform .3s var(--ease), box-shadow .3s var(--ease); }
    body.dark .card { box-shadow: none; }
    .card:hover, .card:focus-within { transform: translateY(-2px);
      box-shadow: 0 14px 34px -18px color-mix(in oklab, var(--teal) 45%, transparent); }
    body.dark .card:hover, body.dark .card:focus-within { box-shadow: 0 14px 34px -18px rgba(0,0,0,.8); }
    .preview { display: block; width: 100%; padding: 0; border: none; background: var(--surface-2);
      cursor: pointer; position: relative; color: inherit; font: inherit; }
    .preview canvas { width: 100%; aspect-ratio: 16 / 9; display: block; }
    .preview .open-hint { position: absolute; right: 12px; bottom: 10px; display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; font-weight: 700; color: #fff; background: rgba(10,14,18,.45); backdrop-filter: blur(6px);
      padding: 6px 12px; border-radius: 999px; opacity: 0; transform: translateY(4px); transition: opacity .25s var(--ease), transform .25s var(--ease); }
    .preview .open-hint svg { width: 13px; height: 13px; }
    .card:hover .open-hint, .preview:focus-visible .open-hint { opacity: 1; transform: none; }
    .cap { padding: 16px 22px 20px; text-align: center; }
    .cap h3 { font-family: var(--font-card); font-size: 17px; font-weight: 800; letter-spacing: -.01em;
      color: var(--text); display: flex; align-items: center; justify-content: center; gap: 8px; }
    .cap h3 svg { width: 16px; height: 16px; color: var(--teal); }
    .cap p { font-family: var(--font-card); font-size: 13px; line-height: 1.55; color: var(--muted); margin-top: 5px; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }

    .empty { padding: 40px; text-align: center; color: #4B5563; background: #FFFFFF;
             border: 2px dashed #E5E7EB; border-radius: 10px; max-width: 620px; margin: 0 auto; }

    /* Tema scuro (comandato dal menu laterale di index.html) */
    body.dark { background: radial-gradient(at 50% -60px, rgba(94,234,212,.07) 0, transparent 60%), #0D0D10; color: #EEEEF0; }
    body.dark h1 { color: #EEEEF0; }
    body.dark .sub { color: #9898A8; }
    body.dark #search { background: #141417; border-color: #2A2A35; color: #EEEEF0; }
    body.dark .empty { background: #141417; border-color: #2A2A35; color: #9898A8; }
    body.dark .viewer-bar { background: #141417; border-color: #2A2A35; }
    body.dark .viewer-bar strong { color: #EEEEF0; }

    /* Visualizzatore integrato */
    #viewer { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; background: #FFFFFF; }
    body.dark #viewer { background: #000; }
    .viewer-bar { display: flex; align-items: center; gap: 12px; padding: 12px 16px 12px 66px;
                  background: #F3F4F6; border-bottom: 1px solid #E5E7EB; }
    .viewer-bar strong { color: #1F2937; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    #viewer-frame { flex: 1; width: 100%; border: none; background: #000; }
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border: 1px solid #E5E7EB;
           border-radius: 8px; background: #fff; color: #1F2937; font: inherit; font-size: 14px;
           cursor: pointer; text-decoration: none; white-space: nowrap; }
    .btn:hover { background: #E5E7EB; }
    body.dark .btn { background: #141417; border-color: #2A2A35; color: #EEEEF0; }
    body.dark .btn:hover { background: #1F1F26; }
  </style>
</head>
<body>

<div class="wrap">

  <header class="page-head">
    <div class="brand"><div><h1><svg viewBox="0 0 24 24"><path d="M12 2.7l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg><span data-t="title">Antistress</span></h1><p class="sub" data-t="sub">Piccole pause per staccare la testa: apri una pagina e rilassati</p></div></div>
    <div class="right"><span class="pill" id="countPill"></span><button class="iconbtn" id="btn-expand" title="Allarga a tutta pagina"><span data-i="expand"></span></button></div>
  </header>

  <div class="toolbar">
    <div class="search-box">
      <span data-i="search"></span>
      <input id="search" type="text" data-t-ph="searchPh" placeholder="Cerca...">
    </div>
  </div>

  <div id="container"></div>

</div>

  <!-- Visualizzatore integrato -->
  <div id="viewer" hidden>
    <div class="viewer-bar">
      <button class="btn" id="btn-back"><span data-i="back"></span><span data-t="back">Indietro</span></button>
      <strong id="viewer-title"></strong>
      <a class="btn" id="viewer-ext" target="_blank" rel="noopener"><span data-i="external"></span><span data-t="newTab">Nuova scheda</span></a>
    </div>
    <iframe id="viewer-frame" data-t-title="viewerFrameTitle" title="Antistress"></iframe>
  </div>

  <script>
    // ===== Pagine della raccolta: per aggiungerne una, basta un file HTML + una riga qui =====
    const PAGES = [
      { id: 'fluidi', file: 'simulazione_fluidi.html', icon: 'drop',
        nome: { it: 'Simulazione di fluidi', de: 'Fluid-Simulation', fr: 'Simulation de fluides', en: 'Fluid simulation' },
        desc: { it: 'Colori che scorrono sotto le dita: trascina per muovere il fluido, Esplosione per stupirti',
                de: 'Farben, die unter den Fingern fließen: ziehen zum Bewegen, Explosion zum Staunen',
                fr: 'Des couleurs sous les doigts : glisse pour bouger le fluide, Explosion pour t’émerveiller',
                en: 'Colors under your fingers: drag to move the fluid, Explosion to be amazed' } },
      { id: 'respiro', file: 'respiro.html', icon: 'light',
        nome: { it: 'Tela di luce', de: 'Lichtleinwand', fr: 'Toile de lumière', en: 'Light canvas' },
        desc: { it: 'Tratti di luce che seguono il dito: tocca per respingere la luce, con respiro guidato e suono ambientale a scelta',
                de: 'Lichtstriche folgen dem Finger: tippen stößt das Licht ab, mit Atemübung und Umgebungsklang nach Wahl',
                fr: 'Traits de lumière qui suivent le doigt : touche pour repousser la lumière, avec respiration guidée et son d’ambiance au choix',
                en: 'Light strokes follow your finger: tap to push the light away, with guided breathing and ambient sound on demand' } },
      { id: 'onda', file: 'onda_energetica.html', icon: 'wave',
        nome: { it: 'Onda energetica', de: 'Energiewelle', fr: 'Vague d’énergie', en: 'Energy wave' },
        desc: { it: 'Linee luminose che seguono il mouse: tocca per creare onde di energia, con suoni elettronici rilassanti',
                de: 'Leuchtende Linien folgen der Maus: tippen für Energiewellen, mit entspannenden elektronischen Klängen',
                fr: 'Lignes lumineuses qui suivent la souris : touche pour créer des vagues d’énergie, avec des sons électroniques apaisants',
                en: 'Glowing lines follow the mouse: tap to create energy waves, with relaxing electronic sounds' } },
      { id: 'suoni', file: 'suoni_rilassanti.html', icon: 'sound',
        nome: { it: 'Suoni rilassanti', de: 'Entspannende Klänge', fr: 'Sons relaxants', en: 'Relaxing sounds' },
        desc: { it: 'Accendi pioggia, mare, vento e altri suoni veri, regola solo il volume di ognuno',
                de: 'Schalte Regen, Meer, Wind und andere echte Klänge ein, regle nur die Lautstärke',
                fr: 'Allume pluie, mer, vent et autres vrais sons, règle seulement le volume de chacun',
                en: 'Turn on rain, sea, wind and other real sounds, set only each volume' } },
    ];

    const ICONE = {
      drop:      ['Goccia', '<path d="M12 2.7l5.66 5.66a8 8 0 1 1-11.31 0z"/>'],
      breath:    ['Respiro', '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>'],
      light:     ['Luce', '<path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>'],
      wave:      ['Onda', '<path d="M2 12q2.5-6 5 0t5 0t5 0t5 0"/>'],
      sound:     ['Suono', '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/>'],
    };

    // Icone dell'interfaccia (non selezionabili)
    const UI = {
      back:     '<polyline points="15 18 9 12 15 6"/>',
      external: '<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>',
      frame:    '<rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/>',
      expand:   '<polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>',
      collapse: '<polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/>',
      search:   '<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
      open:     '<line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/>',
    };

    const svg = n => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONE[n]?.[1] ?? UI[n] ?? ICONE.drop[1]}</svg>`;
    const uiSvg = n => `<svg viewBox="0 0 24 24" aria-hidden="true">${UI[n]}</svg>`;
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

    // ===== Lingua globale (dal menu laterale di index.html) =====
    const LANG_KEY = 'mylollotool-lang';
    const LANGS = ['it', 'de', 'fr', 'en'];
    const T = {
      title:      { it: 'Antistress', de: 'Antistress', fr: 'Antistress', en: 'Antistress' },
      sub:        { it: 'Piccole pause per staccare la testa: apri una pagina e rilassati',
                    de: 'Kleine Pausen zum Abschalten: Seite öffnen und entspannen',
                    fr: 'Petites pauses pour décompresser : ouvre une page et détends-toi',
                    en: 'Little breaks to unwind: open a page and relax' },
      searchPh:   { it: 'Cerca...', de: 'Suchen...', fr: 'Rechercher...', en: 'Search...' },
      back:       { it: 'Indietro', de: 'Zurück', fr: 'Retour', en: 'Back' },
      newTab:     { it: 'Nuova scheda', de: 'Neuer Tab', fr: 'Nouvel onglet', en: 'New tab' },
      open:       { it: 'Apri', de: 'Öffnen', fr: 'Ouvrir', en: 'Open' },
      viewerFrameTitle: { it: 'Antistress', de: 'Antistress', fr: 'Antistress', en: 'Antistress' },
      expandTitle: { it: 'Allarga a tutta pagina', de: 'Auf volle Breite erweitern', fr: 'Élargir à toute la page', en: 'Expand to full page' },
      collapseTitle: { it: 'Torna alla larghezza normale', de: 'Zurück zur normalen Breite', fr: 'Revenir à la largeur normale', en: 'Back to normal width' },
      emptyFound: { it: 'Nessuna pagina trovata.', de: 'Keine Seite gefunden.', fr: 'Aucune page trouvée.', en: 'No pages found.' },
      count:      { it: '{n} pagine', de: '{n} Seiten', fr: '{n} pages', en: '{n} pages' },
    };
    let curLang = (function() {
      try {
        const g = localStorage.getItem(LANG_KEY);
        if (LANGS.includes(g)) return g;
      } catch (e) {}
      return 'it';
    })();
    function t(key, vars) {
      const e = T[key];
      let s = (!e ? key : (e[curLang] || e.it || key));
      if (vars) for (const k in vars) s = s.replace('{' + k + '}', vars[k]);
      return s;
    }
    const pn = p => (p.nome?.[curLang] || p.nome?.it || p.id);
    const pd = p => (p.desc?.[curLang] || p.desc?.it || '');

    // ===== Mini-anteprime vive (canvas leggeri, in pausa fuori schermo) =====
    const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const previews = []; // { id, ctx, W, H, visible }
    function paintPreview(p, time, dark) {
      const x = p.ctx, W = p.W, H = p.H;
      x.clearRect(0, 0, W, H);
      const teal = dark ? '94,234,212' : '13,148,136';
      const soft = dark ? '150,170,190' : '120,140,160';
      if (p.id === 'fluidi') {
        // macchie di colore che scorrono lente
        const hues = [168, 212, 265, 318, 190];
        x.save();
        x.globalCompositeOperation = dark ? 'lighter' : 'source-over';
        hues.forEach((h, i) => {
          const cx = W * (0.5 + 0.36 * Math.sin(time * (0.22 + i * 0.05) + i * 2.1));
          const cy = H * (0.5 + 0.34 * Math.cos(time * (0.19 + i * 0.04) + i * 1.3));
          const r = W * (0.16 + 0.05 * Math.sin(time * 0.4 + i));
          const g = x.createRadialGradient(cx, cy, 0, cx, cy, r);
          const sat = dark ? 85 : 70, li = dark ? 62 : 68;
          g.addColorStop(0, `hsla(${h},${sat}%,${li}%,.55)`);
          g.addColorStop(1, `hsla(${h},${sat}%,${li}%,0)`);
          x.fillStyle = g;
          x.beginPath(); x.arc(cx, cy, r, 0, 6.29); x.fill();
        });
        x.restore();
      } else if (p.id === 'respiro') {
        // tela di luce: scie colorate come nella pagina vera
        x.lineCap = 'round';
        const cols = ['143,211,193', '184,169,217', '243,197,139', '127,178,229'];
        if (!p.seeds) {
          p.seeds = Array.from({ length: 26 }, (_, i) => ({
            ox: Math.random() * 1000, oy: Math.random() * 1000,
            len: 0.5 + Math.random() * 0.9, sp: 0.25 + Math.random() * 0.5, ci: i % cols.length
          }));
        }
        p.seeds.forEach(s => {
          x.strokeStyle = `rgba(${cols[s.ci]},.8)`;
          x.lineWidth = 1.6;
          x.beginPath();
          let px = (s.ox + time * 22 * s.sp) % (W + 60), py = (s.oy + time * 12 * s.sp) % (H + 60);
          px -= 30; py -= 30;
          for (let k = 0; k <= 8; k++) {
            const qx = px + Math.sin((py * 0.02) + time * 0.9 + s.ox) * 22 * s.len - k * 7 * s.len;
            const qy = py + Math.cos((px * 0.02) - time * 0.7 + s.oy) * 16 * s.len - k * 5 * s.len;
            if (k === 0) x.moveTo(qx, qy); else x.lineTo(qx, qy);
          }
          x.stroke();
        });
      } else if (p.id === 'onda') {
        // linee luminose che ondeggiano
        const cols = [teal, dark ? '125,160,255' : '59,130,246', dark ? '200,150,255' : '139,92,246'];
        x.lineWidth = 2; x.lineCap = 'round';
        cols.forEach((c, li) => {
          x.strokeStyle = `rgba(${c},${0.85 - li * 0.18})`;
          x.beginPath();
          for (let px = 0; px <= W; px += 6) {
            const y = H * (0.42 + li * 0.12)
              + Math.sin(px * 0.018 + time * (1.1 + li * 0.3)) * (10 + li * 5)
              * Math.sin(time * 0.5 + li);
            if (px === 0) x.moveTo(px, y); else x.lineTo(px, y);
          }
          x.stroke();
        });
      } else {
        // suoni: barre morbide che respirano
        const n = 26, bw = W / n;
        for (let i = 0; i < n; i++) {
          const v = 0.25 + 0.55 * Math.abs(Math.sin(i * 0.7 + time * 1.4) * Math.sin(i * 0.23 - time * 0.7));
          const h = 4 + v * (H * 0.7);
          x.fillStyle = `rgba(${i % 5 === 0 ? soft : teal},${0.35 + v * 0.5})`;
          const bx = i * bw + bw * 0.28, by = (H - h) / 2;
          x.beginPath();
          if (x.roundRect) x.roundRect(bx, by, bw * 0.44, h, 3); else x.rect(bx, by, bw * 0.44, h);
          x.fill();
        }
      }
    }
    let pT = 0, pRunning = false;
    function pLoop() {
      pT += 0.016;
      const dark = document.body.classList.contains('dark');
      let any = false;
      previews.forEach(p => { if (p.visible) { any = true; paintPreview(p, pT, dark); } });
      if (any && !REDUCED) requestAnimationFrame(pLoop);
      else pRunning = false;
    }
    function pKick() {
      if (REDUCED) {
        const dark = document.body.classList.contains('dark');
        previews.forEach(p => { if (p.visible) paintPreview(p, 1.2, dark); });
        return;
      }
      if (!pRunning) { pRunning = true; requestAnimationFrame(pLoop); }
    }
    let pObs = null;
    function watchPreviews() {
      if (!('IntersectionObserver' in window)) { previews.forEach(p => p.visible = true); pKick(); return; }
      if (pObs) pObs.disconnect();
      pObs = new IntersectionObserver(es => {
        let changed = false;
        es.forEach(e => {
          const p = previews.find(q => q.cv === e.target);
          if (p && p.visible !== e.isIntersecting) { p.visible = e.isIntersecting; changed = true; }
        });
        if (changed) pKick();
      }, { threshold: 0.15 });
      previews.forEach(p => pObs.observe(p.cv));
    }

    // ===== Elementi =====
    const $ = id => document.getElementById(id);
    const container = $('container'), search = $('search');
    const viewer = $('viewer'), viewerFrame = $('viewer-frame');

    document.querySelectorAll('[data-i]').forEach(el => { el.outerHTML = uiSvg(el.dataset.i); });

    // ===== Visualizzazione =====
    function card(p) {
      return `
        <div class="card" data-id="${esc(p.id)}">
          <a class="preview" data-action="open" href="${esc(p.file)}" aria-label="${esc(pn(p))}">
            <canvas width="480" height="270" data-preview="${esc(p.id)}"></canvas>
            <span class="open-hint">${uiSvg('open')}${esc(t('open'))}</span>
          </a>
          <div class="cap"><h3>${svg(p.icon)}${esc(pn(p))}</h3>${pd(p) ? `<p>${esc(pd(p))}</p>` : ''}</div>
        </div>`;
    }

    function render() {
      const pill = $('countPill');
      if (pill) pill.textContent = t('count', { n: PAGES.length });
      const f = search.value.toLowerCase().trim();
      const list = PAGES.filter(p => [pn(p), pd(p)].join(' ').toLowerCase().includes(f));
      if (!list.length) {
        previews.length = 0;
        container.innerHTML = `<div class="empty">${esc(t('emptyFound'))}</div>`;
        return;
      }
      container.innerHTML = `<div class="grid">${list.map(card).join('')}</div>`;
      previews.length = 0;
      container.querySelectorAll('canvas[data-preview]').forEach(cv => {
        previews.push({ id: cv.dataset.preview, cv, ctx: cv.getContext('2d'), W: cv.width, H: cv.height, visible: true });
      });
      watchPreviews();
      pKick();
    }

    container.addEventListener('click', e => {
      const el = e.target.closest('[data-action="open"]');
      if (!el) return;
      e.preventDefault();
      const p = PAGES.find(x => x.id === el.closest('.card').dataset.id);
      if (p) openViewer(p);
    });

    search.addEventListener('input', render);

    // ===== Allarga a tutta pagina (come SCT Tool: .wrap 960px -> tutta larghezza) =====
    const EXP_KEY = 'mylollotool-antistress-expanded';
    function paintExpandBtn() {
      const b = $('btn-expand');
      if (!b) return;
      const ex = document.querySelector('.wrap').classList.contains('expanded');
      b.innerHTML = uiSvg(ex ? 'collapse' : 'expand');
      b.title = t(ex ? 'collapseTitle' : 'expandTitle');
      b.setAttribute('aria-pressed', String(ex));
    }
    function applyExpand(ex) {
      document.querySelector('.wrap').classList.toggle('expanded', ex);
      try { localStorage.setItem(EXP_KEY, ex ? '1' : '0'); } catch (e) {}
      paintExpandBtn();
    }
    try { applyExpand(localStorage.getItem(EXP_KEY) === '1'); } catch (e) {}
    $('btn-expand').onclick = () =>
      applyExpand(!document.querySelector('.wrap').classList.contains('expanded'));

    // ===== Visualizzatore integrato =====
    function openViewer(p) {
      $('viewer-title').textContent = pn(p);
      $('viewer-ext').href = p.file;
      viewerFrame.src = p.file;
      viewerFrame.title = pn(p);
      viewer.hidden = false;
    }
    function closeViewer() { viewer.hidden = true; viewerFrame.src = 'about:blank'; }
    $('btn-back').onclick = closeViewer;

    document.addEventListener('keydown', e => {
      if (e.key !== 'Escape') return;
      if (!viewer.hidden) closeViewer();
    });

    // ===== Tema globale (dal menu laterale di index.html) =====
    (function syncGlobalTheme() {
      const G = 'mylollotool-theme';
      function apply(th) { document.body.classList.toggle('dark', th === 'dark'); }
      try {
        const g = localStorage.getItem(G);
        if (g === 'dark' || g === 'light') apply(g);
      } catch (e) {}
      window.addEventListener('message', (e) => {
        if (e?.data?.type === G && (e.data.theme === 'dark' || e.data.theme === 'light')) {
          apply(e.data.theme);
          try { localStorage.setItem(G, e.data.theme); } catch (err) {}
        }
      });
      window.addEventListener('storage', (e) => {
        if (e.key === G && (e.newValue === 'dark' || e.newValue === 'light')) {
          apply(e.newValue);
        }
      });
    })();

    // ===== Lingua globale (dal menu laterale di index.html) =====
    function applyLang(l) {
      curLang = LANGS.includes(l) ? l : 'it';
      document.documentElement.lang = curLang;
      try { localStorage.setItem(LANG_KEY, curLang); } catch (e) {}
      document.title = t('title');
      document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
      document.querySelectorAll('[data-t-ph]').forEach(el => { el.placeholder = t(el.dataset.tPh); });
      document.querySelectorAll('[data-t-title]').forEach(el => { el.title = t(el.dataset.tTitle); });
      render();
      try { paintExpandBtn(); } catch (e) {}
    }
    window.addEventListener('message', (e) => {
      if (e?.data?.type === LANG_KEY && LANGS.includes(e.data.lang)) applyLang(e.data.lang);
    });
    window.addEventListener('storage', (e) => {
      if (e.key === LANG_KEY && LANGS.includes(e.newValue)) applyLang(e.newValue);
    });

    applyLang(curLang);
  </script>
