<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suoni rilassanti</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #F3F4F6; --surface: #FFFFFF; --surface-2: #F9FAFB;
    --text: #1F2937; --muted: #4B5563; --faint: #9CA3AF;
    --accent: #2563EB; --accent-ink: #1D4ED8; --border: #E5E7EB;
    --teal: #0D9488; --radius: 14px;
  }
  body.dark {
    --bg: #0D0D10; --surface: #141417; --surface-2: #1A1A1F;
    --text: #EEEEF0; --muted: #9898A8; --faint: #6B6B7A;
    --accent: #5B93FF; --accent-ink: #9DBCFF; --border: #2A2A35;
    --teal: #5EEAD4;
  }
  [hidden] { display: none !important; }
  body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 14px 24px 80px; overflow-x: clip; }
  .mlt-footer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    border-top: 1px solid var(--border); background: var(--surface); padding: 5px 18px;
    text-align: center; font-size: 0.7rem; color: var(--muted); }
  .mlt-footer a { color: inherit; text-decoration: none; font-weight: bold; }
  svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2;
        stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .wrap { max-width: 760px; margin: 0 auto; }

  /* Testata full-bleed come SCT Tool */
  header.page-head { display: flex; justify-content: space-between; align-items: center; gap: 14px;
    flex-wrap: nowrap; border-bottom: 2px solid #3B82F6; padding: 0 24px 8px; margin: 0 calc(50% - 50vw) 12px; width: 100vw; max-width: 100vw; min-height: 60px; }
  .page-head .brand { display: flex; align-items: center; gap: 12px; min-width: 0; margin-left: 52px; }
  .page-head .brand > div { min-width: 0; flex: 1; overflow: hidden; }
  .page-head h1 { color: var(--text); font-size: 20px; line-height: 1.25; margin: 0; display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -.4px; white-space: nowrap; }
  .page-head h1 svg { width: 20px; height: 20px; }
  .page-head .sub { color: var(--muted); font-size: 11px; margin: 1px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 600px) { .page-head .brand { margin-left: 54px; } }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; margin-bottom: 14px; box-shadow: 0 1px 2px rgba(16,24,40,.06); }
  body.dark .card { box-shadow: none; }
  .card h2 { font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .card h2::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  #viz { width: 100%; height: 120px; display: block; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); }
  .listen-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 10px; }
  .listen-row .grow { flex: 1; min-width: 160px; }
  .listen-row label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  .listen-row label output { font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  #status { font-size: 12px; color: var(--muted); margin-top: 8px; }
  #status b { color: var(--teal); }
  .ghostbtn { border: 1px solid var(--border); background: transparent; color: var(--muted); border-radius: 999px;
    padding: 8px 14px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .ghostbtn:hover { border-color: var(--accent); color: var(--accent-ink); }

  /* Righe suono: interruttore + volume, basta */
  .row { display: flex; gap: 12px; align-items: center; padding: 12px 4px; border-top: 1px solid var(--border); }
  .row:first-of-type { border-top: none; }
  .row .ic { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; flex: none;
    background: color-mix(in srgb, var(--teal) 12%, transparent); color: var(--teal); }
  .row .txt { flex: 1; min-width: 0; }
  .row .txt b { display: block; font-size: 15px; }
  .row .txt small { display: block; font-size: 11px; color: var(--muted); line-height: 1.4; }
  .row .txt small.warn { color: #B45309; }
  body.dark .row .txt small.warn { color: #FBBF24; }
  .row .ctl { display: flex; align-items: center; gap: 10px; flex: none; }
  .row input[type=range] { width: 110px; }
  @media (max-width: 480px) { .row input[type=range] { width: 84px; } }
  .row input[type=range]:disabled { opacity: .35; }

  /* Interruttore */
  .sw { position: relative; width: 52px; height: 30px; flex: none; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface-2); cursor: pointer; padding: 0; transition: background .2s, border-color .2s; }
  .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 24px; height: 24px; border-radius: 50%;
    background: var(--faint); transition: transform .2s, background .2s; }
  .sw[aria-checked="true"] { background: color-mix(in srgb, var(--teal) 30%, transparent); border-color: var(--teal); }
  .sw[aria-checked="true"]::after { transform: translateX(22px); background: var(--teal); }
  .sw.loading::after { background: var(--accent); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .4; } }

  .credit { font-size: 11px; color: var(--faint); line-height: 1.6; margin-top: 10px; }
  .credit a { color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>

<div class="wrap">
  <header class="page-head">
    <div class="brand"><div>
      <h1><svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg><span data-tk="title">Suoni rilassanti</span></h1>
      <p class="sub" data-tk="sub">Accendi i suoni che vuoi e regola il volume di ognuno</p>
    </div></div>
  </header>

  <div class="card">
    <h2><span data-tk="listening">In ascolto</span></h2>
    <canvas id="viz" width="900" height="120" aria-hidden="true"></canvas>
    <div class="listen-row">
      <div class="grow">
        <label><span data-tk="master">Volume generale</span><output id="masterVal">70</output></label>
        <input type="range" id="master" min="0" max="100" step="1" value="70" aria-label="Volume generale">
      </div>
      <button class="ghostbtn" id="stopAll">✕ <span data-tk="stopAll">Spegni tutto</span></button>
    </div>
    <p id="status" role="status"></p>
  </div>

  <div class="card">
    <h2><span data-tk="sounds">Suoni</span></h2>
    <div id="list"></div>
    <p class="credit" id="credit"></p>
  </div>
</div>

<script>
(() => {
  'use strict';

  /* ============ Suoni: registrazioni vere (Wikimedia Commons, CORS *) ============
     Audio via Special:FilePath (reindirizza al file diretto). Se la rete
     non è disponibile, parte da solo un dolce rumore di riserva generato qui. */
  const CDN = 'https://commons.wikimedia.org/wiki/Special:FilePath/';
  const SOUNDS = {
    pioggia:  { file: 'Rain (1).ogg',                  page: 'https://commons.wikimedia.org/wiki/File:Rain_(1).ogg',
                icon: '<line x1="8" y1="15" x2="8.5" y2="19"/><line x1="12" y1="13" x2="12.5" y2="17"/><line x1="16" y1="15" x2="16.5" y2="19"/><path d="M20 13.5A8 8 0 0 0 4 13.5"/>', def: 65 },
    mare:     { file: 'Oceanwavescrushing.ogg',         page: 'https://commons.wikimedia.org/wiki/File:Oceanwavescrushing.ogg',
                icon: '<path d="M2 12q2.5-6 5 0t5 0t5 0t5 0"/><path d="M2 17q2.5-6 5 0t5 0t5 0t5 0"/>', def: 70 },
    vento:    { file: 'Vento fisterra.ogg',             page: 'https://commons.wikimedia.org/wiki/File:Vento_fisterra.ogg',
                icon: '<path d="M9.59 4.59A2 2 0 1 1 11 8H2"/><path d="M17.73 7.73A2.5 2.5 0 1 1 19.5 12H2"/><path d="M12.59 19.41A2 2 0 1 0 14 16H2"/>', def: 55 },
    ruscello: { file: 'Flowing-water-100019.ogg',       page: 'https://commons.wikimedia.org/wiki/File:Flowing-water-100019.ogg',
                icon: '<path d="M6 3v6a6 6 0 0 0 12 0V3"/><path d="M6 3c0 3 6 3 6 6M12 3c0 3 6 3 6 6"/>', def: 60 },
    fuoco:    { file: 'Campfire sound ambience.ogg',    page: 'https://commons.wikimedia.org/wiki/File:Campfire_sound_ambience.ogg',
                icon: '<path d="M12 2.7l5.66 5.66a8 8 0 1 1-11.31 0z"/>', def: 60 },
    uccelli:  { file: 'Birdsong morning 01.ogg',        page: 'https://commons.wikimedia.org/wiki/File:Birdsong_morning_01.ogg',
                icon: '<path d="M16 7h.01"/><path d="M3.4 18H12a8 8 0 0 0 8-8V7a4 4 0 0 0-7.28-2.3L2 20"/><path d="M20 7a4 4 0 0 1 1 2.9"/>', def: 50 },
    grilli:   { file: 'Grasshoppers.ogg',               page: 'https://commons.wikimedia.org/wiki/File:Grasshoppers.ogg',
                icon: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/>', def: 45 },
    tuono:    { file: 'Thunder.ogg',                    page: 'https://commons.wikimedia.org/wiki/File:Thunder.ogg',
                icon: '<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>', def: 50 },
  };
  const ORDER = ['pioggia', 'mare', 'vento', 'ruscello', 'fuoco', 'uccelli', 'grilli', 'tuono'];

  /* ================= i18n ================= */
  const LANG_KEY = 'mylollotool-lang';
  const LANGS = ['it', 'de', 'fr', 'en'];
  const T = {
    title: { it: 'Suoni rilassanti', de: 'Entspannende Klänge', fr: 'Sons relaxants', en: 'Relaxing sounds' },
    sub: { it: 'Accendi i suoni che vuoi e regola il volume di ognuno',
           de: 'Schalte die Klänge ein, die du willst, und regle die Lautstärke',
           fr: 'Allume les sons que tu veux et règle le volume de chacun',
           en: 'Turn on the sounds you want and set each volume' },
    listening: { it: 'In ascolto', de: 'Hören', fr: 'Écoute', en: 'Listening' },
    sounds: { it: 'Suoni', de: 'Klänge', fr: 'Sons', en: 'Sounds' },
    master: { it: 'Volume generale', de: 'Gesamtlautstärke', fr: 'Volume général', en: 'Master volume' },
    stopAll: { it: 'Spegni tutto', de: 'Alle aus', fr: 'Tout éteindre', en: 'Turn all off' },
    on: { it: 'acceso', de: 'an', fr: 'allumé', en: 'on' },
    off: { it: 'spento', de: 'aus', fr: 'éteint', en: 'off' },
    loading: { it: 'caricamento…', de: 'lädt…', fr: 'chargement…', en: 'loading…' },
    synth: { it: 'senza rete: versione di riserva', de: 'offline: Ersatzversion', fr: 'hors ligne : version de secours', en: 'offline: fallback version' },
    tapToStart: { it: 'Tocca un interruttore per iniziare', de: 'Tippe auf einen Schalter, um zu starten', fr: 'Touche un interrupteur pour commencer', en: 'Flip a switch to start' },
    active: { it: '{n} in riproduzione', de: '{n} laufen', fr: '{n} en écoute', en: '{n} playing' },
    silent: { it: 'Tutto spento', de: 'Alles aus', fr: 'Tout éteint', en: 'All off' },
    credit: { it: 'Registrazioni vere da Wikimedia Commons (pioggia, onde, vento, ruscello, falò, uccelli, cavallette, tuono). Senza rete suona una dolce riserva generata dal browser.',
             de: 'Echte Aufnahmen von Wikimedia Commons (Regen, Wellen, Wind, Bach, Lagerfeuer, Vögel, Grashüpfer, Donner). Ohne Netz spielt eine sanfte Ersatzversion aus dem Browser.',
             fr: 'Vrais enregistrements de Wikimedia Commons (pluie, vagues, vent, ruisseau, feu, oiseaux, sauterelles, tonnerre). Hors ligne, une douce version de secours générée par le navigateur.',
             en: 'Real recordings from Wikimedia Commons (rain, waves, wind, stream, campfire, birds, grasshoppers, thunder). Offline, a gentle browser-made fallback plays.' },
    nPioggia: { it: 'Pioggia', de: 'Regen', fr: 'Pluie', en: 'Rain' },
    nMare: { it: 'Mare', de: 'Meer', fr: 'Mer', en: 'Sea' },
    nVento: { it: 'Vento', de: 'Wind', fr: 'Vent', en: 'Wind' },
    nRuscello: { it: 'Ruscello', de: 'Bach', fr: 'Ruisseau', en: 'Stream' },
    nFuoco: { it: 'Fuoco', de: 'Feuer', fr: 'Feu', en: 'Fire' },
    nUccelli: { it: 'Uccelli', de: 'Vögel', fr: 'Oiseaux', en: 'Birds' },
    nGrilli: { it: 'Grilli', de: 'Grillen', fr: 'Grillons', en: 'Crickets' },
    nTuono: { it: 'Tuono', de: 'Donner', fr: 'Tonnerre', en: 'Thunder' },
    dPioggia: { it: 'Pioggia vera sui vetri', de: 'Echter Regen auf Glas', fr: 'Vraie pluie sur les vitres', en: 'Real rain on glass' },
    dMare: { it: 'Onde vere sulla riva', de: 'Echte Wellen am Ufer', fr: 'Vraies vagues sur la rive', en: 'Real waves on the shore' },
    dVento: { it: 'Vento vero tra gli alberi', de: 'Echter Wind in den Bäumen', fr: 'Vrai vent dans les arbres', en: 'Real wind in the trees' },
    dRuscello: { it: 'Acqua vera che scorre', de: 'Echt fließendes Wasser', fr: 'Vraie eau qui coule', en: 'Real flowing water' },
    dFuoco: { it: 'Falò vero che scoppietta', de: 'Echtes knisterndes Feuer', fr: 'Vrai feu qui crépite', en: 'Real crackling fire' },
    dUccelli: { it: 'Uccelli veri del mattino', de: 'Echte Morgenvögel', fr: 'Vrais oiseaux du matin', en: 'Real morning birds' },
    dGrilli: { it: 'Grilli veri d’estate', de: 'Echte Sommergrillen', fr: 'Vrais grillons d’été', en: 'Real summer crickets' },
    dTuono: { it: 'Tuono vero in lontananza', de: 'Echter ferner Donner', fr: 'Vrai tonnerre lointain', en: 'Real distant thunder' },
  };
  let curLang = 'it';
  try { const g = localStorage.getItem(LANG_KEY); if (LANGS.includes(g)) curLang = g; } catch (e) {}
  const tr = k => { const e = T[k]; return (!e ? k : (e[curLang] || e.it || k)); };
  const cap = k => 'n' + k[0].toUpperCase() + k.slice(1);
  const sndName = t => tr(cap(t));
  const sndDesc = t => tr('d' + t[0].toUpperCase() + t.slice(1));

  /* ================= Stato ================= */
  const STORE = 'mylollotool-suoni-v2';
  const OLD = 'mylollotool-suoni-v1';
  const st = { master: 70, s: {} };
  ORDER.forEach(t => { st.s[t] = { on: false, vol: SOUNDS[t].def }; });
  function save() {
    try { localStorage.setItem(STORE, JSON.stringify({ master: st.master, s: st.s })); } catch (e) {}
  }
  function load() {
    try {
      const o = JSON.parse(localStorage.getItem(STORE));
      if (o && o.s) {
        if (isFinite(o.master)) st.master = Math.min(100, Math.max(0, +o.master));
        ORDER.forEach(t => {
          const v = o.s[t];
          if (v && isFinite(v.vol)) st.s[t].vol = Math.min(100, Math.max(0, +v.vol));
          if (v && v.on === true) st.s[t].on = true;
        });
        return;
      }
    } catch (e) {}
    // Prima volta: prova a riusare i volumi del vecchio mix, tutto spento
    try {
      const o = JSON.parse(localStorage.getItem(OLD));
      if (o && Array.isArray(o.channels)) o.channels.forEach(c => {
        if (st.s[c.type] && isFinite(c.vol)) st.s[c.type].vol = Math.min(100, Math.max(0, +c.vol));
      });
      if (o && isFinite(o.master)) st.master = Math.min(100, Math.max(0, +o.master));
    } catch (e) {}
  }

  /* ================= Motore audio ================= */
  let AC = null, master = null, analyser = null, noiseBuf = null;
  const bufs = {};      // type -> AudioBuffer (registrazione vera)
  const loading = {};   // type -> Promise
  const live = {};      // type -> { stop() }
  const synthOn = {};   // type -> true se sta usando la riserva

  function ensureCtx() {
    if (!AC) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      AC = new Ctx();
      master = AC.createGain();
      analyser = AC.createAnalyser();
      analyser.fftSize = 256;
      analyser.smoothingTimeConstant = 0.75;
      master.connect(analyser);
      analyser.connect(AC.destination);
      const len = AC.sampleRate * 2;
      noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      master.gain.value = (st.master / 100) * 0.9;
    }
    if (AC.state === 'suspended') AC.resume();
    return AC;
  }

  function loadReal(type) {
    if (bufs[type]) return Promise.resolve(bufs[type]);
    if (loading[type]) return loading[type];
    loading[type] = fetch(CDN + encodeURIComponent(SOUNDS[type].file))
      .then(r => { if (!r.ok) throw new Error('http ' + r.status); return r.arrayBuffer(); })
      .then(ab => ensureCtx().decodeAudioData(ab))
      .then(b => { bufs[type] = b; delete loading[type]; return b; })
      .catch(err => { delete loading[type]; throw err; });
    return loading[type];
  }

  function startReal(type) {
    const g = AC.createGain();
    g.gain.value = 0;
    g.connect(master);
    const src = AC.createBufferSource();
    src.buffer = bufs[type]; src.loop = true;
    src.connect(g); src.start();
    const target = (st.s[type].vol / 100) * 0.9;
    g.gain.setTargetAtTime(target, AC.currentTime, 0.8);
    live[type] = { stop(fast) {
      try {
        g.gain.setTargetAtTime(0, AC.currentTime, fast ? 0.05 : 0.3);
        const s = src;
        setTimeout(() => { try { s.stop(); } catch (e) {} try { g.disconnect(); } catch (e) {} }, fast ? 150 : 900);
      } catch (e) {}
      delete live[type];
    }, gain: g };
  }

  /* Riserva senza rete: dolce rumore filtrato, uguale per tutti ma intonato */
  const SYNTH = {
    pioggia:  { type: 'highpass', f: 4200, v: 0.20 },
    mare:     { type: 'lowpass',  f: 480,  v: 0.45, lfo: 0.09 },
    vento:    { type: 'bandpass', f: 520,  v: 0.35, lfo: 0.07 },
    ruscello: { type: 'bandpass', f: 2100, v: 0.22 },
    fuoco:    { type: 'lowpass',  f: 360,  v: 0.20 },
    uccelli:  { type: 'bandpass', f: 3000, v: 0.10, lfo: 0.6 },
    grilli:   { type: 'highpass', f: 5000, v: 0.08, lfo: 1.7 },
    tuono:    { type: 'lowpass',  f: 130,  v: 0.40, lfo: 0.05 },
  };
  function startSynth(type) {
    const c = SYNTH[type];
    const flt = AC.createBiquadFilter(); flt.type = c.type; flt.frequency.value = c.f; flt.Q.value = 0.7;
    const g = AC.createGain(); g.gain.value = 0;
    const src = AC.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    src.connect(flt); flt.connect(g); g.connect(master); src.start();
    let lfo = null;
    if (c.lfo) {
      lfo = AC.createOscillator(); lfo.frequency.value = c.lfo;
      const lg = AC.createGain(); lg.gain.value = c.v * 0.45;
      lfo.connect(lg); lg.connect(g.gain); lfo.start();
    }
    g.gain.setTargetAtTime((st.s[type].vol / 100) * c.v, AC.currentTime, 0.8);
    synthOn[type] = true; paintRow(type);
    live[type] = { stop(fast) {
      try {
        g.gain.setTargetAtTime(0, AC.currentTime, 0.2);
        setTimeout(() => {
          try { src.stop(); } catch (e) {}
          try { if (lfo) lfo.stop(); } catch (e) {}
          try { g.disconnect(); flt.disconnect(); } catch (e) {}
        }, 700);
      } catch (e) {}
      delete live[type];
    }, gain: g };
  }

  function stopType(type, fast) {
    if (live[type]) live[type].stop(fast);
    if (synthOn[type]) { delete synthOn[type]; paintRow(type); }
  }

  function turnOn(type) {
    ensureCtx();
    stopType(type, true);
    paintRow(type, true);
    loadReal(type).then(() => {
      if (!st.s[type].on) return; // nel frattempo è stato spento
      if (live[type]) live[type].stop(true);
      startReal(type);
      paintRow(type);
      paintStatus();
    }).catch(() => {
      if (!st.s[type].on) { paintRow(type); return; }
      startSynth(type); // senza rete: riserva
      paintStatus();
    });
  }

  function refreshVol(type) {
    if (!AC || !live[type]) return;
    const base = live[type].gain;
    if (synthOn[type]) base.gain.setTargetAtTime((st.s[type].vol / 100) * SYNTH[type].v, AC.currentTime, 0.15);
    else base.gain.setTargetAtTime((st.s[type].vol / 100) * 0.9, AC.currentTime, 0.15);
  }

  /* ================= Grafica: tante linee su/giù (bassi ↔ acuti) ================= */
  const viz = document.getElementById('viz');
  const vx = viz.getContext('2d');
  const N = 72;
  const smooth = new Array(N).fill(0);
  const freq = new Uint8Array(128);
  let phase = 0;
  function anyOn() { return ORDER.some(t => st.s[t].on); }
  function drawViz() {
    requestAnimationFrame(drawViz);
    const W = viz.width, H = viz.height, mid = H / 2;
    vx.clearRect(0, 0, W, H);
    const dark = document.body.classList.contains('dark');
    let hasAudio = false;
    try {
      if (analyser && anyOn() && AC && AC.state === 'running') {
        analyser.getByteFrequencyData(freq);
        hasAudio = true;
      }
    } catch (e) {}
    phase += 0.03;
    const col = dark ? '94,234,212' : '13,148,136';
    vx.lineWidth = 2;
    vx.lineCap = 'round';
    for (let i = 0; i < N; i++) {
      let v;
      if (hasAudio) {
        // sinistra = bassi, destra = acuti
        const bin = Math.floor((i / N) * 90) + 2;
        v = freq[bin] / 255;
      } else {
        v = 0.06 + 0.05 * Math.sin(phase + i * 0.35) * Math.sin(phase * 0.6 + i * 0.11);
      }
      smooth[i] += (v - smooth[i]) * (hasAudio ? 0.35 : 0.08);
      const h = Math.max(3, smooth[i] * (H - 14));
      const x = 8 + (i / (N - 1)) * (W - 16);
      const a = anyOn() ? 0.9 : 0.35;
      vx.strokeStyle = `rgba(${col},${a})`;
      vx.beginPath();
      vx.moveTo(x, mid - h / 2);
      vx.lineTo(x, mid + h / 2);
      vx.stroke();
    }
    // linea centrale d'ascolto
    vx.strokeStyle = `rgba(${col},${anyOn() ? 0.25 : 0.15})`;
    vx.lineWidth = 1;
    vx.beginPath();
    vx.moveTo(0, mid);
    vx.lineTo(W, mid);
    vx.stroke();
  }

  /* ================= UI ================= */
  const $ = id => document.getElementById(id);
  const listEl = $('list'), statusEl = $('status');
  const masterSlider = $('master'), masterVal = $('masterVal');

  function activeCount() { return ORDER.filter(t => st.s[t].on).length; }

  function paintStatus() {
    const n = activeCount();
    if (!AC || AC.state !== 'running') { statusEl.innerHTML = tr('tapToStart'); return; }
    statusEl.innerHTML = n === 0
      ? tr('silent')
      : '<b>♪ ' + tr('active').replace('{n}', n) + '</b>';
  }

  function paintRow(type, isLoading) {
    const s = st.s[type];
    const row = listEl.querySelector(`[data-row="${type}"]`);
    if (!row) return;
    const sw = row.querySelector('.sw');
    sw.setAttribute('aria-checked', String(s.on));
    sw.classList.toggle('loading', !!isLoading);
    sw.setAttribute('aria-label', sndName(type) + ': ' + tr(s.on ? 'on' : 'off'));
    const sl = row.querySelector('input[type=range]');
    sl.value = s.vol;
    sl.disabled = !s.on;
    row.querySelector('output').textContent = s.vol;
    let note = sndDesc(type);
    let warn = false;
    if (isLoading) { note = tr('loading'); }
    else if (synthOn[type]) { note = tr('synth'); warn = true; }
    const sm = row.querySelector('small');
    sm.textContent = note;
    sm.classList.toggle('warn', warn);
  }

  function renderList() {
    listEl.innerHTML = ORDER.map(t => `
      <div class="row" data-row="${t}">
        <span class="ic"><svg viewBox="0 0 24 24">${SOUNDS[t].icon}</svg></span>
        <span class="txt"><b>${sndName(t)}</b><small></small></span>
        <span class="ctl">
          <input type="range" min="0" max="100" step="1" value="${st.s[t].vol}" aria-label="${sndName(t)} volume">
          <output style="font-size:12px;color:var(--muted);min-width:24px;text-align:right;font-variant-numeric:tabular-nums">${st.s[t].vol}</output>
          <button class="sw" role="switch" data-sw="${t}" aria-checked="false" aria-label="${sndName(t)}"></button>
        </span>
      </div>`).join('');
    ORDER.forEach(t => paintRow(t));
  }

  listEl.addEventListener('click', e => {
    const b = e.target.closest('[data-sw]');
    if (!b) return;
    const t = b.dataset.sw;
    st.s[t].on = !st.s[t].on;
    if (st.s[t].on) turnOn(t);
    else { if (AC) stopType(t); paintRow(t); }
    save(); paintStatus();
  });
  listEl.addEventListener('input', e => {
    const inp = e.target.closest('input[type=range]');
    if (!inp) return;
    const row = inp.closest('[data-row]');
    const t = row.dataset.row;
    st.s[t].vol = +inp.value;
    row.querySelector('output').textContent = inp.value;
    refreshVol(t);
    save();
  });

  masterSlider.value = st.master; masterVal.textContent = st.master;
  masterSlider.addEventListener('input', () => {
    st.master = +masterSlider.value;
    masterVal.textContent = st.master;
    if (AC) master.gain.setTargetAtTime((st.master / 100) * 0.9, AC.currentTime, 0.15);
    save();
  });

  $('stopAll').addEventListener('click', () => {
    ORDER.forEach(t => { st.s[t].on = false; if (AC) stopType(t); paintRow(t); });
    save(); paintStatus();
  });

  // Primo tocco: fa partire i suoni rimasti accesi dal salvataggio
  function kickstart() {
    if (!anyOn()) { paintStatus(); return; }
    ensureCtx();
    ORDER.forEach(t => { if (st.s[t].on && !live[t]) turnOn(t); });
    paintStatus();
  }
  addEventListener('pointerdown', function once() {
    if (AC && AC.state === 'running') return;
    kickstart();
  });
  addEventListener('keydown', function once() {
    if (AC && AC.state === 'running') return;
    kickstart();
  });

  /* ================= Tema + lingua globali ================= */
  (function syncTheme() {
    const G = 'mylollotool-theme';
    const apply = th => document.body.classList.toggle('dark', th === 'dark');
    try { const g = localStorage.getItem(G); if (g === 'dark' || g === 'light') apply(g); } catch (e) {}
    addEventListener('message', e => {
      if (e?.data?.type === G && (e.data.theme === 'dark' || e.data.theme === 'light')) {
        apply(e.data.theme);
        try { localStorage.setItem(G, e.data.theme); } catch (err) {}
      }
      if (e?.data?.type === LANG_KEY && LANGS.includes(e.data.lang)) applyLang(e.data.lang);
    });
    addEventListener('storage', e => {
      if (e.key === G && (e.newValue === 'dark' || e.newValue === 'light')) apply(e.newValue);
      if (e.key === LANG_KEY && LANGS.includes(e.newValue)) applyLang(e.newValue);
    });
  })();

  function applyLang(l) {
    if (LANGS.includes(l)) curLang = l;
    document.documentElement.lang = curLang;
    try { localStorage.setItem(LANG_KEY, curLang); } catch (e) {}
    document.title = tr('title');
    document.querySelectorAll('[data-tk]').forEach(el => { el.textContent = tr(el.dataset.tk); });
    renderList();
    $('credit').textContent = tr('credit');
    paintStatus();
  }

  /* ================= Boot ================= */
  load();
  masterSlider.value = st.master; masterVal.textContent = st.master;
  applyLang(curLang);
  drawViz();
})();
</script>
