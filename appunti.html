<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Appunti</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    /* Palette DataSales: light #F3F4F6/#FFFFFF, dark #0D0D10/#141417 */
    body { font-family: system-ui, sans-serif; background: #F3F4F6; color: #1F2937; padding: 14px 24px 48px; overflow-x: clip; }
    /* Footer fisso stile SCT Tool (uguale su tutte le pagine) */
    .mlt-footer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      border-top: 1px solid #E5E7EB; background: #FFFFFF; padding: 5px 18px;
      text-align: center; font-size: 0.7rem; color: #4B5563; }
    .mlt-footer a { color: inherit; text-decoration: none; font-weight: bold; }
    body.dark .mlt-footer { background: #141417; border-color: #2A2A35; color: #9898A8; }
    .wrap { max-width: 960px; margin: 0 auto; transition: max-width .5s cubic-bezier(.4,0,.2,1); }
    .wrap.expanded { max-width: none; }

    svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2;
          stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

    /* Testata full-bleed come SCT Tool: riga blu da bordo a bordo sotto il pulsante menu,
       titolo sempre a destra del pulsante via CSS (mai azzerato, nessuno spostamento JS) */
    header.page-head { display: flex; justify-content: space-between; align-items: center; gap: 14px;
      flex-wrap: nowrap; border-bottom: 2px solid #3B82F6; padding: 0 24px 8px; margin: 0 calc(50% - 50vw) 12px; width: 100vw; max-width: 100vw; min-height: 60px; }
    .page-head .brand { display: flex; align-items: center; gap: 12px; min-width: 0; margin-left: 52px; transition: margin-left .25s ease; }
    .page-head .brand > div { min-width: 0; flex: 1; overflow: hidden; }
    .page-head h1 { white-space: nowrap; }
    .page-head h1 { color: #1F2937; font-size: 20px; line-height: 1.25; margin: 0; display: flex; align-items: center; gap: 10px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 800; letter-spacing: -.4px; }
    .page-head h1 svg { width: 20px; height: 20px; flex: none; }
    .page-head .sub { color: #4B5563; font-size: 11px; margin: 1px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .page-head .right { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; justify-content: flex-end; position: relative; flex: none; }
    .pill { height: 40px; display: inline-flex; align-items: center; gap: 8px; padding: 0 14px;
      border: 1px solid #E5E7EB; border-radius: 999px; background: transparent; color: #4B5563;
      font-size: 12px; font-weight: 600; white-space: nowrap; }
    .pill svg { width: 14px; height: 14px; }
    .iconbtn { width: 40px; height: 40px; padding: 0; display: inline-flex; align-items: center; justify-content: center;
      border-radius: 999px; border: 1px solid #E5E7EB; background: #fff; color: #1F2937; cursor: pointer; flex: none; }
    .iconbtn:hover { background: #E5E7EB; }
    .iconbtn svg { width: 16px; height: 16px; }
    body.dark .page-head h1 { color: #EEEEF0; }
    body.dark .page-head .sub { color: #9898A8; }
    body.dark .pill { border-color: #2A2A35; color: #9898A8; }
    body.dark .iconbtn { background: #141417; border-color: #2A2A35; color: #EEEEF0; }
    body.dark .iconbtn:hover { background: #1F1F26; }
    /* Menu ingranaggio stile Turni */
    #drop { display: none; position: absolute; top: calc(100% + 8px); right: 0; z-index: 70;
      flex-direction: column; gap: 4px; min-width: 210px; background: #fff; border: 1px solid #E5E7EB;
      border-radius: 12px; padding: 8px; box-shadow: 0 16px 40px rgba(0,0,0,.18), 0 4px 12px rgba(0,0,0,.10); }
    .right.open #drop { display: flex; }
    #drop .btn { width: 100%; justify-content: flex-start; }
    body.dark #drop { background: #141417; border-color: #2A2A35; box-shadow: 0 16px 40px rgba(0,0,0,.5); }
    @media (max-width: 600px) {
      .page-head { gap: 8px; }
      .page-head .brand { margin-left: 54px; }
      .page-head .right { gap: 8px; }
      .pill { padding: 0 10px; font-size: 11px; }
    }

    /* Barra strumenti */
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 8px; }
    .search-box { position: relative; flex: 1; min-width: 200px; max-width: 400px; }
    .search-box svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #9CA3AF; }
    #search { width: 100%; padding: 10px 14px 10px 40px; border: 1px solid #E5E7EB; border-radius: 8px; font-size: 15px; background: #FFFFFF; color: #1F2937; }
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border: 1px solid #E5E7EB;
           border-radius: 8px; background: #fff; color: #1F2937; font: inherit; font-size: 14px;
           cursor: pointer; text-decoration: none; white-space: nowrap; }
    .btn:hover { background: #E5E7EB; }
    .btn.primary { background: #2563EB; border-color: #2563EB; color: #fff; }
    .btn.primary:hover { background: #3B82F6; border-color: #3B82F6; }
    .btn.danger { color: #9B1C1C; }
    .btn.danger:hover { background: #FDE8E8; }
    /* Filtri tipo */
    .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .chip { padding: 7px 14px; border: 1px solid #E5E7EB; border-radius: 999px; background: #fff;
            color: #4B5563; font-size: 13px; font-weight: 600; cursor: pointer; }
    .chip.active { border-color: #2563EB; background: #DBEAFE; color: #1D4ED8; }

    /* Griglia masonry stile My JW */
    .grid { column-count: 2; column-gap: 14px; }
    .wrap.expanded .grid { column-count: 3; }
    @media (max-width: 1100px) { .wrap.expanded .grid { column-count: 2; } }
    @media (max-width: 640px) { .grid { column-count: 1; } .wrap.expanded .grid { column-count: 1; } }
    .note { position: relative; background: #fff; border: 1.5px solid #E5E7EB; border-radius: 10px;
            box-shadow: 0 2px 10px rgba(0,0,0,.04); break-inside: avoid; margin-bottom: 14px;
            cursor: pointer; overflow: hidden; transition: transform .15s, box-shadow .15s; animation: cardIn .25s ease; }
    @keyframes cardIn { from { opacity: 0; transform: scale(.95); } to { opacity: 1; transform: none; } }
    .note:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.10); }
    .note:active { transform: scale(.97); }
    .note.tel { border-left: 4px solid #3B82F6; }
    .note-body { padding: 12px 14px 8px; }
    .note-title { font-size: 15px; font-weight: 700; line-height: 1.35; margin-bottom: 6px; word-break: break-word; }
    .note-num { font-size: 16px; font-weight: 800; margin-bottom: 2px; word-break: break-word; }
    .note-num a { color: inherit; text-decoration: none; }
    .note-num a:hover { text-decoration: underline; color: #2563EB; }
    .note-meta { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #4B5563; margin-bottom: 6px; }
    .note-meta svg { width: 14px; height: 14px; }
    .note-preview { font-size: 13px; color: #4B5563; line-height: 1.5; word-break: break-word; max-height: 200px; overflow: hidden; position: relative; }
    .note-preview ul, .note-preview ol { padding-left: 20px; margin: 4px 0; }
    .note-preview a { color: #2563EB; }
    .note-preview.is-cut::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 40px;
      background: linear-gradient(to bottom, rgba(255,255,255,0), #fff); pointer-events: none; }
    body.dark .note-preview.is-cut::after { background: linear-gradient(to bottom, rgba(20,20,23,0), #141417); }
    .note-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; padding-top: 8px; border-top: 1px solid #F3F4F6; }
    /* Orari strutturati */
    #schedRows { display: flex; flex-direction: column; border: 1px solid #E5E7EB; border-radius: 8px; padding: 4px 10px; background: #F9FAFB; }
    body.dark #schedRows { background: #1A1A1F; border-color: #2A2A35; }
    .srow { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px dashed #E5E7EB; }
    .srow:last-child { border-bottom: none; }
    body.dark .srow { border-color: #2A2A35; }
    .srow input[type="checkbox"] { width: 16px; height: 16px; flex: none; accent-color: #2563EB; cursor: pointer; }
    .srow .sname { width: 34px; flex: none; font-size: 13px; font-weight: 700; }
    .srow.off .sname { opacity: .45; }
    .srow .sslots { display: none; gap: 6px; flex-wrap: wrap; flex: 1; }
    .srow:not(.off) .sslots { display: flex; }
    /* Modalità orari semplice/dettagliata */
    .seg { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    .slot { display: inline-flex; align-items: center; gap: 4px; }
    .seg { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    #schedSimple { display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
    .ssrow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .ssrow select, .ssrow input.tin, .slot input.tin { padding: 5px 6px; border: 1px solid #E5E7EB; border-radius: 6px; font-size: 13px; background: #FFFFFF; color: #1F2937; }
    .ssrow input.tin, .slot input.tin { width: 96px; }
    body.dark .ssrow select, body.dark .ssrow input.tin, body.dark .slot input.tin { background: #141417; border-color: #2A2A35; color: #EEEEF0; color-scheme: dark; }
    .ssadd { display: flex; justify-content: flex-end; }
    .sbtn { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; flex: none;
            border-radius: 50%; border: 1px solid #E5E7EB; background: #fff; color: #4B5563; cursor: pointer; font-size: 15px; line-height: 1; }
    .sbtn:hover { background: #E5E7EB; }
    body.dark .sbtn { background: #141417; border-color: #2A2A35; color: #9898A8; }
    .sched { display: flex; flex-direction: column; gap: 2px; margin: 6px 0; font-size: 12.5px; color: #4B5563; }
    /* Orari in alto a destra nella card */
    .note-top { display: flex; gap: 12px; align-items: flex-start; }
    .note-top .note-title { flex: 1; min-width: 0; }
    .note-top > span { flex: 1; min-width: 0; }
    .note-right { flex: none; max-width: 60%; margin-left: auto; text-align: right; }
    .note-right.sched { margin: 1px 0 0; }
    body.dark .sched { color: #9898A8; }
    .openline { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; }
    .odot { width: 8px; height: 8px; border-radius: 50%; background: #10B981; flex: none; }
    .odot.closed { background: #EF4444; }
    .note-date { font-size: 10px; color: #9CA3AF; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; }
    .note-tag { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #DBEAFE; color: #1D4ED8; }
    .note.tel .note-tag { background: #DBEAFE; }
    /* Nota appuntata: resta in cima, spillino in alto a destra (visibile al passaggio del mouse) */
    .note.pinned { border-color: #2563EB; }
    .note.pinned .note-body { padding-right: 44px; }
    .pinbtn { position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; padding: 0;
      display: inline-flex; align-items: center; justify-content: center; border-radius: 999px;
      border: 1px solid #E5E7EB; background: #fff; color: #9CA3AF; cursor: pointer;
      opacity: 0; transition: opacity .15s, background .15s, color .15s; z-index: 2; }
    .pinbtn svg { width: 15px; height: 15px; }
    .note:hover .pinbtn, .note:focus-within .pinbtn { opacity: 1; }
    .pinbtn:hover { background: #DBEAFE; color: #1D4ED8; }
    .pinbtn.on { opacity: 1; color: #2563EB; border-color: #2563EB; background: #DBEAFE; }
    @media (hover: none) { .pinbtn { opacity: 1; } }
    body.dark .note.pinned { border-color: #3B82F6; }
    body.dark .pinbtn { background: #141417; border-color: #2A2A35; color: #9898A8; }
    body.dark .pinbtn:hover { background: #1F1F26; color: #EEEEF0; }
    body.dark .pinbtn.on { color: #60A5FA; border-color: #3B82F6; background: #1A1A1F; }
    .pinrow { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .pinrow input { width: 16px; height: 16px; accent-color: #2563EB; cursor: pointer; }

    .empty { padding: 40px; text-align: center; color: #4B5563; background: #FFFFFF;
             border: 2px dashed #E5E7EB; border-radius: 10px; }

    /* Tema scuro */
    body.dark { background: #0D0D10; color: #EEEEF0; }
    body.dark #search { background: #141417; border-color: #2A2A35; color: #EEEEF0; }
    body.dark .btn { background: #141417; border-color: #2A2A35; color: #EEEEF0; }
    body.dark .btn:hover { background: #1F1F26; }
    body.dark .btn.primary { background: #3B82F6; border-color: #3B82F6; color: #fff; }
    body.dark .btn.danger { color: #FCA5A5; }
    body.dark .chip { background: #141417; border-color: #2A2A35; color: #9898A8; }
    body.dark .chip.active { background: #1A1A1F; border-color: #3B82F6; color: #60A5FA; }
    body.dark .note { background: #141417; border-color: #2A2A35; box-shadow: none; }
    body.dark .note-meta, body.dark .note-preview { color: #9898A8; }
    body.dark .note-num a:hover { color: #60A5FA; }
    body.dark .note-foot { border-color: #2A2A35; }
    body.dark .note-date { color: #5A5A70; }
    body.dark .note-tag { background: #1A1A1F; color: #60A5FA; }
    body.dark .empty { background: #141417; border-color: #2A2A35; color: #9898A8; }

    /* Editor */
    .modal { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center;
             padding: 20px; background: rgba(0,10,40,.5); }
    .dialog { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 640px; max-height: 100%;
              overflow: auto; padding: 20px; background: #fff; border-radius: 12px; position: relative; }
    body.dark .dialog { background: #141417; }
    /* Tasto tutto schermo in alto a destra nel visualizzatore */
    .dlg-full { position: absolute; top: 12px; right: 12px; width: 34px; height: 34px; }
    #viewer .dialog h2 { padding-right: 40px; }
    /* Visualizzatore a tutto schermo (classe, non API: funziona anche dentro l'iframe del menu) */
    #viewer.fs { padding: 0; }
    #viewer.fs .dialog { max-width: none; max-height: none; width: 100%; height: 100%; border-radius: 0; }
    .dialog h2 { font-size: 18px; display: flex; align-items: center; gap: 8px; }
    .dialog h2 svg { width: 20px; height: 20px; }
    .field { display: flex; flex-direction: column; gap: 5px; font-size: 14px; font-weight: 600; }
    .field input { padding: 9px 12px; border: 1px solid #E5E7EB; border-radius: 8px; font: inherit; font-weight: 400; font-size: 15px; background: #FFFFFF; color: #1F2937; }
    body.dark .field input { background: #1A1A1F; border-color: #2A2A35; color: #EEEEF0; }
    .telrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 480px) { .telrow { grid-template-columns: 1fr; } }
    /* Toolbar formattazione stile My JW */
    .toolbar-ed { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; padding: 6px;
                  border: 1px solid #E5E7EB; border-radius: 8px; background: #F9FAFB; }
    body.dark .toolbar-ed { background: #1A1A1F; border-color: #2A2A35; }
    .toolbtn { display: inline-flex; align-items: center; justify-content: center; min-width: 34px; height: 34px;
               padding: 0 7px; border: none; border-radius: 6px; background: transparent; color: #4B5563;
               cursor: pointer; font-size: 15px; font-weight: 800; }
    .toolbtn:hover { background: #E5E7EB; color: #1F2937; }
    body.dark .toolbtn { color: #9898A8; }
    body.dark .toolbtn:hover { background: #2A2A35; color: #EEEEF0; }
    .toolbtn svg { width: 17px; height: 17px; }
    .toolbtn.on { background: #DBEAFE; color: #1D4ED8; }
    body.dark .toolbtn.on { background: #1A1A1F; color: #60A5FA; }
    .toolsep { width: 1px; height: 22px; background: #E5E7EB; margin: 0 2px; }
    body.dark .toolsep { background: #2A2A35; }
    .palette { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px; border: 1px solid #E5E7EB;
               border-radius: 8px; background: #fff; }
    body.dark .palette { background: #1A1A1F; border-color: #2A2A35; }
    .swatch { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
    .swatch:hover { transform: scale(1.12); }
    .linkrow { display: flex; gap: 8px; flex-wrap: wrap; padding: 8px; border: 1px solid #E5E7EB; border-radius: 8px; background: #fff; }
    body.dark .linkrow { background: #1A1A1F; border-color: #2A2A35; }
    .linkrow input { flex: 1; min-width: 140px; padding: 8px 10px; border: 1px solid #E5E7EB; border-radius: 6px; font-size: 14px; background: #FFFFFF; color: #1F2937; }
    body.dark .linkrow input { background: #141417; border-color: #2A2A35; color: #EEEEF0; }
    #f-body { min-height: 180px; max-height: 40vh; overflow: auto; padding: 10px 12px; border: 1px solid #E5E7EB;
              border-radius: 8px; font-size: 15px; line-height: 1.55; background: #FFFFFF; color: #1F2937; outline: none; }
    #f-body:focus { border-color: #3B82F6; }
    body.dark #f-body { background: #1A1A1F; border-color: #2A2A35; color: #EEEEF0; }
    #f-body:empty:before { content: attr(data-ph); color: #9CA3AF; font-style: italic; }
    #f-src { min-height: 180px; max-height: 40vh; overflow: auto; padding: 10px 12px; border: 1px solid #E5E7EB;
             border-radius: 8px; font-size: 13px; line-height: 1.5; background: #FFFFFF; color: #1F2937; outline: none;
             font-family: ui-monospace, Consolas, monospace; white-space: pre-wrap; width: 100%; resize: vertical; }
    #f-src:focus { border-color: #3B82F6; }
    body.dark #f-src { background: #1A1A1F; border-color: #2A2A35; color: #EEEEF0; }
    #f-body ul, #f-body ol { padding-left: 22px; margin: 6px 0; }
    #f-body a { color: #2563EB; }
    #f-body .todo { display: flex; align-items: flex-start; gap: 8px; margin: 4px 0; }
    #f-body .todo input { width: 16px; height: 16px; margin-top: 3px; flex: none; accent-color: #2563EB; cursor: pointer; }
    /* Todo in anteprima card (statica) e visualizzatore (interattiva): sempre in colonna */
    .note-preview .todo-ro, #v-body .todo-ro { display: flex; align-items: flex-start; gap: 8px; margin: 4px 0; }
    .note-preview .todo-ro .box, #v-body .todo-ro .box { flex: none; width: 16px; text-align: center; line-height: 1.6; }
    #v-body .todo { display: flex; align-items: flex-start; gap: 8px; margin: 4px 0; }
    #v-body .todo input[type="checkbox"] { width: 16px; height: 16px; margin-top: 3px; flex: none; accent-color: #2563EB; cursor: pointer; }
    #v-body .todo.done .todo-txt { text-decoration: line-through; opacity: .6; }
    /* Visualizzatore */
    #v-body { font-size: 14px; line-height: 1.6; word-break: break-word; }
    #v-body ul, #v-body ol { padding-left: 22px; margin: 6px 0; }
    #v-body a { color: #2563EB; }
    #v-tel .note-num { font-size: 18px; margin: 4px 0 8px; }
    #v-tel .note-num a { color: inherit; text-decoration: none; }
    #v-tel .note-num a:hover { text-decoration: underline; color: #2563EB; }
    #v-tel .sched { font-size: 13px; margin-top: 8px; }
    .actions { display: flex; align-items: center; gap: 8px; }
    .actions .status { flex: 1; font-size: 12px; color: #9CA3AF; }
  </style>
</head>
<body>
<div class="wrap">

  <header class="page-head">
    <div class="brand"><div><h1><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><span data-t="title">Appunti</span></h1><p class="sub" data-t="sub">Numeri utili e note con formattazione</p></div></div>
    <div class="right" id="tools"><span class="pill" id="countPill"></span><button class="iconbtn" id="menuBtn" data-t-title="menuTitle" title="Menu"><svg viewBox="0 0 24 24"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg></button><button class="iconbtn" id="btn-expand" title="Allarga a tutta pagina"><span data-i="expand"></span></button><span id="drop"><button class="btn" id="btn-export" data-t-title="exportTitle" title="Scarica gli appunti come file .json"><span data-i="download"></span><span data-t="export">Esporta</span></button><button class="btn" id="btn-import" data-t-title="importTitle" title="Carica appunti da file .json"><span data-i="upload"></span><span data-t="import">Importa</span></button></span></div>
  </header>

  <div class="toolbar">

      return [
        { id: uid(), type: 'tel', title: 'Swisscom', numero: '0800 800 800', orario: '', hours: every('00:00', '23:59'), html: '', updated: now, pinned: false },

    // Appiattisce .todo annidati (l'editor poteva crearli con Invio + bottone checkbox):
    // un todo dentro un altro verrebbe renderizzato con due box sulla stessa riga.
    function flattenTodos(root) {
      if (!root || !root.querySelector) return;
      let nested;
      let guard = 0;
      while ((nested = root.querySelector('.todo .todo')) && guard++ < 50) {
        const outer = nested.parentElement ? nested.parentElement.closest('.todo') : null;
        if (!outer) break;
        outer.after(nested);
      }
    }

    // interactive=false -> card: righe statiche verticali (☐/☑)
    // interactive=true  -> visualizzatore: checkbox reali cliccabili
    function sanitizePreview(html, interactive) {
      const doc = new DOMParser().parseFromString('<div>' + (html || '') + '</div>', 'text/html');
      const cont = doc.body.firstChild;
      flattenTodos(cont);
      // Checkbox -> riga verticale (non inline)
      cont.querySelectorAll('.todo').forEach((td, idx) => {
        const inp = td.querySelector('input[type=checkbox]');
        const on = !!(inp && (inp.hasAttribute('checked') || inp.checked));
        if (interactive) {
          const wrap = doc.createElement('div');
          wrap.className = 'todo' + (on ? ' done' : '');
          wrap.setAttribute('data-idx', String(idx));

        e.preventDefault();
        if (txtEmpty) {
          // checkbox vuota + Enter = esci dalla lista (torna riga normale)
          const p = document.createElement('div');
          p.innerHTML = '<br>';
          todo.replaceWith(p);
          const nr = document.createRange();
          nr.selectNodeContents(p);
          nr.collapse(true);
          sel.removeAllRanges();
          sel.addRange(nr);
        } else {
          // spezza la riga: nuovo todo con il testo dopo il cursore
          const next = document.createElement('div');
          next.className = 'todo';
          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.tabIndex = -1;
          next.appendChild(cb);
          next.appendChild(document.createTextNode('\u00A0'));
          if (!r.collapsed) r.deleteContents();
          const tail = r.cloneRange();
          try { tail.setEnd(todo, todo.childNodes.length); }
          catch { try { tail.setEndAfter(todo); } catch (e2) {} }
          const frag = tail.extractContents();
          if (frag.querySelectorAll) frag.querySelectorAll('input').forEach(i => i.remove());
          next.appendChild(frag);
          todo.after(next);
          flattenTodos(fBody);
          const nr = document.createRange();
          try { nr.setStart(next, 2); } catch (e2) { nr.selectNodeContents(next); nr.collapse(false); }
          nr.collapse(true);
          sel.removeAllRanges();
          sel.addRange(nr);
        }
        markDirty();
      } else if (e.key === 'Backspace' && r.collapsed && txtEmpty) {
        // checkbox vuota + Backspace = esci dalla lista
        e.preventDefault();
        const p = document.createElement('div');
        p.innerHTML = '<br>';
        todo.replaceWith(p);
        const nr = document.createRange();
        nr.selectNodeContents(p);
        nr.collapse(true);
        sel.removeAllRanges();
        sel.addRange(nr);
        markDirty();
      }
    });
    schedRows.addEventListener('input', markDirty);
    schedRows.addEventListener('change', markDirty);
    schedSimple.addEventListener('input', markDirty);
    schedSimple.addEventListener('change', markDirty);
    $('btn-del').onclick = () => {
      if (!editId) return;
      if (confirm(t('confirmDelete'))) {
        appunti = appunti.filter(x => x.id !== editId);
        save(); render();
        editId = null;
        modal.hidden = true;
      }
    };

    // ===== Toolbar formattazione (stile My JW, execCommand) =====
    document.querySelectorAll('#toolbar button').forEach(b => b.addEventListener('mousedown', e => e.preventDefault()));
    document.querySelectorAll('#toolbar [data-cmd]').forEach(b => b.addEventListener('click', () => {
      document.execCommand(b.dataset.cmd, false, null);
      fBody.focus();
      markDirty();
    }));
    // Checkbox riga (stile My JW .todo)
    $('tool-todo').addEventListener('click', () => {
      const sel = window.getSelection();
      // leggi la posizione PRIMA di spostare il focus (focus() da solo
      // ricollasserebbe il cursore a inizio testo e toglierebbe la checkbox sbagliata)
      let inBody = false;
      if (sel.rangeCount) {
        let sc = sel.getRangeAt(0).startContainer;
        if (sc.nodeType === 3) sc = sc.parentNode;
        inBody = !!(sc && sc.closest && (sc.closest('#f-body') || sc.id === 'f-body'));
      }
      fBody.focus();
      // se il cursore era nel titolo/numero o fuori dal testo, portalo in fondo al testo
      if (!inBody) {
        const r0 = document.createRange();
        r0.selectNodeContents(fBody);
        r0.collapse(false);
        sel.removeAllRanges();
        sel.addRange(r0);
      }
      const mkTodo = () => {
        const d = document.createElement('div');
        d.className = 'todo';
        const c = document.createElement('input');
        c.type = 'checkbox';
        c.tabIndex = -1;
        d.appendChild(c);
        d.appendChild(document.createTextNode('\u00A0'));
        return d;
      };
      if (sel.rangeCount) {
        let node = sel.getRangeAt(0).startContainer;
        if (node.nodeType === 3) node = node.parentNode;
        const existing = node && node.closest ? node.closest('.todo') : null;
        if (existing && fBody.contains(existing)) {
          // sei già su una checkbox: secondo click la toglie (torna riga normale)
          const inp = existing.querySelector('input[type=checkbox]');
          if (inp) inp.remove();
          existing.classList.remove('todo');
          flattenTodos(fBody);
          fBody.focus();
          markDirty();
          return;
        }
        // riga normale con testo: convertila in checkbox invece di andare a capo
        let block = null;
        if (node !== fBody) {
          block = node;
          while (block && block.parentNode !== fBody) block = block.parentNode;
          if (!block || block.parentNode !== fBody) block = null;
        }
        if (block && block.tagName === 'DIV') {
          block.classList.add('todo');
          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.tabIndex = -1;
          if (!block.textContent.replace(/\u00A0/g, '').trim()) block.innerHTML = '';
          block.prepend(cb);
          if (!block.textContent.replace(/\u00A0/g, '').trim()) block.appendChild(document.createTextNode('\u00A0'));
          flattenTodos(fBody);
          fBody.focus();
          markDirty();
          return;
        }
        const r = sel.getRangeAt(0);
        const div = mkTodo();
        r.deleteContents();
        if (block) block.after(div);
        else r.insertNode(div);
        r.setStartAfter(div);
        r.collapse(true);
        sel.removeAllRanges();
        sel.addRange(r);
      } else {
        fBody.appendChild(mkTodo());
      }
      flattenTodos(fBody);
      fBody.focus();
      markDirty();
    });
    // Colore testo
    const palette = $('palette');
    $('tool-color').addEventListener('click', e => { e.stopPropagation(); palette.hidden = !palette.hidden; $('linkrow').hidden = true; });
    // il click sullo swatch non deve rubare la selezione nell'editor (come i bottoni toolbar)
    palette.addEventListener('mousedown', e => e.preventDefault());
    palette.addEventListener('click', e => {
      const sw = e.target.closest('.swatch');
      if (!sw) return;
      fBody.focus();
      if (sw.id === 'sw-reset') clearColor();
      else {
        document.execCommand('foreColor', false, sw.dataset.c);
        normalizeEditorColors();
      }
      markDirty();
    });
    function isColoredEl(el) {
      if (!el || el.nodeType !== 1) return false;
      if (el.nodeName === 'FONT') return el.hasAttribute('color') || !!(el.style && el.style.color);
      if (el.nodeName === 'SPAN') return !!(el.style && el.style.color) || el.hasAttribute('color');
      return false;
    }
    function stripColorEl(el) {
      if (!el || !el.parentNode) return;
      if (el.nodeName === 'FONT') {
        const parent = el.parentNode;
        while (el.firstChild) parent.insertBefore(el.firstChild, el);
        parent.removeChild(el);
        return;
      }
      // SPAN: toglie solo il colore, conserva classi (todo-txt/box) e altri stili
      el.style.color = '';
      el.removeAttribute('color');
      const st = (el.getAttribute('style') || '').replace(/;+/g, ';').trim();
      if (!st || st === ';') el.removeAttribute('style');
      if (!el.className && ![...el.attributes].length) {
        const parent = el.parentNode;
        while (el.firstChild) parent.insertBefore(el.firstChild, el);
        parent.removeChild(el);
      }
    }
    function clearColor() {
      const sel = window.getSelection();
      if (!sel.rangeCount) return;
      const range = sel.getRangeAt(0);
      if (range.collapsed) {
        // cursore dentro un testo colorato: risale tutti gli antenati fino all'editor
        let node = range.startContainer;
        if (node.nodeType === 3) node = node.parentNode;
        while (node && node !== fBody) {
          const next = node.parentNode;
          if (isColoredEl(node)) stripColorEl(node);
          node = next;
        }
        return;
      }
      // selezione estesa: toglie il colore da tutti gli elementi colorati intersecati
      fBody.querySelectorAll('font[color], font[style], span').forEach(el => {
        if (!isColoredEl(el)) return;
        let hit = false;
        try { hit = range.intersectsNode(el); }
        catch (err) { try { hit = sel.containsNode(el, true); } catch (e2) {} }
        if (hit) stripColorEl(el);
      });
    }
    // execCommand('foreColor') crea <font color>: li converte in <span style="color">
    // così anteprima/visualizzatore (che accettano solo span) restano coerenti.
    function normalizeEditorColors() {
      fBody.querySelectorAll('font[color], font[style]').forEach(f => {
        const c = f.getAttribute('color') || (f.style && f.style.color);
        const span = document.createElement('span');
        if (c) span.style.color = c;
        while (f.firstChild) span.appendChild(f.firstChild);
        f.replaceWith(span);
      });
    }
    // Link (stile My JW: titolo + url)
    const linkrow = $('linkrow');
    $('tool-link').addEventListener('click', e => { e.stopPropagation(); linkrow.hidden = !linkrow.hidden; palette.hidden = true; if (!linkrow.hidden) $('link-url').focus(); });
    // Vista codice: commuta tra testo formattato e sorgente HTML
    $('tool-source').addEventListener('click', e => { e.stopPropagation(); setSrcMode(!srcMode); });
    fSrc.addEventListener('input', markDirty);
    $('link-ok').addEventListener('click', () => {
      const url = $('link-url').value.trim();
      if (!url) return;
      const title = $('link-title').value.trim() || url;
      fBody.focus();
      const sel = window.getSelection();
      if (sel.rangeCount && !sel.getRangeAt(0).collapsed) {
        document.execCommand('createLink', false, url);
      } else {
        const a = document.createElement('a');
        a.href = url;
        a.textContent = title;
        if (sel.rangeCount) {
          const r = sel.getRangeAt(0);
          r.deleteContents();
          r.insertNode(a);
          r.setStartAfter(a);
          r.collapse(true);
          sel.removeAllRanges();
          sel.addRange(r);
        } else fBody.appendChild(a);
      }
      $('link-url').value = '';
      $('link-title').value = '';
      linkrow.hidden = true;
      fBody.focus();
      markDirty();
    });
    document.addEventListener('click', e => {
      if (!e.target.closest('#toolbar') && !e.target.closest('.palette') && !e.target.closest('.linkrow')) {
        palette.hidden = true;
        linkrow.hidden = true;
      }
    });

    // ===== Visualizzatore (sola lettura, poi Modifica) =====
    const viewer = $('viewer');
    let viewId = null;
    function paintVPin() {
      const b = $('btn-vpin');
      if (!b) return;
      const a = appunti.find(x => x.id === viewId);
      const pinned = !!(a && a.pinned);
      b.innerHTML = svg('pin');
      b.classList.toggle('on', pinned);
      if (!b.classList.contains('iconbtn')) b.classList.add('iconbtn');
      b.style.color = pinned ? '#2563EB' : '';
      b.style.borderColor = pinned ? '#2563EB' : '';
      b.style.background = pinned ? '#DBEAFE' : '';
      b.title = t(pinned ? 'unpin' : 'pin');
      b.setAttribute('aria-pressed', String(pinned));
      b.setAttribute('aria-label', t(pinned ? 'unpin' : 'pin'));
    }
    function openViewer(id) {
      const a = appunti.find(x => x.id === id);
      if (!a) return;
      viewId = id;
      const isTel = a.type === 'tel';
      $('v-title').textContent = a.title || t(isTel ? 'tagTel' : 'tagNote');
      const vTel = $('v-tel');
      vTel.hidden = !isTel;
      if (isTel) {
        const telHref = 'tel:' + String(a.numero || '').replace(/[^\d+]/g, '');
        $('v-num').innerHTML = a.numero ? `<a href="${esc(telHref)}">${esc(a.numero)}</a>` : '';
        const st = openState(a);
        const vOpen = $('v-open');
        if (st) {
          vOpen.hidden = false;
          vOpen.innerHTML = `<span class="openline"><span class="odot${st === 'closed' ? ' closed' : ''}"></span>${esc(t(st === 'open' ? 'openNow' : 'closedNow'))}</span>`;
        } else vOpen.hidden = true;
        const lines = schedLines(a);
        $('v-sched').innerHTML = lines.map(l => `<div>${esc(l)}</div>`).join('') || (a.orario ? esc(a.orario) : '');
      }
      const vb = $('v-body');
      vb.innerHTML = sanitizePreview(a.html, true);
      // link esterni in nuova scheda
      vb.querySelectorAll('a[href^="http"]').forEach(l => { l.target = '_blank'; l.rel = 'noopener'; });
      $('v-date').textContent = fmtDate(a.updated);
      viewer.classList.remove('fs');
      paintVFull();
      paintVPin();
      viewer.hidden = false;
    }
    // Checkbox cliccabili nel visualizzatore: salva lo stato senza aprire Modifica
    $('v-body').addEventListener('change', e => {
      const cb = e.target.closest('input[type="checkbox"][data-idx]');
      if (!cb || !viewId) return;
      const a = appunti.find(x => x.id === viewId);
      if (!a) return;
      const idx = Number(cb.getAttribute('data-idx'));
      const doc = new DOMParser().parseFromString('<div>' + (a.html || '') + '</div>', 'text/html');
      flattenTodos(doc.body.firstChild);
      const todos = doc.body.firstChild.querySelectorAll('.todo');
      const td = todos[idx];
      if (!td) return;
      let inp = td.querySelector('input[type=checkbox]');
      if (!inp) {
        inp = doc.createElement('input');
        inp.setAttribute('type', 'checkbox');
        td.prepend(inp);
      }
      if (cb.checked) inp.setAttribute('checked', '');
      else inp.removeAttribute('checked');
      a.html = doc.body.firstChild.innerHTML;
      a.updated = Date.now();
      save(); render();
      $('v-date').textContent = fmtDate(a.updated);
      cb.closest('.todo')?.classList.toggle('done', cb.checked);
      e.stopPropagation();
    });
    // click sulla checkbox non deve chiudere / non fa altro
    $('v-body').addEventListener('click', e => {
      if (e.target.closest('input[type="checkbox"]')) e.stopPropagation();
    });
    function closeViewer() { viewId = null; viewer.hidden = true; viewer.classList.remove('fs'); }
    $('btn-vclose').onclick = closeViewer;
    // Tutto schermo nel visualizzatore: SVG angoli in fuori/dentro
    function paintVFull() {
      const b = $('btn-vfull');
      if (!b) return;
      const fs = viewer.classList.contains('fs');
      b.innerHTML = svg(fs ? 'collapse' : 'expand');
      b.title = t(fs ? 'collapseTitle' : 'expandTitle');
      b.setAttribute('aria-pressed', String(fs));
    }
    $('btn-vfull').onclick = e => {
      e.stopPropagation();
      viewer.classList.toggle('fs');
      paintVFull();
    };
    $('btn-vdel').onclick = () => {
      if (!viewId) return;
      if (confirm(t('confirmDelete'))) {
        appunti = appunti.filter(x => x.id !== viewId);
        save(); render();
        viewId = null;
        viewer.hidden = true;
      }
    };
    $('btn-vpin').onclick = (e) => { e.stopPropagation(); if (viewId) togglePin(viewId); };
    viewer.addEventListener('mousedown', e => { if (e.target === viewer) closeViewer(); });
    $('btn-edit').onclick = () => {
      const a = appunti.find(x => x.id === viewId);
      viewer.hidden = true;
      viewId = null;
      if (a) openEditor(a.type, a.id);
    };
    // ===== Menu ingranaggio =====
    const tools = $('tools');
    $('menuBtn').onclick = (e) => { e.stopPropagation(); tools.classList.toggle('open'); };
    document.addEventListener('click', (e) => { if (!tools.contains(e.target)) tools.classList.remove('open'); });

    // ===== Allarga a tutta pagina (come SCT Tool: .wrap 960px -> tutta larghezza) =====
    const EXP_KEY = 'mylollotool-appunti-expanded';
    function paintExpandBtn() {
      const b = $('btn-expand');
      if (!b) return;
      const ex = document.querySelector('.wrap').classList.contains('expanded');
      b.innerHTML = svg(ex ? 'collapse' : 'expand');
      b.title = t(ex ? 'collapseTitle' : 'expandTitle');
      b.setAttribute('aria-pressed', String(ex));
    }
    function applyExpand(ex) {
      document.querySelector('.wrap').classList.toggle('expanded', ex);
      try { localStorage.setItem(EXP_KEY, ex ? '1' : '0'); } catch (e) {}
      paintExpandBtn();
    }
    try { applyExpand(localStorage.getItem(EXP_KEY) === '1'); } catch (e) {}
    $('btn-expand').onclick = () =>
      applyExpand(!document.querySelector('.wrap').classList.contains('expanded'));
    $('drop').addEventListener('click', (e) => { if (e.target.closest('button')) tools.classList.remove('open'); });

    // ===== Esporta / Importa =====
    $('btn-export').onclick = () => {
      const blob = new Blob([JSON.stringify(appunti, null, 2)], { type: 'application/json' });
      const link = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: 'appunti.json' });
      link.click();
      setTimeout(() => URL.revokeObjectURL(link.href), 1000);
    };
    $('btn-import').onclick = () => $('file-import').click();
    $('file-import').onchange = async e => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const d = JSON.parse(await file.text());
        if (!Array.isArray(d)) throw new Error();
        const valid = d.filter(x => x && (x.title || x.numero || x.orario || x.hours || x.html || x.pinned)).map(x => ({
          id: String(x.id || uid()),
          type: x.type === 'tel' ? 'tel' : 'note',
          title: String(x.title || ''),
          numero: String(x.numero || ''),
          orario: String(x.orario || ''),
          hours: (x.hours && typeof x.hours === 'object') ? x.hours : {},
          html: String(x.html || ''),
          updated: Number(x.updated) || Date.now(),
          pinned: !!x.pinned,
        }));
        if (confirm(t('confirmImport', { n: valid.length }))) {
          appunti = valid; save(); render();
        }
      } catch { alert(t('invalidFile')); }
      e.target.value = '';
    };

    document.addEventListener('keydown', e => {
      if (e.key !== 'Escape') return;
      if (tools.classList.contains('open')) { tools.classList.remove('open'); return; }
      if (!viewer.hidden) {
        if (viewer.classList.contains('fs')) { viewer.classList.remove('fs'); paintVFull(); return; }
        closeViewer(); return;
      }
      if (!modal.hidden) closeEditor();
    });

    // ===== Tema globale =====
    (function syncGlobalTheme() {
      const G = 'mylollotool-theme';
      function apply(th) { document.body.classList.toggle('dark', th === 'dark'); }
      try { const g = localStorage.getItem(G); if (g === 'dark' || g === 'light') apply(g); } catch (e) {}
      window.addEventListener('message', (e) => {
        if (e?.data?.type === G && (e.data.theme === 'dark' || e.data.theme === 'light')) {
          apply(e.data.theme);
          try { localStorage.setItem(G, e.data.theme); } catch (err) {}
        }
      });
      window.addEventListener('storage', (e) => {
        if (e.key === G && (e.newValue === 'dark' || e.newValue === 'light')) apply(e.newValue);
      });
    })();

    // ===== Lingua globale =====
    function applyLang(l) {
      curLang = LANGS.includes(l) ? l : 'it';
      document.documentElement.lang = curLang;
      try { localStorage.setItem(LANG_KEY, curLang); } catch (e) {}
      document.title = t('title');
      document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
      document.querySelectorAll('[data-t-ph]').forEach(el => { el.placeholder = t(el.dataset.tPh); });
      document.querySelectorAll('[data-t-title]').forEach(el => { el.title = t(el.dataset.tTitle); });
      fBody.dataset.ph = t('bodyPh');
      try { paintExpandBtn(); } catch (e) {}
      try { paintVFull(); } catch (e) {}
      try { if (viewId) paintVPin(); } catch (e) {}
      render();
    }
    window.addEventListener('message', (e) => {
      if (e?.data?.type === LANG_KEY && LANGS.includes(e.data.lang)) applyLang(e.data.lang);
    });
    window.addEventListener('storage', (e) => {
      if (e.key === LANG_KEY && LANGS.includes(e.newValue)) applyLang(e.newValue);
    });

    applyLang(curLang);
  </script>
