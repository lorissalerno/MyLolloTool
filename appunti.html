<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Appunti</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    /* Palette DataSales: light #F3F4F6/#FFFFFF, dark #0D0D10/#141417 */
    body { font-family: system-ui, sans-serif; background: #F3F4F6; color: #1F2937; padding: 14px 24px 44px; }
    body.dark { background: #0D0D10; color: #EEEEF0; }
    .wrap { max-width: 960px; margin: 0 auto; }

    /* Barra copyright fissa stile SCT Tool */
    .footer-copy { position: fixed; left: 0; right: 0; bottom: 0; border-top: 1px solid #E5E7EB;
      background: #FFFFFF; padding: 5px 18px; text-align: center; font-size: 0.7rem; color: #4B5563; z-index: 50; }
    body.dark .footer-copy { background: #141417; border-color: #2A2A35; color: #9898A8; }
    .footer-copy a { color: inherit; text-decoration: none; font-weight: bold; }

    svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2;
          stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

    /* Header stile Turni: titolo + sottotitolo a sinistra, pill a destra, riga blu sotto */
    header.page-head { display: flex; justify-content: space-between; align-items: center; gap: 14px;
      flex-wrap: nowrap; border-bottom: 2px solid #3B82F6; padding-bottom: 8px; margin-bottom: 12px; height: 60px; }
    .page-head .brand { display: flex; align-items: center; gap: 12px; min-width: 0; margin-left: 46px; transition: margin-left .25s ease; }
    .page-head .brand > div { min-width: 0; }
    @media (min-width: 1060px) { .page-head .brand { margin-left: 0; } }
    .page-head h1 { color: #1F2937; font-size: 20px; line-height: 1.25; margin: 0; display: flex; align-items: center; gap: 10px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 800; letter-spacing: -.4px; }
    .page-head h1 svg { width: 20px; height: 20px; flex: none; }
    .page-head .sub { color: #4B5563; font-size: 11px; margin: 1px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .page-head .right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; position: relative; }
    .pill { height: 40px; display: inline-flex; align-items: center; gap: 8px; padding: 0 14px;
      border: 1px solid #E5E7EB; border-radius: 999px; background: transparent; color: #4B5563;
      font-size: 12px; font-weight: 600; white-space: nowrap; }
    .pill svg { width: 14px; height: 14px; }
    .iconbtn { width: 40px; height: 40px; padding: 0; display: inline-flex; align-items: center; justify-content: center;
      border-radius: 999px; border: 1px solid #E5E7EB; background: #fff; color: #1F2937; cursor: pointer; flex: none; }
    .iconbtn:hover { background: #E5E7EB; }
    .iconbtn svg { width: 16px; height: 16px; }
    body.dark .page-head h1 { color: #EEEEF0; }
    body.dark .page-head .sub { color: #9898A8; }
    body.dark .pill { border-color: #2A2A35; color: #9898A8; }
    body.dark .iconbtn { background: #141417; border-color: #2A2A35; color: #EEEEF0; }
    body.dark .iconbtn:hover { background: #1F1F26; }
    /* Menu ingranaggio stile Turni */
    #drop { display: none; position: absolute; top: calc(100% + 8px); right: 0; z-index: 70;
      flex-direction: column; gap: 4px; min-width: 210px; background: #fff; border: 1px solid #E5E7EB;
      border-radius: 12px; padding: 8px; box-shadow: 0 16px 40px rgba(0,0,0,.18), 0 4px 12px rgba(0,0,0,.10); }
    .right.open #drop { display: flex; }
    #drop .btn { width: 100%; justify-content: flex-start; }
    body.dark #drop { background: #141417; border-color: #2A2A35; box-shadow: 0 16px 40px rgba(0,0,0,.5); }
    @media (max-width: 600px) {
      .page-head { gap: 8px; }
      .page-head .brand { margin-left: 54px; }
      .page-head .right { gap: 8px; }
    }

    /* Barre superiori fisse: header + toolbar + filtri restano visibili durante lo scroll */
    .topbar { position: sticky; top: 0; z-index: 60; background: #F3F4F6;
      margin-top: -14px; padding-top: 14px; padding-bottom: 10px; }
    body.dark .topbar { background: #0D0D10; }
    .topbar .chips { margin-bottom: 0; }
    header.page-head { background: inherit; }
    /* Barra strumenti */
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 8px; }
    .search-box { position: relative; flex: 1; min-width: 200px; max-width: 400px; }
    .search-box svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #9CA3AF; }
    #search { width: 100%; padding: 10px 14px 10px 40px; border: 1px solid #E5E7EB; border-radius: 8px; font-size: 15px; background: #FFFFFF; color: #1F2937; }
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border: 1px solid #E5E7EB;
           border-radius: 8px; background: #fff; color: #1F2937; font: inherit; font-size: 14px;
           cursor: pointer; text-decoration: none; white-space: nowrap; }
    .btn:hover { background: #E5E7EB; }
    .btn.primary { background: #2563EB; border-color: #2563EB; color: #fff; }
    .btn.primary:hover { background: #3B82F6; border-color: #3B82F6; }
    .btn.danger { color: #9B1C1C; }
    .btn.danger:hover { background: #FDE8E8; }
    /* Filtri tipo */
    .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .chip { padding: 7px 14px; border: 1px solid #E5E7EB; border-radius: 999px; background: #fff;
            color: #4B5563; font-size: 13px; font-weight: 600; cursor: pointer; }
    .chip.active { border-color: #2563EB; background: #DBEAFE; color: #1D4ED8; }

    /* Griglia masonry stile My JW */
    .grid { column-count: 2; column-gap: 14px; }
    @media (max-width: 640px) { .grid { column-count: 1; } }
    .note { position: relative; background: #fff; border: 1.5px solid #E5E7EB; border-radius: 10px;
            box-shadow: 0 2px 10px rgba(0,0,0,.04); break-inside: avoid; margin-bottom: 14px;
            cursor: pointer; overflow: hidden; transition: transform .15s, box-shadow .15s; animation: cardIn .25s ease; }
    @keyframes cardIn { from { opacity: 0; transform: scale(.95); } to { opacity: 1; transform: none; } }
    .note:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.10); }
    .note:active { transform: scale(.97); }
    .note.tel { border-left: 4px solid #3B82F6; }
    .note-body { padding: 12px 14px 8px; }
    .note-title { font-size: 15px; font-weight: 700; line-height: 1.35; margin-bottom: 6px; word-break: break-word; }
    .note-num { font-size: 16px; font-weight: 800; margin-bottom: 2px; word-break: break-word; }
    .note-num a { color: inherit; text-decoration: none; }
    .note-num a:hover { text-decoration: underline; color: #2563EB; }
    .note-meta { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #4B5563; margin-bottom: 6px; }
    .note-meta svg { width: 14px; height: 14px; }
    .note-preview { font-size: 13px; color: #4B5563; line-height: 1.5; word-break: break-word;
      display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; max-height: 9em; }
    .note-preview ul, .note-preview ol { padding-left: 20px; margin: 4px 0; }
    .note-preview a { color: #2563EB; }
    .note-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; padding-top: 8px; border-top: 1px solid #F3F4F6; }
    /* Orari strutturati */
    #schedRows { display: flex; flex-direction: column; border: 1px solid #E5E7EB; border-radius: 8px; padding: 4px 10px; background: #F9FAFB; }
    body.dark #schedRows { background: #1A1A1F; border-color: #2A2A35; }
    .srow { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px dashed #E5E7EB; }
    .srow:last-child { border-bottom: none; }
    body.dark .srow { border-color: #2A2A35; }
    .srow input[type="checkbox"] { width: 16px; height: 16px; flex: none; accent-color: #2563EB; cursor: pointer; }
    .srow .sname { width: 34px; flex: none; font-size: 13px; font-weight: 700; }
    .srow.off .sname { opacity: .45; }
    .srow .sslots { display: none; gap: 6px; flex-wrap: wrap; flex: 1; }
    .srow:not(.off) .sslots { display: flex; }
    /* Modalità orari semplice/dettagliata */
    .seg { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    .slot { display: inline-flex; align-items: center; gap: 4px; }
    .seg { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    #schedSimple { display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
    .ssrow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .ssrow select, .ssrow input.tin, .slot input.tin { padding: 5px 6px; border: 1px solid #E5E7EB; border-radius: 6px; font-size: 13px; background: #FFFFFF; color: #1F2937; }
    .ssrow input.tin, .slot input.tin { width: 96px; }
    body.dark .ssrow select, body.dark .ssrow input.tin, body.dark .slot input.tin { background: #141417; border-color: #2A2A35; color: #EEEEF0; color-scheme: dark; }
    .ssadd { display: flex; justify-content: flex-end; }
    .sbtn { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; flex: none;
            border-radius: 50%; border: 1px solid #E5E7EB; background: #fff; color: #4B5563; cursor: pointer; font-size: 15px; line-height: 1; }
    .sbtn:hover { background: #E5E7EB; }
    body.dark .sbtn { background: #141417; border-color: #2A2A35; color: #9898A8; }
    .sched { display: flex; flex-direction: column; gap: 2px; margin: 6px 0; font-size: 12.5px; color: #4B5563; }
    /* Orari in alto a destra nella card */
    .note-top { display: flex; gap: 12px; align-items: flex-start; }
    .note-top .note-title { flex: 1; min-width: 0; }
    .note-top > span { flex: 1; min-width: 0; }
    .note-right { flex: none; max-width: 60%; margin-left: auto; text-align: right; }
    .note-right.sched { margin: 1px 0 0; }
    body.dark .sched { color: #9898A8; }
    .openline { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; }
    .odot { width: 8px; height: 8px; border-radius: 50%; background: #10B981; flex: none; }
    .odot.closed { background: #EF4444; }
    .note-date { font-size: 10px; color: #9CA3AF; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; }
    .note-tag { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #DBEAFE; color: #1D4ED8; }
    .note.tel .note-tag { background: #DBEAFE; }

    .empty { padding: 40px; text-align: center; color: #4B5563; background: #FFFFFF;
             border: 2px dashed #E5E7EB; border-radius: 10px; }

    /* Tema scuro */
    body.dark { background: #0D0D10; color: #EEEEF0; }
    body.dark #search { background: #141417; border-color: #2A2A35; color: #EEEEF0; }
    body.dark .btn { background: #141417; border-color: #2A2A35; color: #EEEEF0; }
    body.dark .btn:hover { background: #1F1F26; }
    body.dark .btn.primary { background: #3B82F6; border-color: #3B82F6; color: #fff; }
    body.dark .btn.danger { color: #FCA5A5; }
    body.dark .chip { background: #141417; border-color: #2A2A35; color: #9898A8; }
    body.dark .chip.active { background: #1A1A1F; border-color: #3B82F6; color: #60A5FA; }
    body.dark .note { background: #141417; border-color: #2A2A35; box-shadow: none; }
    body.dark .note-meta, body.dark .note-preview { color: #9898A8; }
    body.dark .note-num a:hover { color: #60A5FA; }
    body.dark .note-foot { border-color: #2A2A35; }
    body.dark .note-date { color: #5A5A70; }
    body.dark .note-tag { background: #1A1A1F; color: #60A5FA; }
    body.dark .empty { background: #141417; border-color: #2A2A35; color: #9898A8; }

    /* Editor */
    .modal { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center;
             padding: 20px; background: rgba(0,10,40,.5); }
    .dialog { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 640px; max-height: 100%;
              overflow: auto; padding: 20px; background: #fff; border-radius: 12px; }
    body.dark .dialog { background: #141417; }
    .dialog h2 { font-size: 18px; display: flex; align-items: center; gap: 8px; }
    .dialog h2 svg { width: 20px; height: 20px; }
    .field { display: flex; flex-direction: column; gap: 5px; font-size: 14px; font-weight: 600; }
    .field input { padding: 9px 12px; border: 1px solid #E5E7EB; border-radius: 8px; font: inherit; font-weight: 400; font-size: 15px; background: #FFFFFF; color: #1F2937; }
    body.dark .field input { background: #1A1A1F; border-color: #2A2A35; color: #EEEEF0; }
    .telrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 480px) { .telrow { grid-template-columns: 1fr; } }
    /* Toolbar formattazione stile My JW */
    .toolbar-ed { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; padding: 6px;
                  border: 1px solid #E5E7EB; border-radius: 8px; background: #F9FAFB; }
    body.dark .toolbar-ed { background: #1A1A1F; border-color: #2A2A35; }
    .toolbtn { display: inline-flex; align-items: center; justify-content: center; min-width: 34px; height: 34px;
               padding: 0 7px; border: none; border-radius: 6px; background: transparent; color: #4B5563;
               cursor: pointer; font-size: 15px; font-weight: 800; }
    .toolbtn:hover { background: #E5E7EB; color: #1F2937; }
    body.dark .toolbtn { color: #9898A8; }
    body.dark .toolbtn:hover { background: #2A2A35; color: #EEEEF0; }
    .toolbtn svg { width: 17px; height: 17px; }
    .toolbtn.on { background: #DBEAFE; color: #1D4ED8; }
    body.dark .toolbtn.on { background: #1A1A1F; color: #60A5FA; }
    .toolsep { width: 1px; height: 22px; background: #E5E7EB; margin: 0 2px; }
    body.dark .toolsep { background: #2A2A35; }
    .palette { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px; border: 1px solid #E5E7EB;
               border-radius: 8px; background: #fff; }
    body.dark .palette { background: #1A1A1F; border-color: #2A2A35; }
    .swatch { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
    .swatch:hover { transform: scale(1.12); }
    .linkrow { display: flex; gap: 8px; flex-wrap: wrap; padding: 8px; border: 1px solid #E5E7EB; border-radius: 8px; background: #fff; }
    body.dark .linkrow { background: #1A1A1F; border-color: #2A2A35; }
    .linkrow input { flex: 1; min-width: 140px; padding: 8px 10px; border: 1px solid #E5E7EB; border-radius: 6px; font-size: 14px; background: #FFFFFF; color: #1F2937; }
    body.dark .linkrow input { background: #141417; border-color: #2A2A35; color: #EEEEF0; }
    #f-body { min-height: 180px; max-height: 40vh; overflow: auto; padding: 10px 12px; border: 1px solid #E5E7EB;
              border-radius: 8px; font-size: 15px; line-height: 1.55; background: #FFFFFF; color: #1F2937; outline: none; }
    #f-body:focus { border-color: #3B82F6; }
    body.dark #f-body { background: #1A1A1F; border-color: #2A2A35; color: #EEEEF0; }
    #f-body:empty:before { content: attr(data-ph); color: #9CA3AF; font-style: italic; }
    #f-body ul, #f-body ol { padding-left: 22px; margin: 6px 0; }
    #f-body a { color: #2563EB; }
    #f-body .todo { display: flex; align-items: flex-start; gap: 8px; margin: 4px 0; }
    #f-body .todo input { width: 16px; height: 16px; margin-top: 3px; flex: none; accent-color: #2563EB; cursor: pointer; }
    /* Visualizzatore */
    #v-body { font-size: 14px; line-height: 1.6; word-break: break-word; }
    #v-body ul, #v-body ol { padding-left: 22px; margin: 6px 0; }
    #v-body a { color: #2563EB; }
    #v-tel .note-num { font-size: 18px; margin: 4px 0 8px; }
    #v-tel .note-num a { color: inherit; text-decoration: none; }
    #v-tel .note-num a:hover { text-decoration: underline; color: #2563EB; }
    #v-tel .sched { font-size: 13px; margin-top: 8px; }
    .actions { display: flex; align-items: center; gap: 8px; }
    .actions .status { flex: 1; font-size: 12px; color: #9CA3AF; }
    /* Alone blu che segue il mouse: azzurro leggero in tema chiaro, blu scuro neon in tema scuro */
    #mlt-glow{position:fixed;left:0;top:0;width:640px;height:640px;margin:-320px 0 0 -320px;border-radius:50%;pointer-events:none;z-index:30;opacity:0;transition:opacity .3s ease;background:radial-gradient(circle,rgba(147,197,253,.45) 0%,rgba(147,197,253,.16) 42%,transparent 68%);}
    body.dark #mlt-glow{background:radial-gradient(circle,rgba(37,99,235,.40) 0%,rgba(30,58,138,.22) 42%,transparent 70%);box-shadow:0 0 160px 40px rgba(37,99,235,.22);}
    @media (hover:none) and (pointer:coarse){#mlt-glow{display:none;}}
    /* Hover neon blu su note e pulsanti */
    @media (hover:hover){
      .note:hover{border-color:rgba(59,130,246,.55);box-shadow:0 0 0 1px rgba(147,197,253,.8),0 6px 22px rgba(59,130,246,.28);}
      .btn:hover,.iconbtn:hover,.sbtn:hover{border-color:rgba(59,130,246,.55);box-shadow:0 0 0 1px rgba(147,197,253,.8),0 0 18px rgba(59,130,246,.35);}
      body.dark .note:hover{border-color:rgba(59,130,246,.65);box-shadow:0 0 0 1px rgba(37,99,235,.55),0 0 26px rgba(37,99,235,.45);}
      body.dark .btn:hover,body.dark .iconbtn:hover,body.dark .sbtn:hover{border-color:rgba(59,130,246,.6);box-shadow:0 0 0 1px rgba(37,99,235,.5),0 0 18px rgba(37,99,235,.5);}
    }
  </style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
  <header class="page-head">
    <div class="brand"><div><h1><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><span data-t="title">Appunti</span></h1><p class="sub" data-t="sub">Numeri utili e note con formattazione</p></div></div>
    <div class="right" id="tools"><span class="pill" id="countPill"></span><button class="iconbtn" id="menuBtn" data-t-title="menuTitle" title="Menu"><svg viewBox="0 0 24 24"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg></button><span id="drop"><button class="btn" id="btn-export" data-t-title="exportTitle" title="Scarica gli appunti come file .json"><span data-i="download"></span><span data-t="export">Esporta</span></button><button class="btn" id="btn-import" data-t-title="importTitle" title="Carica appunti da file .json"><span data-i="upload"></span><span data-t="import">Importa</span></button></span></div>
  </header>

  <div class="toolbar">
    <div class="search-box">
      <span data-i="search"></span>
      <input id="search" type="text" data-t-ph="searchPh" placeholder="Cerca negli appunti...">
    </div>
    <button class="btn primary" id="btn-add-note"><span data-i="plus"></span><span data-t="addNote">Nuova nota</span></button>
    <button class="btn" id="btn-add-tel"><span data-i="phone"></span><span data-t="addTel">Telefono</span></button>
  </div>
  <div class="chips" id="chips">
    <button class="chip active" data-f="all"><span data-t="fAll">Tutti</span></button>
    <button class="chip" data-f="note"><span data-t="fNote">Note</span></button>
    <button class="chip" data-f="tel"><span data-t="fTel">Telefoni</span></button>
  </div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden><span data-t="empty">Nessun appunto. Crea una nota o un riquadro telefono.</span></div>

  <!-- Editor -->
  <div id="modal" class="modal" hidden>
    <div class="dialog" role="dialog" aria-modal="true">
      <h2><span data-i="edit"></span><span id="form-title">Nuova nota</span></h2>
      <div id="telWrap" hidden style="display:flex;flex-direction:column;gap:12px">
        <label class="field"><span data-t="numero">Numero</span>
          <input id="f-numero" type="tel" inputmode="tel" data-t-ph="numeroPh" placeholder="+41 ...">
        </label>
        <div class="field"><span data-t="sched">Orari di apertura</span>
          <div class="seg" id="modeSeg">
            <button type="button" class="chip" data-m="simple"><span data-t="schedSimple">Semplice</span></button>
            <button type="button" class="chip" data-m="detail"><span data-t="schedDetail">Dettagliata</span></button>
          </div>
          <div id="schedSimple">
            <div id="simpleRows"></div>
            <div class="ssadd"><button type="button" class="sbtn" id="ss-add" title="+">+</button></div>
          </div>
          <div id="schedRows"></div>
        </div>
      </div>

    // ===== Sanitizza anteprima (allowlist) =====
    function sanitizePreview(html) {
      const doc = new DOMParser().parseFromString('<div>' + (html || '') + '</div>', 'text/html');
      const cont = doc.body.firstChild;
      // Checkbox -> testo
      cont.querySelectorAll('.todo').forEach(td => {
        const inp = td.querySelector('input[type=checkbox]');
        const on = inp && (inp.hasAttribute('checked') || inp.checked);
        const span = doc.createElement('span');
        span.textContent = (on ? '☑ ' : '☐ ') + td.textContent.trim();
        td.replaceWith(span);
      });
      const ALLOWED = { B:1, STRONG:1, I:1, EM:1, U:1, UL:1, OL:1, LI:1, BR:1, P:1, DIV:1, SPAN:1, A:1 };
      const walk = node => {
        [...node.childNodes].forEach(ch => {
          if (ch.nodeType === 3) return;
          if (ch.nodeType !== 1 || !ALLOWED[ch.tagName]) {
            const txt = doc.createTextNode(ch.textContent);
            node.replaceChild(txt, ch);
            return;
          }
          if (ch.tagName === 'A') {
            const href = ch.getAttribute('href') || '';
            [...ch.attributes].forEach(a => ch.removeAttribute(a.name));
            if (/^https?:\/\//i.test(href) || href.startsWith('tel:') || href.startsWith('mailto:')) ch.setAttribute('href', href);
            else { const txt = doc.createTextNode(ch.textContent); node.replaceChild(txt, ch); return; }
          } else if (ch.tagName === 'SPAN') {
            const c = ch.style.color;
            [...ch.attributes].forEach(a => ch.removeAttribute(a.name));
            if (c) ch.style.color = c;
          } else {
            [...ch.attributes].forEach(a => ch.removeAttribute(a.name));
          }
          walk(ch);
        });
      };
      walk(cont);
      return cont.innerHTML;
    }
    const plainText = html => {

    // ===== Orari strutturati: giorni + più fasce =====
    // Orari flessibili: "8" -> 08:00, accetta : . , o cifre unite ("830" -> 08:30)
    const parseTime = v => {
      const m = String(v || '').trim().replace(',', '.').match(/^(\d{1,2})(?:[:.](\d{1,2}))?$/);
      if (!m && !/^\d{3,4}$/.test(String(v || '').trim())) return null;
      let h, min;
      if (m) { h = +m[1]; min = m[2] === undefined ? 0 : +m[2]; }
      else { const d = String(v).trim(); h = +d.slice(0, -2); min = +d.slice(-2); }
      if (h > 23 || min > 59) return null;
      return String(h).padStart(2, '0') + ':' + String(min).padStart(2, '0');

      const row = document.createElement('div');
      row.className = 'ssrow';
      row.innerHTML = `<span data-t="schedFrom">Da</span><select class="ss-f"></select><span data-t="schedTo">a</span><select class="ss-t"></select><span aria-hidden="true">·</span><input type="text" class="tin ss-s" inputmode="decimal" placeholder="08:00" maxlength="5">–<input type="text" class="tin ss-e" inputmode="decimal" placeholder="20:00" maxlength="5"><button type="button" class="sbtn ss-del" data-t-title="delSlot" title="×">×</button>`;
      dayOptions(row.querySelector('.ss-f'), g ? g.from : 1);
      dayOptions(row.querySelector('.ss-t'), g ? g.to : 5);
      if (g && g.slot) {
        row.querySelector('.ss-s').value = g.slot[0] || '';
        row.querySelector('.ss-e').value = g.slot[1] || '';
      }
      return row;
    }
    function fillSimpleRows(groups) {
      simpleRows.innerHTML = '';
      if (groups && groups.length) groups.forEach(g => simpleRows.appendChild(ssRowEl(g)));
      else simpleRows.appendChild(ssRowEl(null));
    }
    // Raggruppa giorni consecutivi con gli stessi orari (usato anche per la card)
    function hourGroups(hours) {
      const groups = [];
      let start = -1, prev = -2, prevKey = '';
      const flush = end => {
        if (start < 0) return;
        groups.push({ from: start, to: end, slot: JSON.parse(prevKey) });
      };
      for (let d = 1; d <= 8; d++) {
        const sl = (d <= 7 && hours && Array.isArray(hours[d]) && hours[d].length) ? hours[d] : null;
        const key = sl ? JSON.stringify(sl) : '';
        if (key && d === prev + 1 && key === prevKey) { prev = d; continue; }
        flush(prev);
        if (key) { start = d; prev = d; prevKey = key; }
        else { start = -1; prev = d; prevKey = ''; }
      }
      return groups;
    }
    function simpleAsHours() {
      const hours = {};
      simpleRows.querySelectorAll('.ssrow').forEach(row => {
        let f = Number(row.querySelector('.ss-f').value), tt = Number(row.querySelector('.ss-t').value);
        if (f > tt) [f, tt] = [tt, f];
        const ok = normSlot(row.querySelector('.ss-s').value, row.querySelector('.ss-e').value);
        if (!ok) return;
        for (let d = f; d <= tt; d++) hours[d] = [ok];
      });
      return hours;
    }
    function setMode(m) {
      schedMode = m;
      const detail = m === 'detail';
      schedSimple.hidden = detail;
      schedRows.hidden = !detail;
      modeSeg.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.m === m));
    }
    function rowsHaveData() {
      let found = false;
      schedRows.querySelectorAll('.srow').forEach(row => {
        if (row.querySelector('.sday').checked) found = true;
      });
      return found;
    }
    function rowsAsHours() {
      const hours = {};
      schedRows.querySelectorAll('.srow').forEach(row => {
        if (!row.querySelector('.sday').checked) return;
        const slots = [];
        row.querySelectorAll('.slot').forEach(sp => {
          const ins = sp.querySelectorAll('input');
          const ok = normSlot(ins[0].value, ins[1].value);
          if (ok) slots.push(ok);
        });
        if (slots.length) hours[row.dataset.d] = slots;
      });
      return hours;
    }
    $('ss-add').addEventListener('click', () => {
      if (simpleRows.querySelectorAll('.ssrow').length >= 7) return;
      simpleRows.appendChild(ssRowEl(null));
      scheduleSave();
    });
    schedSimple.addEventListener('click', e => {
      const del = e.target.closest('.ss-del');
      if (del && simpleRows.querySelectorAll('.ssrow').length > 1) {
        del.closest('.ssrow').remove();
        scheduleSave();
      }
    });
    modeSeg.addEventListener('click', e => {
      const c = e.target.closest('.chip');
      if (!c) return;
      if (c.dataset.m === 'detail') {
        // semplice -> dettagliata: se le righe sono vuote, converti le fasce semplici
        if (!rowsHaveData()) {
          const h = simpleAsHours();
          if (Object.keys(h).length) buildSchedRows(h);
        }
        setMode('detail');
      } else {
        // dettagliata -> semplice: converti solo se tutto ha una fascia sola, altrimenti svuota (conserva i dati)
        const h = rowsAsHours();
        if (Object.keys(h).length) {
          const gs = hourGroups(h);
          if (gs.every(g => g.slot.length === 1)) fillSimpleRows(gs.map(g => ({ from: g.from, to: g.to, slot: g.slot[0] })));
          else fillSimpleRows(null);
        }
        setMode('simple');
      }
    });
    function detectMode(hours) {
      const ds = Object.keys(hours || {}).map(Number).filter(d => d >= 1 && d <= 7 && Array.isArray(hours[d]) && hours[d].length);
      if (!ds.length) return 'simple';
      return ds.every(d => hours[d].length <= 1) ? 'simple' : 'detail';
    }
    function buildSched(hours) {
      buildSchedRows(hours);
      const gs = hourGroups(hours || {});
      fillSimpleRows(gs.length && gs.every(g => g.slot.length === 1) ? gs.map(g => ({ from: g.from, to: g.to, slot: g.slot[0] })) : null);
      setMode(detectMode(hours));
    }
    function collectSched() {
      const s = simpleAsHours();
      const d = rowsAsHours();
      if (schedMode === 'simple') return Object.keys(s).length ? s : d;
      return Object.keys(d).length ? d : s;
    }
    function schedLines(a) {
      return hourGroups(a.hours || {}).map(g => {
        const lbl = g.from === g.to ? dayName(g.from) : dayName(g.from) + '–' + dayName(g.to);
        return lbl + ' ' + g.slot.map(([s, e]) => s + '–' + e).join(' · ');
      });
    }
    function openState(a) {
      if (!a.hours) return null;
      const now = new Date();
      const mm = now.getHours() * 60 + now.getMinutes();
      const toMin = x => { const [h, m] = x.split(':').map(Number); return h * 60 + (m || 0); };
      const dow = (now.getDay() + 6) % 7 + 1; // Lun=1..Dom=7
      const sl = a.hours[dow];
      if (!Array.isArray(sl) || !sl.length) return 'closed';
      return sl.some(([s, e]) => { const a1 = toMin(s), b1 = toMin(e); return a1 < b1 && mm >= a1 && mm < b1; }) ? 'open' : 'closed';
    }
    // ===== Griglia =====
    function card(a) {
      const isTel = a.type === 'tel';
      const safeNum = esc(a.numero || '');
      const telHref = 'tel:' + String(a.numero || '').replace(/[^\d+]/g, '');
      const lines = schedLines(a);
      const st = isTel ? openState(a) : null;
      const legacy = isTel && !lines.length && a.orario ? `<div class="note-meta">${svg('clock')}<span>${esc(a.orario)}</span></div>` : '';
      return `
      <article class="note${isTel ? ' tel' : ''}" data-id="${esc(a.id)}">
        <div class="note-body">
          ${isTel
            ? `${(a.title || lines.length) ? `<div class="note-top">${a.title ? `<div class="note-title">${esc(a.title)}</div>` : `<span></span>`}${lines.length ? `<div class="note-right sched">${lines.map(l => `<div>${esc(l)}</div>`).join('')}</div>` : ''}</div>` : ''}
              ${a.numero ? `<div class="note-num"><a href="${esc(telHref)}" data-open="tel">${safeNum}</a></div>` : ''}
              ${st ? `<div class="note-meta"><span class="openline"><span class="odot${st === 'closed' ? ' closed' : ''}"></span>${esc(t(st === 'open' ? 'openNow' : 'closedNow'))}</span></div>` : ''}
              ${legacy}`
            : `${a.title ? `<div class="note-title">${esc(a.title)}</div>` : ''}`}
          ${a.html ? `<div class="note-preview">${sanitizePreview(a.html)}</div>` : ''}
          <div class="note-foot">
            <span class="note-date">${esc(fmtDate(a.updated))}</span>
            <span class="note-tag">${esc(t(isTel ? 'tagTel' : 'tagNote'))}</span>
          </div>
        </div>
      </article>`;
    }
    function render() {
      $('countPill').textContent = t('count', { n: appunti.length });
      const q = search.value.trim().toLowerCase();
      let list = [...appunti].sort((a, b) => (b.updated || 0) - (a.updated || 0));
      if (filter !== 'all') list = list.filter(a => a.type === filter);
      if (q) list = list.filter(a => [a.title, a.numero, a.orario, schedLines(a).join(' '), plainText(a.html)].join(' ').toLowerCase().includes(q));
      document.querySelectorAll('#chips .chip').forEach(c => c.classList.toggle('active', c.dataset.f === filter));
      if (!appunti.length) {
        grid.innerHTML = '';
        emptyBox.hidden = false;
        emptyBox.querySelector('span').textContent = t('empty');
        return;
      }
      if (!list.length) {
        grid.innerHTML = '';
        emptyBox.hidden = false;
        emptyBox.querySelector('span').textContent = t('emptyFound');
        return;
      }
      emptyBox.hidden = true;
      grid.innerHTML = list.map(card).join('');
    }
    grid.addEventListener('click', e => {
      const link = e.target.closest('a[data-open="tel"]');
      if (link) return; // lascia aprire tel:
      const art = e.target.closest('.note');
      if (!art) return;
      const a = appunti.find(x => x.id === art.dataset.id);
      if (!a) return;
      openViewer(a.id);
    });
    search.addEventListener('input', render);
    $('chips').addEventListener('click', e => {
      const c = e.target.closest('.chip');
      if (c) { filter = c.dataset.f; render(); }
    });

    // ===== Editor =====
    function syncTodoAttrs() {
      fBody.querySelectorAll('.todo input[type=checkbox]').forEach(i => {
        if (i.checked) i.setAttribute('checked', '');
        else i.removeAttribute('checked');
      });
    }
    function collect() {
      syncTodoAttrs();
      const d = {
        title: fTitle.value.trim(),
        numero: fNumero.value.trim(),
        html: fBody.innerHTML.trim(),
      };
      if (editType === 'tel') {
        const hours = collectSched();
        d.hours = hours;
        // se non c'è più nessun orario nuovo, conserva l'eventuale vecchio testo
        const cur = appunti.find(x => x.id === editId);
        d.orario = Object.keys(hours).length ? '' : (cur && cur.orario ? cur.orario : '');
      }
      return d;
    }
    function isEmpty(d) {
      const noSched = !d.hours || !Object.keys(d.hours).length;
      return !d.title && !d.numero && !d.orario && noSched && !plainText(d.html).trim();
    }
    function scheduleSave() {
      fStatus.textContent = '';
      clearTimeout(saveT);
      saveT = setTimeout(() => {
        if (!editId) return;
        const a = appunti.find(x => x.id === editId);
        if (!a) return;
        Object.assign(a, collect(), { updated: Date.now() });
        if (isEmpty(a)) appunti = appunti.filter(x => x.id !== editId);
        save(); render();
        fStatus.textContent = t('saved');
      }, 500);
    }
    function openEditor(type, id) {
      editType = type;
      editId = id || uid();
      if (!id) appunti.unshift({ id: editId, type, title: '', numero: '', orario: '', hours: {}, html: '', updated: Date.now() });
      const a = appunti.find(x => x.id === editId);
      $('form-title').textContent = t((id ? 'edit' : 'new') + (type === 'tel' ? 'Tel' : 'Note'));
      telWrap.hidden = type !== 'tel';
      fTitle.value = a.title || '';
      fNumero.value = a.numero || '';
      if (type === 'tel') buildSched(a.hours || {});
      fBody.innerHTML = a.html || '';
      fStatus.textContent = '';
      $('btn-del').style.display = id ? '' : 'none';
      modal.hidden = false;
      setTimeout(() => (telWrap.hidden ? fTitle : fNumero).focus(), 50);
    }
    function closeEditor() {
      clearTimeout(saveT);
      if (editId) {
        const a = appunti.find(x => x.id === editId);
        if (a) {
          Object.assign(a, collect(), { updated: Date.now() });
          if (isEmpty(a)) appunti = appunti.filter(x => x.id !== editId);
          save(); render();
        }
      }
      editId = null;
      modal.hidden = true;
    }
    $('btn-add-note').onclick = () => openEditor('note');
    $('btn-add-tel').onclick = () => openEditor('tel');
    $('btn-close').onclick = closeEditor;
    modal.addEventListener('mousedown', e => { if (e.target === modal) closeEditor(); });
    [fTitle, fNumero].forEach(el => el.addEventListener('input', scheduleSave));
    fBody.addEventListener('input', scheduleSave);
    schedRows.addEventListener('input', scheduleSave);
    schedRows.addEventListener('change', scheduleSave);
    schedSimple.addEventListener('input', scheduleSave);
    schedSimple.addEventListener('change', scheduleSave);
    $('btn-del').onclick = () => {
      if (!editId) return;
      if (confirm(t('confirmDelete'))) {
        appunti = appunti.filter(x => x.id !== editId);
        save(); render();
        editId = null;
        modal.hidden = true;
      }
    };

    // ===== Toolbar formattazione (stile My JW, execCommand) =====
    document.querySelectorAll('#toolbar button').forEach(b => b.addEventListener('mousedown', e => e.preventDefault()));
    document.querySelectorAll('#toolbar [data-cmd]').forEach(b => b.addEventListener('click', () => {
      document.execCommand(b.dataset.cmd, false, null);
      fBody.focus();
      scheduleSave();
    }));
    // Checkbox riga (stile My JW .todo)
    $('tool-todo').addEventListener('click', () => {
      fBody.focus();
      const sel = window.getSelection();
      const div = document.createElement('div');
      div.className = 'todo';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.tabIndex = -1;
      div.appendChild(cb);
      div.appendChild(document.createTextNode('\u00A0'));
      if (sel.rangeCount) {
        const r = sel.getRangeAt(0);
        r.deleteContents();
        r.insertNode(div);
        r.setStartAfter(div);
        r.collapse(true);
        sel.removeAllRanges();
        sel.addRange(r);
      } else {
        fBody.appendChild(div);
      }
      fBody.focus();
      scheduleSave();
    });
    // Colore testo
    const palette = $('palette');
    $('tool-color').addEventListener('click', e => { e.stopPropagation(); palette.hidden = !palette.hidden; $('linkrow').hidden = true; });
    palette.addEventListener('click', e => {
      const sw = e.target.closest('.swatch');
      if (!sw) return;
      fBody.focus();
      if (sw.id === 'sw-reset') unwrapColor();
      else document.execCommand('foreColor', false, sw.dataset.c);
      scheduleSave();
    });
    function unwrapColor() {
      const sel = window.getSelection();
      if (!sel.rangeCount) return;
      let node = sel.getRangeAt(0).commonAncestorContainer;
      if (node.nodeType === 3) node = node.parentNode;
      while (node && node !== fBody) {
        if (node.nodeName === 'SPAN' && node.style.color) {
          const parent = node.parentNode;
          while (node.firstChild) parent.insertBefore(node.firstChild, node);
          parent.removeChild(node);
          break;
        }
        node = node.parentNode;
      }
    }
    // Link (stile My JW: titolo + url)
    const linkrow = $('linkrow');
    $('tool-link').addEventListener('click', e => { e.stopPropagation(); linkrow.hidden = !linkrow.hidden; palette.hidden = true; if (!linkrow.hidden) $('link-url').focus(); });
    $('link-ok').addEventListener('click', () => {
      const url = $('link-url').value.trim();
      if (!url) return;
      const title = $('link-title').value.trim() || url;
      fBody.focus();
      const sel = window.getSelection();
      if (sel.rangeCount && !sel.getRangeAt(0).collapsed) {
        document.execCommand('createLink', false, url);
      } else {
        const a = document.createElement('a');
        a.href = url;
        a.textContent = title;
        if (sel.rangeCount) {
          const r = sel.getRangeAt(0);
          r.deleteContents();
          r.insertNode(a);
          r.setStartAfter(a);
          r.collapse(true);
          sel.removeAllRanges();
          sel.addRange(r);
        } else fBody.appendChild(a);
      }
      $('link-url').value = '';
      $('link-title').value = '';
      linkrow.hidden = true;
      fBody.focus();
      scheduleSave();
    });
    document.addEventListener('click', e => {
      if (!e.target.closest('#toolbar') && !e.target.closest('.palette') && !e.target.closest('.linkrow')) {
        palette.hidden = true;
        linkrow.hidden = true;
      }
    });

    // ===== Visualizzatore (sola lettura, poi Modifica) =====
    const viewer = $('viewer');
    let viewId = null;
    function openViewer(id) {
      const a = appunti.find(x => x.id === id);
      if (!a) return;
      viewId = id;
      const isTel = a.type === 'tel';
      $('v-title').textContent = a.title || t(isTel ? 'tagTel' : 'tagNote');
      const vTel = $('v-tel');
      vTel.hidden = !isTel;
      if (isTel) {
        const telHref = 'tel:' + String(a.numero || '').replace(/[^\d+]/g, '');
        $('v-num').innerHTML = a.numero ? `<a href="${esc(telHref)}">${esc(a.numero)}</a>` : '';
        const st = openState(a);
        const vOpen = $('v-open');
        if (st) {
          vOpen.hidden = false;
          vOpen.innerHTML = `<span class="openline"><span class="odot${st === 'closed' ? ' closed' : ''}"></span>${esc(t(st === 'open' ? 'openNow' : 'closedNow'))}</span>`;
        } else vOpen.hidden = true;
        const lines = schedLines(a);
        $('v-sched').innerHTML = lines.map(l => `<div>${esc(l)}</div>`).join('') || (a.orario ? esc(a.orario) : '');
      }
      const vb = $('v-body');
      vb.innerHTML = sanitizePreview(a.html);
      // link esterni in nuova scheda
      vb.querySelectorAll('a[href^="http"]').forEach(l => { l.target = '_blank'; l.rel = 'noopener'; });
      $('v-date').textContent = fmtDate(a.updated);
      viewer.hidden = false;
    }
    function closeViewer() { viewId = null; viewer.hidden = true; }
    $('btn-vclose').onclick = closeViewer;
    $('btn-vdel').onclick = () => {
      if (!viewId) return;
      if (confirm(t('confirmDelete'))) {
        appunti = appunti.filter(x => x.id !== viewId);
        save(); render();
        viewId = null;
        viewer.hidden = true;
      }
    };
    viewer.addEventListener('mousedown', e => { if (e.target === viewer) closeViewer(); });
    $('btn-edit').onclick = () => {
      const a = appunti.find(x => x.id === viewId);
      viewer.hidden = true;
      viewId = null;
      if (a) openEditor(a.type, a.id);
    };
    // ===== Menu ingranaggio =====
    const tools = $('tools');
    $('menuBtn').onclick = (e) => { e.stopPropagation(); tools.classList.toggle('open'); };
    document.addEventListener('click', (e) => { if (!tools.contains(e.target)) tools.classList.remove('open'); });
    $('drop').addEventListener('click', (e) => { if (e.target.closest('button')) tools.classList.remove('open'); });

    // ===== Esporta / Importa =====
    $('btn-export').onclick = () => {
      const blob = new Blob([JSON.stringify(appunti, null, 2)], { type: 'application/json' });
      const link = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: 'appunti.json' });
      link.click();
      setTimeout(() => URL.revokeObjectURL(link.href), 1000);
    };
    $('btn-import').onclick = () => $('file-import').click();
    $('file-import').onchange = async e => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const d = JSON.parse(await file.text());
        if (!Array.isArray(d)) throw new Error();
        const valid = d.filter(x => x && (x.title || x.numero || x.orario || x.hours || x.html)).map(x => ({
          id: String(x.id || uid()),
          type: x.type === 'tel' ? 'tel' : 'note',
          title: String(x.title || ''),
          numero: String(x.numero || ''),
          orario: String(x.orario || ''),
          hours: (x.hours && typeof x.hours === 'object') ? x.hours : {},
          html: String(x.html || ''),
          updated: Number(x.updated) || Date.now(),
        }));
        if (confirm(t('confirmImport', { n: valid.length }))) {
          appunti = valid; save(); render();
        }
      } catch { alert(t('invalidFile')); }
      e.target.value = '';
    };

    document.addEventListener('keydown', e => {
      if (e.key !== 'Escape') return;
      if (tools.classList.contains('open')) { tools.classList.remove('open'); return; }
      if (!viewer.hidden) { closeViewer(); return; }
      if (!modal.hidden) closeEditor();
    });

    // ===== Tema globale =====
    (function syncGlobalTheme() {
      const G = 'mylollotool-theme';
      function apply(th) { document.body.classList.toggle('dark', th === 'dark'); }
      try { const g = localStorage.getItem(G); if (g === 'dark' || g === 'light') apply(g); } catch (e) {}
      window.addEventListener('message', (e) => {
        if (e?.data?.type === G && (e.data.theme === 'dark' || e.data.theme === 'light')) {
          apply(e.data.theme);
          try { localStorage.setItem(G, e.data.theme); } catch (err) {}
        }
      });
      window.addEventListener('storage', (e) => {
        if (e.key === G && (e.newValue === 'dark' || e.newValue === 'light')) apply(e.newValue);
      });
    })();

    // ===== Lingua globale =====
    function applyLang(l) {
      curLang = LANGS.includes(l) ? l : 'it';
      document.documentElement.lang = curLang;
      try { localStorage.setItem(LANG_KEY, curLang); } catch (e) {}
      document.title = t('title');
      document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
      document.querySelectorAll('[data-t-ph]').forEach(el => { el.placeholder = t(el.dataset.tPh); });
      document.querySelectorAll('[data-t-title]').forEach(el => { el.title = t(el.dataset.tTitle); });
      fBody.dataset.ph = t('bodyPh');
      render();
    }
    window.addEventListener('message', (e) => {
      if (e?.data?.type === LANG_KEY && LANGS.includes(e.data.lang)) applyLang(e.data.lang);
    });
    window.addEventListener('storage', (e) => {
      if (e.key === LANG_KEY && LANGS.includes(e.newValue)) applyLang(e.newValue);
    });

    applyLang(curLang);
  </script>

  /* Alone blu che segue il mouse (su touch niente; con "riduci movimento" alone fisso) */
