    (function(){

      const btn = document.getElementById('themeBtn');

      const moonSvg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
      const sunSvg  = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
      const GLOBAL_KEY = 'mylollotool-theme';
      function readTheme() {
        // Il menu laterale di index.html è la fonte unica: poi fallback storico
        const g = localStorage.getItem(GLOBAL_KEY);
        if (g === 'dark' || g === 'light') return g;
        return localStorage.getItem('sct-theme') || 'light';
      }
      function applyTheme(t, notifyParent = false) {
        const dark = t === 'dark';
        body.classList.toggle('dark', dark);
        try {
          localStorage.setItem('sct-theme', dark ? 'dark' : 'light');
          localStorage.setItem(GLOBAL_KEY, dark ? 'dark' : 'light');
        } catch (e) {}
        updateBtn();
        if (notifyParent) {
          try { window.parent?.postMessage({ type: GLOBAL_KEY, theme: dark ? 'dark' : 'light' }, '*'); } catch (e) {}
        }
      }
      // Ripristina il tema salvato (default: light)
      if (readTheme() === 'dark') {
        body.classList.add('dark');
      }
      function updateBtn() {
        if (!btn) return;
        btn.innerHTML = body.classList.contains('dark') ? moonSvg : sunSvg;
      }
      if (btn) btn.addEventListener('click', () => {
        applyTheme(body.classList.contains('dark') ? 'light' : 'dark', true);
      });
      // Cambio tema comandato dal menu laterale di index.html
      window.addEventListener('message', (e) => {
        if (e?.data?.type === GLOBAL_KEY && (e.data.theme === 'dark' || e.data.theme === 'light')) {
          applyTheme(e.data.theme, false);
        }
      });
      window.addEventListener('storage', (e) => {
        if (e.key === GLOBAL_KEY && (e.newValue === 'dark' || e.newValue === 'light')) {
          applyTheme(e.newValue, false);
        }
      });
      updateBtn();
    })();

    (function(){
      const btn = document.getElementById('expandBtn');

      // Restore saved state
      const saved = localStorage.getItem('sct-expanded');
      if (saved === '1') {
        wrap.classList.add('expanded');
      }
      function updateBtn() {
        btn.innerHTML = wrap.classList.contains('expanded') ? collapseSvg : expandSvg;
      }
      updateBtn();

      const DURATION = 500;

      btn.addEventListener('click', () => {
        if (wrap.classList.contains('expanded')) {
          // === COLLAPSE ===
          // Step 1: lock current width, switch grid to 2-col FIRST
          const currentWidth = wrap.offsetWidth;
          wrap.style.maxWidth = currentWidth + 'px';
          void wrap.offsetWidth; // force reflow
          wrap.classList.remove('expanded');
          updateBtn();
          // Step 2: after grid snaps to 2-col, animate width down to CSS value (900px)
          setTimeout(() => {
            wrap.style.maxWidth = '900px';
          }, 30);
          localStorage.setItem('sct-expanded', '0');
        } else {
          // === EXPAND ===
          // Step 1: lock current width, switch grid to auto-fit FIRST
          const currentWidth = wrap.offsetWidth;
          wrap.style.maxWidth = currentWidth + 'px';
          void wrap.offsetWidth; // force reflow
          wrap.classList.add('expanded');
          updateBtn();
          // Step 2: animate width to full viewport
          setTimeout(() => {
            wrap.style.maxWidth = '100vw';
          }, 30);
          localStorage.setItem('sct-expanded', '1');
        }
      });
    })();

      /* taasalo3 — Loris Salerno */

      function parseCSV(text) {
        const rows = [];
        let row = [], field = '';
        let inQuotes = false;
        const s = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
        for (let i = 0; i < s.length; i++) {
          const c = s[i];
          if (c === '"') {
            if (inQuotes && s[i+1] === '"') { field += '"'; i++; }
            else { inQuotes = !inQuotes; }
          } else if (c === ',' && !inQuotes) {
            row.push(field); field = '';
          } else if (c === '\n' && !inQuotes) {
            row.push(field); field = '';
            rows.push(row); row = [];
          } else {
            field += c;
          }
        }
        if (field.length > 0 || row.length) { row.push(field); rows.push(row); }
        return rows;
      }

      /* Loris Salerno | taasalo3 */
      function normLabel(s) { return (s || '').trim().replace(/\s*:\s*$/, '').trim(); }
      function firstNonEmpty(...xs) {
        for (const x of xs) if (x != null && String(x).trim() !== '') return String(x).trim();
        return '';
      }
      function toNumber(s) {
        if (s == null) return NaN;
        const t = String(s).trim();
        if (!t || /^N\/A$/i.test(t)) return NaN;
        const z = t.replace(/'/g, '').replace(/\s+/g, '');
        const n = Number(z);
        return Number.isFinite(n) ? n : NaN;
      }
      function kbitToMbitInt(kb) {
        if (!Number.isFinite(kb)) return null;
        return Math.round(kb / 1000);
      }

      /* by Loris Salerno */
      function buildPairs(rows) {
        const map = new Map();
        for (const r of rows) {
          if (!r || r.length < 2) continue;
          const first = normLabel(r[0]);
          if (/^(Parameter|Task Id|TASKID|PORT|Long Period Diagnosis|Line Information|Diagnosis Information|Event Counters Information|Basic Link Data Information|Port Stability|Show Time)/i.test(first)) continue;
          for (let i = 0; i + 1 < r.length; i += 2) {
            const k = normLabel(r[i]);
            const v = (r[i+1] || '').trim();
            if (!k) continue;
            if (!map.has(k) && v) map.set(k, v);
          }
        }
        return map;
      }

      function findBasicRow(rows, paramNamePrefix) {
        for (const r of rows) {
          if (!r || r.length < 3) continue;
          const k = normLabel(r[0]);
          if (k && k.toLowerCase().startsWith(paramNamePrefix.toLowerCase())) return r;
        }
        return null;
      }

      function extractTimeSeries(rows) {
        const series = [];
        for (let i = 0; i < rows.length; i++) {
          const r = rows[i];
          if (!r || r.length < 4) continue;
          if (normLabel(r[0]) === 'Task Id' && /Collection Time/i.test(r[1] || '')) {
            // Find the "Task Id" column (index 0) and "Collection Time" (index 1)
            // then locate CV/FEC columns relative to known anchors for robustness.
            const taskIdx = r.findIndex(x => /^Task Id$/i.test(normLabel(x)));
            const collTimeIdx = r.findIndex(x => /Collection Time/i.test(x || ''));
            // Search for CV/FEC columns only after the Collection Time column
            // to avoid matching duplicate labels in other sections.
            const searchFrom = Math.max(taskIdx, collTimeIdx, 0) + 1;
            const idx = {
              time: collTimeIdx,
              cvDS: r.findIndex((x, i) => i >= searchFrom && /^Coding Violation DS$/i.test(normLabel(x))),
              cvUS: r.findIndex((x, i) => i >= searchFrom && /^Coding Violation US$/i.test(normLabel(x))),
              fecDS: r.findIndex((x, i) => i >= searchFrom && /^Forward Error Corrections DS$/i.test(normLabel(x))),
              fecUS: r.findIndex((x, i) => i >= searchFrom && /^Forward Error Corrections US$/i.test(normLabel(x))),
              tgtDS: r.findIndex((x, i) => i >= searchFrom && /^Target Margin DS\(dB\)$/i.test(normLabel(x))),
              tgtUS: r.findIndex((x, i) => i >= searchFrom && /^Target Margin US\(dB\)$/i.test(normLabel(x))),
            };
            for (let j = i + 1; j < rows.length; j++) {
              const rr = rows[j];
              if (!rr || rr.length < 2) continue;
              const maybeHeader = normLabel(rr[0]);
              if (maybeHeader === 'Task Id' || maybeHeader === 'TASKID' || maybeHeader === 'PORT') break;
              // FIX: il CSV esportato spezza ogni record su 2 righe fisiche
              // (riga dati da 82 col + riga di continuazione hex QLN/HLOG da 7 col).
              // Con "break" alla prima riga non numerica si raccoglieva 1 solo campione
              // -> delta CV/FEC sempre 0. Qui si saltano le continuazioni (continue)
              // e si accettano solo righe dati vere: TaskId numerico + Collection Time valida.
              if (!/^\d+\s*$/.test((rr[0] || '').trim())) continue;
              const tRaw = (idx.time >= 0 && rr[idx.time]) ? rr[idx.time].trim() : '';
              const tVal = parseCollectionTime(tRaw);
              if (!Number.isFinite(tVal)) continue;
              const maxIdx = Math.max(idx.cvDS, idx.cvUS, idx.fecDS, idx.fecUS, idx.tgtDS, idx.tgtUS);
              if (maxIdx >= 0 && rr.length <= maxIdx) continue;
              series.push({
                t: tVal,
                cvDS: (idx.cvDS >= 0) ? toNumber(rr[idx.cvDS]) : NaN,
                cvUS: (idx.cvUS >= 0) ? toNumber(rr[idx.cvUS]) : NaN,
                fecDS: (idx.fecDS >= 0) ? toNumber(rr[idx.fecDS]) : NaN,
                fecUS: (idx.fecUS >= 0) ? toNumber(rr[idx.fecUS]) : NaN,
                tgtDS: (idx.tgtDS >= 0) ? toNumber(rr[idx.tgtDS]) : NaN,
                tgtUS: (idx.tgtUS >= 0) ? toNumber(rr[idx.tgtUS]) : NaN,
              });
            }
          }
        }
        series.sort((a, b) => {
          const ta = Number.isFinite(a.t) ? a.t : Infinity;
          const tb = Number.isFinite(b.t) ? b.t : Infinity;
          return ta - tb;
        });
        return series;
      }

      function parseCollectionTime(s) {
        const t = (s || '').trim();
        const m = t.match(/^(\d{2})\.(\d{2})\.(\d{2})\s+(\d{2}):(\d{2}):(\d{2})$/);
        if (m) {
          const dd = Number(m[1]), MM = Number(m[2]), yy = Number(m[3]);
          const yyyy = 2000 + yy;
          const hh = Number(m[4]), mi = Number(m[5]), ss = Number(m[6]);
          return Date.UTC(yyyy, MM - 1, dd, hh, mi, ss);
        }
        const d = new Date(t);
        return isNaN(d.getTime()) ? NaN : d.getTime();
      }

      function summarizeDelta(series, key) {
        const xs = series.filter(r => Number.isFinite(r[key]));
        if (xs.length < 1) return { first: NaN, last: NaN, delta: NaN };
        if (!Number.isFinite(xs[0][key]) || !Number.isFinite(xs[xs.length - 1][key])) return { first: xs[0][key], last: xs[xs.length - 1][key], delta: NaN };
        // CV/FEC counters are cumulative — sum individual positive deltas
        // between consecutive rows to handle counter resets/rewinds correctly.
        let total = 0;
        for (let i = 1; i < xs.length; i++) {
          const d = xs[i][key] - xs[i - 1][key];
          if (d > 0) total += d;
        }
        return { first: xs[0][key], last: xs[xs.length - 1][key], delta: total };
      }

      function pickLatestFinite(series, key) {
        for (let i = series.length - 1; i >= 0; i--) {
          const v = series[i][key];
          if (Number.isFinite(v)) return v;
        }
        return NaN;
      }

      function placeHeaderDSUS() {
        return '                                             DS                             US';
      }

      function placeRateRow(label, dsStr, usStr) {
        if (label === 'Actual bit.') {
          return LM + label + '                    ' + dsStr + '            ' + usStr;
        } else if (label === 'Attainable bit.') {
          return LM + label + '            ' + dsStr + '            ' + usStr;
        }
        return LM + label + '            ' + dsStr + '            ' + usStr;
      }

      /* Loris Salerno — taasalo3 */
      function formatDiagDate(raw) {
        // Converte "Jun 19, 2026 4:40:44 PM" (o simili) in "19/06/2026 - 16:40"
        if (!raw) return '';
        const d = new Date(raw.trim());
        if (isNaN(d.getTime())) return raw.trim();
        const dd   = String(d.getDate()).padStart(2, '0');
        const mm   = String(d.getMonth() + 1).padStart(2, '0');
        const yyyy = d.getFullYear();
        const hh   = String(d.getHours()).padStart(2, '0');
        const mi   = String(d.getMinutes()).padStart(2, '0');
        return `${dd}/${mm}/${yyyy} - ${hh}:${mi}`;
      }

      function buildSummary(rows) {
        const kv = buildPairs(rows);

        const lineId = (kv.get('Line ID') || '').trim();
        const customerId = (kv.get('Customer ID') || '').trim();
        const monitoring = (kv.get('Monitoring Duration') || '').trim();

        const profile = ((kv.get('Spectrum Profile Name') || kv.get('DSL Type')) || '').trim();
        const startTime = formatDiagDate(kv.get('Start Time') || '');

        const actualRow = findBasicRow(rows, 'Actual Data Rate');

        const actualUS_k = actualRow ? Number((actualRow[1] || '').replace(/'/g,'')) : NaN;

        const attainDS_M = Number.isFinite(attainDS_k) ? Math.round(attainDS_k/1000) : null;

        const fmtMbps = v => (v == null ? 'N/D' : `${v} Mbit/s`);

        const series = extractTimeSeries(rows);
        const dCV_DS = summarizeDelta(series, 'cvDS');

        const dFEC_DS = summarizeDelta(series, 'fecDS');
        const dFEC_US = summarizeDelta(series, 'fecUS');
        const tnmDS = pickLatestFinite(series, 'tgtDS');

        const reinit = (kv.get('Reinit Count') || '').trim();

        const shortInt = (kv.get('Short Int') || '').trim();

        let bridgeTap = '';

        const lines = [];

        lines.push(placeRateRow('Attainable bit.',  fmtMbps(attainDS_M ?? null),   fmtMbps(attainUS_M ?? null)));

        if (Number.isFinite(tnmDS) || Number.isFinite(tnmUS)) {

        const cvUS = Number.isFinite(dCV_US.delta) ? dCV_US.delta : 'N/D';
        const fecDS = Number.isFinite(dFEC_DS.delta) ? dFEC_DS.delta : 'N/D';
        const fecUS = Number.isFinite(dFEC_US.delta) ? dFEC_US.delta : 'N/D';

      /**

      function detectFormat(text) {

        // ed ha una struttura a blocchi con label e valori sulla stessa riga.
        // Il formato CSV inizia con "Long Period Diagnosis" e ha righe
        // con molte virgole (intestazione + dati).
        if (/^Real-Time Diagnosis/i.test(text.trim())) return 'instant';
        if (/^Long Period Diagnosis/i.test(text.trim())) return 'csv';
        // Fallback: conta le virgole per riga
        const lines = text.split('\n').filter(l => l.trim());
        const commas = (text.match(/,/g) || []).length;
        if (lines.length > 0 && commas / lines.length > 3) return 'csv';
        // Fallback: cerca marker specifici dell'instant
        if (/Noise Margin Profile Name:\s*NM_\d+_\d+_SRA/i.test(text)) return 'instant';
        return 'csv';

        const fmtM = v => (Number.isFinite(v) ? Math.round(v / 1000) : 'N/D');

            continue;

          const extID    = (cols[colIdx['Device EXT ID']] || '').trim();
          const model    = (cols[colIdx['Device Model']]  || '').trim();
          const connType = (cols[colIdx['PBA Connection Type']] || '').trim();
          const metricName = (cols[colIdx['Nomi misure']] || '').trim();
          const metricValRaw = (cols[colIdx['Valori misure']] || '').trim();

          if (!extID || !metricName) continue;

          // Registra device se nuovo
          if (!deviceMap.has(extID)) {
            deviceMap.set(extID, {
              model,
              mac: macFromUUID(extID),
              connections: new Map(),
            });
            deviceOrder.push(extID);
          }

          const dev = deviceMap.get(extID);

          // Registra connection type se nuovo
          if (!dev.connections.has(connType)) {
            dev.connections.set(connType, {
              live: 0, replrec: 0, crash: 0,
              pktExpired: 0, pktHoles: 0,
              buffer: 0, playbackErrors: 0, hdmiHotplug: 0,
            });
          }

          const key = METRIC_MAP[metricName];
          if (!key) continue;

          const val = parseNum(metricValRaw);
          dev.connections.get(connType)[key] += val;
        }

        // Converti in array ordinato
        return deviceOrder.map(extID => {
          const dev = deviceMap.get(extID);
          return {
            model: dev.model,
            mac: dev.mac,
            connections: Array.from(dev.connections.entries()).map(([type, m]) => ({ type, metrics: m })),
          };
        });
      }

      /* ── Formatter P42 — by Loris Salerno | taasalo3 — watermark */
      function formatOutputP42(devices) {
        const IND0 = '  ';
        const IND1 = '    ';
        const IND2 = '      ';
        const IND3 = '        ';
        const BULLET = '•';
        const lines = [];
        lines.push(`${IND0}>Settopbox:`);

        if (!devices.length) {
          lines.push(`${IND1}>N/D (N/D - last 7 days)`);
          lines.push(`${IND2}${BULLET} Info: `);
          return lines.join('\n');
        }

        for (let i = 0; i < devices.length; i++) {
          const d = devices[i];
          lines.push(`${IND1}>${d.model} (${d.mac} - last 7 days)`);
          for (const conn of d.connections) {
            lines.push(`${IND2}${BULLET} Connection: ${conn.type}`);
            const m = conn.metrics;
            if (m.live === 0 && m.replrec === 0) {
              lines.push(`${IND3}No View Time`);
            } else {
              // Live (se >= 60 min mostra ore, se > 0 min mostra minuti)
              const liveH = Math.round(m.live / 60);
              if (m.live >= 60 && liveH > 0) {
                lines.push(`${IND3}${liveH}h Live`);
              } else if (m.live > 0) {
                lines.push(`${IND3}${Math.round(m.live)}m Live`);
              }

              // Repl/Rec (se >= 60 min mostra ore, se > 0 min mostra minuti)
              const replH = Math.round(m.replrec / 60);
              if (m.replrec >= 60 && replH > 0) {
                lines.push(`${IND3}${replH}h Repl/Rec`);
              } else if (m.replrec > 0) {
                lines.push(`${IND3}${Math.round(m.replrec)}m Repl/Rec`);
              }
            }

            // Crash
            if (m.crash > 0) lines.push(`${IND3}${Math.round(m.crash)} Crash`);
            // Pkt Holes
            if (m.pktHoles > 0) lines.push(`${IND3}${formatK(m.pktHoles)} Pkt Holes`);
            // Pkt Expired
            if (m.pktExpired > 0) lines.push(`${IND3}${formatK(m.pktExpired)} Pkt Expired`);
            // Buffer Underrun
            if (m.buffer > 0) lines.push(`${IND3}${formatK(m.buffer)} Buffer`);
            // Channel Playback Errors
            if (m.playbackErrors > 0) lines.push(`${IND3}${formatK(m.playbackErrors)} Playback Errors`);
            // HDMI Hotplug
            if (m.hdmiHotplug > 0) lines.push(`${IND3}${Math.round(m.hdmiHotplug)} HDMI Hotplug`);

            // Quality OK: se ha visto qualcosa (Live o Repl/Rec > 0) e non ci sono errori
            const haVisione = (m.live > 0 || m.replrec > 0);
            const haErrori = (m.crash > 0 || m.pktExpired > 0 || m.pktHoles > 0 || m.buffer > 0 || m.playbackErrors > 0 || m.hdmiHotplug > 0);
            if (haVisione && !haErrori) {
              lines.push(`${IND3}Quality OK`);
            }
          }
          if (i < devices.length - 1) {
            lines.push('');
          }
        }
        return lines.join('\n');
      }

      /* by Loris Salerno | taasalo3 */
      function parseAllBoxes(text) {
        const lines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
        const reHeader = /^(TV[-\s]?Box|Swisscom Box)\s+.+\s*\/\s*([A-Za-z0-9_-]+)$/i;
        // Known TV-Box / Swisscom Box model identifiers (from CLIMA Big Screen Devices)
        const tvBoxModels = /^(IP1400|IP1800|IP2000)$/i;
        const swisscomBoxModels = /^(Swisscom Box|IP2300)$/i;
        const reGenericDevice = /^(.+?)\s*\/\s*([A-Za-z0-9_-]+)$/;
        const headers = [];
        let inBigScreenSection = false;
        for (let i = 0; i < lines.length; i++) {
          const line = (lines[i] || '').trim();
          // Detect Big Screen Devices section in CLIMA output
          if (/big\s*screen\s*device/i.test(line)) {
            inBigScreenSection = true;
            continue;
          }
          // Section ends when we hit another major section
          if (inBigScreenSection && /^(Account\/Product|Activity Log|Channel Lists|Companion Devices|Radio Channel Lists|Internet|Access Device|Overview|Customer|Service )/i.test(line)) {
            inBigScreenSection = false;
            continue;
          }
          const m = line.match(reHeader);
          if (m) {
            const kind = m[1].toLowerCase().startsWith('tv') ? 'TV-Box' : 'Swisscom Box';
            headers.push({ idx: i, kind, number: headers.filter(h => h.kind === kind).length + 1, model: m[2] });
            continue;
          }
          // CLIMA format: "DisplayName / MODEL" (e.g. "Camera2 / IP1800", "Cucina / IP1800")
          // Only match if we're in Big Screen section or the model looks like a known box
          if (inBigScreenSection || tvBoxModels.test(line.split('\/').pop().trim()) || swisscomBoxModels.test(line.split('\/').pop().trim())) {
            const gm = line.match(reGenericDevice);
            if (gm) {
              const displayName = gm[1].trim();
              const model = gm[2].trim();
              // Skip if it's a section header or navigation element
              if (/^(Add New Device|Open in|Reload|Search|Advanced Search|Overview|Customer|Activity Log|Barrings|Incidents|SC Logins|Service Accounts|Service Subscriptions|Service Requests|Internet|Access Devices|Access Location History|All-IP Pairing|CGNAT|Online Session Log|Port 25 Allowlisting|Speed Tests|TV|Account\/Product|Big Screen Devices|Channel Lists|Companion Devices|Radio Channel Lists|Samsung|Wohnzimmer|Apple TV|Version|Model|Vendor|UUID|Client Version|Revision|MAC Address|WiFi MAC|Admin Status|Activation|Marked|Operation Status|Last Login|Last Heartbeat|Screen Capture|Hardware Capabilities|Netflix|Replay|UHD|Voice|Client Settings|Active Channel|Display Name|HDMI|Permanent Stream|Sticky|System Language|Tru Volume)/i.test(displayName)) continue;
              // Skip lines that are clearly not device entries (too long, contain special chars)
              if (displayName.length > 40 || /[>@|]/.test(displayName)) continue;
              // Determine kind from model — only accept recognized models
              let kind = null;
              if (tvBoxModels.test(model)) {
                kind = 'TV-Box';
              } else if (swisscomBoxModels.test(model)) {
                kind = 'Swisscom Box';
              }
              // Only add if model is recognized (no fallback for unknown models)
              if (kind) {
                headers.push({ idx: i, kind, number: headers.filter(h => h.kind === kind).length + 1, model, displayName });
              }
            }
          }
        }

        const results = [];
        const seen = new Set();

        for (let h = 0; h < headers.length; h++) {
          const cur = headers[h];
          const nextIdx = (h + 1 < headers.length) ? headers[h + 1].idx : lines.length;
          const mac = extractMac(lines, cur.idx + 1, nextIdx);
          if (!mac || mac === 'N/D') continue;
          const key = `mac:${mac}`;
          if (seen.has(key)) continue;
          seen.add(key);
          results.push({ idx: cur.idx, kind: cur.kind, number: cur.number, model: cur.model, mac, displayName: cur.displayName });
        }

        results.sort((a, b) => {
          const ka = a.kind === 'TV-Box' ? 0 : 1;
          const kb = b.kind === 'TV-Box' ? 0 : 1;
          if (ka !== kb) return ka - kb;
          if (a.number !== b.number) return a.number - b.number;
          return a.idx - b.idx;
        });

        return results;
      }

      /* Loris Salerno — taasalo3 */
      function extractMac(lines, start, end) {
        const reMac = /\b[0-9A-Fa-f]{2}(?::[0-9A-Fa-f]{2}){5}\b/;
        for (let i = start; i < end; i++) {
          const raw = lines[i] || '';
          const line = raw.trim();
          const low = line.toLowerCase();
          if (low.includes('mac address') && !low.includes('wifi')) {
            const m = line.match(reMac);
            if (m) return m[0].toLowerCase();
          }
        }
        for (let i = start; i < end; i++) {
          const raw = lines[i] || '';
          const line = raw.trim();
          const low = line.toLowerCase();
          if (low.includes('network mac')) {
            const m = line.match(reMac);
            if (m) return m[0].toLowerCase();
          }
        }
        for (let i = start; i < end; i++) {
          const raw = lines[i] || '';
          const line = raw.trim();
          const low = line.toLowerCase();
          if (low.includes('wifi')) continue;
        const m = line.match(reMac);
          if (m) return m[0].toLowerCase();
        }
        return 'N/D';
      }

      /* watermark: Loris Salerno */
      function formatOutput(devices) {
        const IND0 = '  ';

        const lines = [];

          return lines.join('\n');
        }
        for (const d of devices) {
          const label = d.model;
          lines.push(`${IND1}>${label} (${d.mac})`);
          lines.push(`${IND2}${BULLET} P42: Quality ok/nok`);
          lines.push(`${IND2}${BULLET} Info: `);
        }
        return lines.join('\n');
      }
    })();

    (function initClima3(){

      function clearAll() {

      function setStatus(msg) { statusEl.textContent = msg || ''; }

      function run() {
        try {
          climaEl.style.display = 'none';
          speedEl.style.display = 'none';
          const climaTxtRaw = (_rawClimaLS || (climaEl.value || '')).replace(/\r\n/g, '\n').replace(/\r/g, '\n');
          const isPlaceholder = (s) => s.startsWith('\u2714');
          const isEmpty = !climaTxtRaw.trim() || (isPlaceholder(climaTxtRaw) && !_rawClimaLS);
          if (isEmpty) {
            setStatus(__('stNothingProcessGeneric'));
            out.textContent = '';
            climaEl.focus();
            return;
          }
          const parsedClima = parseClima(climaTxtRaw);
          const speedTxtRaw = (_rawSpeedLS || (speedEl.value || '')).trim();
          const hasSpeed = speedTxtRaw && !isPlaceholder(speedTxtRaw);
          const parsedSpeed = hasSpeed ? parseSpeed(speedTxtRaw) : null;
          out.textContent = formatOutput(parsedClima, parsedSpeed);
          setStatus(__('stDone'));
        } catch (e) {
          console.error(e);
          setStatus(__('stError') + ': ' + (e.message || e));
        }
      }

      /* by Loris Salerno | taasalo3 */
      function parseClima(text) {
        const lines = text.split('\n');
        const lastReboot = findDateNearLabel(lines, ['Last Reboot']);
        const lastReset = findDateNearLabel(lines, ['Last Reset']) ||
                          findDateNearLabel(lines, ['Last Activation']) ||
                          null;
        const firstContact = findDateNearLabel(lines, ['First Contact']);

        let routerModel = 'N/D';
        let firmware = 'N/D';

        for (let i = 0; i < lines.length; i++) {
          const line = (lines[i] || '').trim();
          if (!line) continue;
          
          if (line.toLowerCase() === 'access devices') {
            const nextLine = (lines[i + 1] || '').trim();
            if (nextLine && nextLine.toLowerCase() !== 'access location history') {
              routerModel = nextLine;
            }
          }
          if (line.toLowerCase() === 'firmware' && firmware === 'N/D') {
            for (let j = 1; j <= 3 && i + j < lines.length; j++) {
              const nxt = (lines[i + j] || '').trim();
              if (nxt) {
                firmware = nxt;
                break;
              }
            }
          }
        }

        return {
          lastRebootDate: lastReboot ? lastReboot.date : 'N/D',
          lastResetDate: lastReset ? lastReset.date : 'N/D',
          firstContactDate: firstContact ? firstContact.date : 'N/D',
          routerModel: routerModel,
          firmware: firmware
        };
      }

      function findDateNearLabel(lines, labels) {
        const dateRe = /(\d{1,2}\.\d{1,2}\.\d{4})(?:\s+(\d{2}:\d{2}:\d{2}))?/;
        for (let i = 0; i < lines.length; i++) {
          const line = (lines[i] || '').trim();
          if (!line) continue;
          for (const rawLabel of labels) {
            const label = rawLabel.toLowerCase();
            if (line.toLowerCase().includes(label)) {
              let m = line.match(dateRe);
              if (m) return { date: m[1], time: m[2] || '' };
              for (let j = 1; j <= 3 && i + j < lines.length; j++) {
                const nxt = (lines[i + j] || '').trim();
                if (!nxt) continue;
                m = nxt.match(dateRe);
                if (m) return { date: m[1], time: m[2] || '' };
              }
            }
          }
        }
        return null;
      }

      /* by Loris Salerno | taasalo3 */
      function parseSpeed(text) {
        const result = {};

        // --- Formato compatto: "6 ms    Ipv4     513.8 Mbit/s  129.6 Mbit/s"
        //     oppure            "6 ms    Ipv4     8.1 Gbit/s    5.5 Gbit/s"
        const compactLine = text.split(/\r?\n/).find(l => /[MG]bit\/s/i.test(l));
        if (compactLine) {
          const bitMatches = [...compactLine.matchAll(/([\d.]+)\s*([MG]bit\/s)/gi)];
          if (bitMatches.length >= 2) {
            result.download     = bitMatches[0][1];
            result.downloadUnit = bitMatches[0][2];
            result.upload       = bitMatches[1][1];
            result.uploadUnit   = bitMatches[1][2];
          } else if (bitMatches.length === 1) {
            result.download     = bitMatches[0][1];
            result.downloadUnit = bitMatches[0][2];
          }
          const pingM = compactLine.match(/([\d.]+)\s*ms/i);
          if (pingM) result.ping = pingM[1];
          return result;
        }

        // --- Formato con etichette: "Download: X Mbit/s | Upload: Y Mbit/s | Ping: Z ms" ---
        const parts = text.split(/\s*\|\s*/);
        for (const part of parts) {
          const trimmed = part.trim();
          if (!trimmed) continue;
          const dlMatch   = trimmed.match(/Download:\s*([\d.]+)\s*([MG]bit\/s)/i);
          const ulMatch   = trimmed.match(/Upload:\s*([\d.]+)\s*([MG]bit\/s)/i);
          const pingMatch = trimmed.match(/Ping:\s*([\d.]+)\s*ms/i);
          if (dlMatch)   { result.download = dlMatch[1]; result.downloadUnit = dlMatch[2]; }
          if (ulMatch)   { result.upload   = ulMatch[1]; result.uploadUnit   = ulMatch[2]; }
          if (pingMatch) { result.ping = pingMatch[1]; }
        }
        return result;
      }

      /* watermark: Loris Salerno taasalo3 */
      function formatOutput(clima, speed) {
        const IND0 = '';

        lines.push(`${IND1}>Last Reebot (${clima.lastRebootDate})`);
        lines.push(`${IND1}>Last Reset (${clima.lastResetDate})`);
        lines.push(`${IND1}>DHCP online logs ok/nok`);
        lines.push(`${IND1}>Router Diagnosi `);
        lines.push(`${IND2}${BULLET} CPU/RAM ok/nok`);
        lines.push(`${IND2}${BULLET} Wlan 2.4Ghz ok/nok`);
        lines.push(`${IND2}${BULLET} Wlan 5Ghz ok/nok`);
        if (speed && (speed.download || speed.upload || speed.ping)) {
          lines.push(`${IND1}>Speed Test:`);
          if (speed.download) lines.push(`${IND2}${BULLET} Download: ${speed.download} ${speed.downloadUnit || 'Mbit/s'}`);
          if (speed.upload)   lines.push(`${IND2}${BULLET} Upload: ${speed.upload} ${speed.uploadUnit || 'Mbit/s'}`);
          if (speed.ping)     lines.push(`${IND2}${BULLET} Ping: ${speed.ping} ms`);
        }
        lines.push(`${IND1}>Info:`);
        return lines.join('\n');
      }
    })();
