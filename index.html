<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyLolloTool</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: system-ui, sans-serif; overflow: hidden; }

    /* Icone SVG */
    svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2;
          stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

    /* Pulsante hamburger */
    #toggle {
      position: fixed; top: 12px; left: 12px; z-index: 1001;
      width: 42px; height: 42px; border: none; border-radius: 8px;
      background: #001155; color: #fff; cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,.3);
      display: grid; place-items: center;
    }
    #toggle svg { width: 22px; height: 22px; }

    /* Menu laterale */
    #sidebar {
      position: fixed; top: 0; left: 0; height: 100%; width: 250px;
      background: #001155; color: #fff; padding: 70px 0 20px;
      transform: translateX(-100%); transition: transform .25s ease;
      z-index: 1000; display: flex; flex-direction: column;
    }
    #sidebar.open { transform: translateX(0); }
    #sidebar h2 { font-size: 14px; opacity: .6; padding: 0 20px 10px; text-transform: uppercase; }
    #sidebar a {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 20px; color: #fff; text-decoration: none;
      border-left: 4px solid transparent;
    }
    #sidebar a:hover { background: rgba(255,255,255,.08); }
    #sidebar a.active { background: rgba(255,255,255,.15); border-left-color: #1781e3; }

    /* Selettore tema in fondo al menu */
    #theme-box { margin-top: auto; padding: 16px 16px 4px; }
    #theme-box .theme-label {
      display: flex; align-items: center; gap: 8px;
      font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
      opacity: .55; margin: 0 4px 8px;
    }
    #theme-box .theme-label svg { width: 14px; height: 14px; }
    .theme-segment {
      display: flex; gap: 4px; padding: 4px;
      background: rgba(255,255,255,.1);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 12px;
    }
    .theme-segment button {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px;
      padding: 9px 6px; border: none; border-radius: 8px;
      background: transparent; color: #cbd5e1;
      cursor: pointer; font: inherit; font-size: 13px; line-height: 1;
      transition: background .15s, color .15s, box-shadow .15s;
    }
    .theme-segment button svg { width: 16px; height: 16px; }
    .theme-segment button:hover { background: rgba(255,255,255,.12); color: #fff; }
    .theme-segment button:focus-visible { outline: 2px solid #7dc3ff; outline-offset: 2px; }
    .theme-segment button.active { background: #fff; color: #001155; font-weight: 700; box-shadow: 0 1px 4px rgba(0,0,0,.3); }

    /* Sfondo scuro quando il menu è aperto */
    #overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.4);
      opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 999;
    }
    #overlay.show { opacity: 1; pointer-events: auto; }

    /* Area contenuto */
    #frame { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>

  <button id="toggle" aria-label="Menu">
    <svg viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
  </button>

  <nav id="sidebar">
    <h2>Strumenti</h2>
    <a href="#lollotool" data-src="LolloTool%20V3.11.html">
      <svg viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
      LolloTool
    </a>
    <a href="#turni" data-src="Turni%20Swisscom.html">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      Turni Swisscom
    </a>
    <a href="#datasales" data-src="DataSales.html">
      <svg viewBox="0 0 24 24"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>
      DataSales
    </a>
    <a href="#agenti" data-src="agenti.html">
      <svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M12 8V4H8"/><path d="M2 14h1M21 14h1M9 13v2M15 13v2"/></svg>
      Agenti AI
    </a>
    <div id="theme-box">
      <p class="theme-label">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        Aspetto
      </p>
      <div class="theme-segment" role="group" aria-label="Scelta tema">
        <button id="theme-light" type="button" aria-pressed="true">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <span>Chiaro</span>
        </button>
        <button id="theme-dark" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>
          <span>Scuro</span>
        </button>
      </div>
    </div>
  </nav>

  <div id="overlay"></div>

  <iframe id="frame" title="Contenuto"></iframe>

  <script>
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    const frame   = document.getElementById('frame');
    const links   = [...sidebar.querySelectorAll('a')];

    function setMenu(open) {
      sidebar.classList.toggle('open', open);
      overlay.classList.toggle('show', open);
    }

    document.getElementById('toggle').onclick = () =>
      setMenu(!sidebar.classList.contains('open'));
    overlay.onclick = () => setMenu(false);

    function loadPage(hash) {
      const link = links.find(a => a.getAttribute('href') === hash) || links[0];
      if (frame.getAttribute('src') !== link.dataset.src) frame.src = link.dataset.src;
      links.forEach(a => a.classList.toggle('active', a === link));
      document.title = 'MyLolloTool – ' + link.textContent.trim();
    }

    links.forEach(a => a.addEventListener('click', () => setMenu(false)));
    window.addEventListener('hashchange', () => loadPage(location.hash));

    // ===== Tema globale condiviso con tutte le pagine =====
    const THEME_KEY = 'mylollotool-theme';
    const btnLight = document.getElementById('theme-light');
    const btnDark = document.getElementById('theme-dark');
    const getGlobalTheme = () => localStorage.getItem(THEME_KEY) === 'dark' ? 'dark' : 'light';

    function paintThemeButtons(t) {
      const dark = t === 'dark';
      btnLight.classList.toggle('active', !dark);
      btnDark.classList.toggle('active', dark);
      btnLight.setAttribute('aria-pressed', String(!dark));
      btnDark.setAttribute('aria-pressed', String(dark));
    }
    // Allinea anche le chiavi storiche delle singole pagine (apertura diretta)
    function syncLegacyKeys(t) {
      try {
        localStorage.setItem('sct-theme', t);
        localStorage.setItem('turni_tema', t === 'dark' ? 'dark' : 'white');
        localStorage.setItem('theme', t);
      } catch (e) {}
    }
    // Applica subito al DOM dell'iframe (stessa origine): nessun reload richiesto.
    // Copre tutti i meccanismi delle pagine figlie + postMessage per stato interno.
    function paintFrameNow(t) {
      let doc = null;
      try { doc = frame.contentDocument; } catch (e) { doc = null; }
      if (!doc) return false;
      try {
        const dark = t === 'dark';
        if (doc.body) doc.body.classList.toggle('dark', dark);
        if (doc.documentElement) {
          doc.documentElement.classList.toggle('light-theme', !dark);
          // Turni Swisscom usa data-theme="white"|"dark"
          if ('theme' in doc.documentElement.dataset || doc.getElementById('tema')) {
            doc.documentElement.dataset.theme = dark ? 'dark' : 'white';
          }
        }
        return true;
      } catch (e) { return false; }
    }
    function broadcastTheme(t) {
      try { frame.contentWindow?.postMessage({ type: 'mylollotool-theme', theme: t }, '*'); } catch (e) {}
      paintFrameNow(t);
      // Retry: se l'iframe sta ancora caricando, il messaggio può perdersi
      setTimeout(() => {
        try { frame.contentWindow?.postMessage({ type: 'mylollotool-theme', theme: t }, '*'); } catch (e) {}
        paintFrameNow(t);
      }, 120);
    }
    function setGlobalTheme(t, broadcast = true) {
      t = t === 'dark' ? 'dark' : 'light';
      try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
      syncLegacyKeys(t);
      paintThemeButtons(t);
      if (broadcast) broadcastTheme(t);
    }

    btnLight.onclick = () => setGlobalTheme('light');
    btnDark.onclick = () => setGlobalTheme('dark');
    frame.addEventListener('load', () => {
      const t = getGlobalTheme();
      paintThemeButtons(t);
      broadcastTheme(t);
    });
    // Se il tema viene cambiato dentro una pagina figlia, riallinea il menu
    window.addEventListener('message', (e) => {
      if (e?.data?.type === 'mylollotool-theme' && (e.data.theme === 'dark' || e.data.theme === 'light')) {
        setGlobalTheme(e.data.theme, false);
        paintFrameNow(e.data.theme);
      }
    });
    // Backup via storage event (stessa origine, anche da altre schede)
    window.addEventListener('storage', (e) => {
      if (e.key === THEME_KEY && (e.newValue === 'dark' || e.newValue === 'light')) {
        paintThemeButtons(e.newValue);
        broadcastTheme(e.newValue);
      }
    });

    // Apre la pagina indicata nell'URL (es. index.html#turni) oppure la prima
    setGlobalTheme(getGlobalTheme(), false);
    loadPage(location.hash);
  </script>
</body>
</html>
