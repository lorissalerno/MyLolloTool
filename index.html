<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyLolloTool</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: system-ui, sans-serif; overflow: hidden; }

    /* Icone SVG */
    svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2;
          stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

    /* Pulsante menu: professionale, neutro, piatto. 40px fisso a 14,14
       (centro 34px come barre header; safe 66px per fixToggleOverlap()). */
    #toggle {
      position: fixed; top: 14px; left: 14px; z-index: 1001;
      width: 40px; height: 40px; border-radius: 10px; cursor: pointer;
      display: grid; place-items: center;
      color: #F9FAFB;
      background: #1F2937;
      border: 1px solid #111827;
      box-shadow: 0 1px 2px rgba(0,0,0,.28);
      transition: background .15s ease, border-color .15s ease;
    }
    body[data-mtheme="dark"] #toggle {
      color: #EEEEF0;
      background: #1A1A1F;
      border-color: #3A3A44;
    }
    #toggle:hover { background: #374151; border-color: #374151; }
    body[data-mtheme="dark"] #toggle:hover { background: #2A2A32; border-color: #4B4B58; }
    #toggle:active { background: #111827; }
    body[data-mtheme="dark"] #toggle:active { background: #101014; }
    #toggle:focus-visible { outline: 2px solid #2563EB; outline-offset: 2px; }
    body[data-mtheme="dark"] #toggle:focus-visible { outline-color: #60A5FA; }
    /* Hamburger: 3 linee piatte, morph sobrio in X a menu aperto */
    #toggle .tgl-lines { display: grid; gap: 5px; justify-items: center; }
    #toggle .tgl-lines span {
      display: block; width: 18px; height: 2px; border-radius: 2px;
      background: currentColor;
      transition: transform .18s ease-out, opacity .15s ease-out;
    }
    #toggle.is-open .tgl-lines span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    #toggle.is-open .tgl-lines span:nth-child(2) { opacity: 0; }
    #toggle.is-open .tgl-lines span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
    @media (prefers-reduced-motion: reduce) {
      #toggle, #toggle .tgl-lines span { transition-duration: .01ms !important; }
    }

    /* Menu laterale: grigio chiaro in tema chiaro, grigio (più chiaro del dark) in tema scuro */
    #sidebar {
      position: fixed; top: 0; left: 0; height: 100%; width: 250px;
      background: #E5E7EB; color: #1F2937; padding: 70px 0 20px;
      transform: translateX(-100%); transition: transform .25s ease, background .2s ease, color .2s ease;
      z-index: 1000; display: flex; flex-direction: column;
    }
    body[data-mtheme="dark"] #sidebar { background: #26262E; color: #EEEEF0; }
    #sidebar.open { transform: translateX(0); }
    .menu-head { display: flex; align-items: center; justify-content: space-between; padding: 0 12px 10px 20px; }
    .menu-head h2 { font-size: 14px; opacity: .6; text-transform: uppercase; }
    #menu-edit {
      display: grid; place-items: center; width: 30px; height: 30px;
      border: 1px solid transparent; border-radius: 8px; background: transparent;
      color: #4B5563; cursor: pointer;
    }
    body[data-mtheme="dark"] #menu-edit { color: #cbd5e1; }
    #menu-edit svg { width: 16px; height: 16px; }
    #menu-edit:hover { background: rgba(0,0,0,.08); color: #111827; }
    body[data-mtheme="dark"] #menu-edit:hover { background: rgba(255,255,255,.12); color: #fff; }
    #menu-edit[aria-pressed="true"] { background: #1F2937; color: #fff; border-color: #1F2937; }
    body[data-mtheme="dark"] #menu-edit[aria-pressed="true"] { background: #fff; color: #26262E; border-color: #fff; }
    #menu-edit:focus-visible { outline: 2px solid #7dc3ff; outline-offset: 2px; }
    .menu-item { display: flex; align-items: stretch; }
    .menu-item > a {
      flex: 1; display: flex; align-items: center; gap: 12px;
      padding: 14px 20px; color: inherit; text-decoration: none;
      border-left: 4px solid transparent; min-width: 0;
    }
    .menu-item > a:hover { background: rgba(0,0,0,.06); }
    body[data-mtheme="dark"] .menu-item > a:hover { background: rgba(255,255,255,.08); }
    .menu-item > a.active { background: rgba(0,0,0,.1); border-left-color: #2563EB; }
    body[data-mtheme="dark"] .menu-item > a.active { background: rgba(255,255,255,.14); border-left-color: #60A5FA; }
    .menu-item.hidden-item > a { opacity: .45; }
    #sidebar.editing .menu-item > a { cursor: grab; }
    #sidebar.editing { user-select: none; }
    .menu-item.dragging { opacity: .4; }
    .menu-item.drop-before { box-shadow: inset 0 2px 0 #7dc3ff; }
    .menu-item.drop-after { box-shadow: inset 0 -2px 0 #7dc3ff; }
    .menu-ctl { display: flex; align-items: center; gap: 2px; padding-right: 8px; }
    .menu-ctl button {
      display: grid; place-items: center; width: 26px; height: 26px;
      border: none; border-radius: 6px; background: transparent;
      color: #4B5563; cursor: pointer;
    }
    body[data-mtheme="dark"] .menu-ctl button { color: #cbd5e1; }
    .menu-ctl button svg { width: 14px; height: 14px; }
    .menu-ctl button:hover { background: rgba(0,0,0,.1); color: #111827; }
    body[data-mtheme="dark"] .menu-ctl button:hover { background: rgba(255,255,255,.15); color: #fff; }
    .menu-ctl button:focus-visible { outline: 2px solid #7dc3ff; outline-offset: 1px; }
    .menu-ctl button.off { color: #DC2626; }
    body[data-mtheme="dark"] .menu-ctl button.off { color: #f87171; }

    /* Link Novità ancorato al fondo, giusto sopra lingua/tema */
    #sidebar-foot { margin-top: auto; }
    #changelog-box { padding: 6px 16px 8px; border-top: 1px solid rgba(0,0,0,.08); }
    body[data-mtheme="dark"] #changelog-box { border-top-color: rgba(255,255,255,.1); }
    #changelog-link {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 10px; border-radius: 9px;
      color: inherit; text-decoration: none;
      font-size: 12px; opacity: .72;
    }
    #changelog-link:hover { opacity: 1; background: rgba(0,0,0,.06); }
    body[data-mtheme="dark"] #changelog-link:hover { background: rgba(255,255,255,.08); }
    #changelog-link.active { opacity: 1; background: rgba(0,0,0,.1); }
    body[data-mtheme="dark"] #changelog-link.active { background: rgba(255,255,255,.14); }
    #changelog-link svg { width: 14px; height: 14px; }
    #changelog-txt { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #site-version {
      font-size: 11px; font-weight: 700; letter-spacing: .03em;
      padding: 1px 8px; border-radius: 999px;
      background: rgba(0,0,0,.1); color: inherit;
    }
    body[data-mtheme="dark"] #site-version { background: rgba(255,255,255,.15); }

    /* Scelte rapide in fondo al menu: tema + lingua (metodo SCT: un click cambia) */
    #theme-box { padding: 8px 16px 4px; }
    .pref-row { display: flex; gap: 8px; }
    .pref-row button {
      border-radius: 12px; cursor: pointer; font: inherit;
      transition: background .15s, color .15s, box-shadow .15s;
    }
    .pref-row button:focus-visible { outline: 2px solid #7dc3ff; outline-offset: 2px; }
    #theme-toggle {
      flex: 0 0 46px; height: 42px; display: grid; place-items: center;
      background: rgba(0,0,0,.07); border: 1px solid rgba(0,0,0,.09); color: #4B5563;
    }
    body[data-mtheme="dark"] #theme-toggle {
      background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.12); color: #cbd5e1;
    }
    #theme-toggle svg { width: 18px; height: 18px; }
    #theme-toggle:hover { background: rgba(0,0,0,.12); color: #111827; }
    body[data-mtheme="dark"] #theme-toggle:hover { background: rgba(255,255,255,.16); color: #fff; }
    #lang-btn {
      flex: 1; height: 42px; display: flex; align-items: center; justify-content: center; gap: 7px;
      background: rgba(0,0,0,.07); border: 1px solid rgba(0,0,0,.09); color: #1F2937;
      font-size: 14px; font-weight: 700; letter-spacing: .06em;
    }
    body[data-mtheme="dark"] #lang-btn {
      background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.12); color: #EEEEF0;
    }
    #lang-btn svg { width: 16px; height: 16px; }
    #lang-btn:hover { background: rgba(0,0,0,.12); }
    body[data-mtheme="dark"] #lang-btn:hover { background: rgba(255,255,255,.16); }

    /* Logo Swisscom in alto a destra della sidebar, stessa altezza del pulsante menu (40px a 14px) */
    #sidebar-logo {
      position: absolute; top: 14px; right: 14px;
      width: 40px; height: 40px; border-radius: 50%; object-fit: cover;
      box-shadow: 0 2px 6px rgba(0,0,0,.3);
    }

    /* Sfondo scuro quando il menu è aperto */
    #overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.4);
      opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 999;
    }
    #overlay.show { opacity: 1; pointer-events: auto; }

    /* Area contenuto */
    #frame { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body data-mtheme="light">

  <button id="toggle" aria-label="Menu" aria-expanded="false" aria-controls="sidebar">
    <span class="tgl-lines" aria-hidden="true"><span></span><span></span><span></span></span>
  </button>

  <nav id="sidebar">
    <img id="sidebar-logo" src="https://avatars.githubusercontent.com/u/5754111?s=280&v=4" alt="Swisscom">
    <div class="menu-head">
      <h2>Strumenti</h2>
      <button id="menu-edit" type="button" aria-pressed="false" title="Modifica menu: sposta o nascondi le voci">
        <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      </button>
    </div>
    <div id="menu-links"></div>
    <div id="sidebar-foot">
    <div id="changelog-box">
      <a id="changelog-link" href="#novita" data-src="novita.html"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span id="changelog-txt">Novità</span><span id="site-version">v1.01</span></a>
    </div>
    <div id="theme-box">
      <div class="pref-row" role="group" id="pref-group">
        <button id="theme-toggle" type="button">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button id="lang-btn" type="button">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          <span id="lang-txt">IT</span>
        </button>
      </div>
    </div>
    </div>
  </nav>

  <div id="overlay"></div>

  <iframe id="frame" title="Contenuto"></iframe>

  <script>
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    const frame   = document.getElementById('frame');
    const toggleBtn = document.getElementById('toggle');
    function setMenu(open) {
      sidebar.classList.toggle('open', open);
      overlay.classList.toggle('show', open);
      toggleBtn.classList.toggle('is-open', open);
      toggleBtn.setAttribute('aria-expanded', String(open));
    }

    toggleBtn.onclick = () =>
      setMenu(!sidebar.classList.contains('open'));
    overlay.onclick = () => setMenu(false);

    // ===== Menu laterale: ordine e visibilità personalizzabili =====
    const MENU_KEY = 'mylollotool-menu';    const DEFAULT_MENU = [
      { id: 'lollotool', label: 'SCT Tool', src: 'SCT%20Tool.html',
        icon: '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>' },
      { id: 'turni', label: 'Turni Swisscom', src: 'Turni%20Swisscom.html',
        i18n: { de: 'Schichten Swisscom', fr: 'Gardes Swisscom', en: 'Shifts Swisscom' },
        icon: '<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>' },
      { id: 'datasales', label: 'Vendite', src: 'DataSales.html',
        i18n: { de: 'Verkäufe', fr: 'Ventes', en: 'Sales' },
        icon: '<line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/>' },
      { id: 'agenti', label: 'Agenti AI', src: 'agenti.html',
        i18n: { de: 'KI-Agenten', fr: 'Agents IA', en: 'AI agents' },
        icon: '<rect x="3" y="8" width="18" height="12" rx="2"/><path d="M12 8V4H8"/><path d="M2 14h1M21 14h1M9 13v2M15 13v2"/>' },
    ];
    const MENU_ICONS = {
      eye: '<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>',
      eyeOff: '<svg viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M9.88 9.88a3 3 0 1 0 4.24 4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>',
      check: '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>',
      pencil: '<svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
    };
    function loadMenuState() {
      let saved = null;
      try { saved = JSON.parse(localStorage.getItem(MENU_KEY)); } catch (e) { saved = null; }
      const state = DEFAULT_MENU.map(d => ({ id: d.id, hidden: false }));
      if (Array.isArray(saved)) {
        const byId = new Map(state.map(s => [s.id, s]));
        const ordered = [];
        saved.forEach(s => {
          if (s && byId.has(s.id)) { byId.get(s.id).hidden = s.hidden === true; ordered.push(byId.get(s.id)); byId.delete(s.id); }
        });
        byId.forEach(s => ordered.push(s)); // nuove voci in coda
        return ordered;
      }
      return state;
    }
    let menuState = loadMenuState();
    let menuEditing = false;
    let links = [];
    const menuLinks = document.getElementById('menu-links');
    const menuEditBtn = document.getElementById('menu-edit');
    // Versione sito: +0.01 solo una volta al giorno con modifica funzionale (vedi AGENTS.md + novita.html).
    const SITE_VERSION = '1.01';
    const changelogLink = document.getElementById('changelog-link');
    const changelogTxt = document.getElementById('changelog-txt');
    const siteVersionEl = document.getElementById('site-version');
    siteVersionEl.textContent = 'v' + SITE_VERSION;

    // ===== Lingua globale condivisa con tutte le pagine (metodo SCT: click per cambiare) =====
    const LANG_KEY = 'mylollotool-lang';
    const LANGS = ['it', 'de', 'fr', 'en'];
    const LANG_LABELS = { it: 'IT', de: 'DE', fr: 'FR', en: 'EN' };
    const MENU_T = {
      news:     { it: 'Novità', de: 'Neuigkeiten', fr: 'Nouveautés', en: "What's new" },
      newsTitle:{ it: 'Storico modifiche funzionali', de: 'Verlauf funktionaler Änderungen', fr: 'Historique des changements', en: 'Functional changelog' },
      tools:    { it: 'Strumenti', de: 'Werkzeuge', fr: 'Outils', en: 'Tools' },
      editMenu: { it: 'Modifica menu: sposta o nascondi le voci', de: 'Menü bearbeiten: Einträge verschieben oder ein-/ausblenden', fr: 'Modifier le menu : déplacer ou afficher/masquer les entrées', en: 'Edit menu: reorder or show/hide entries' },
      editDone: { it: 'Fine modifica menu', de: 'Bearbeitung beenden', fr: 'Terminer la modification', en: 'Done editing' },
      show:     { it: 'Mostra', de: 'Einblenden', fr: 'Afficher', en: 'Show' },
      hide:     { it: 'Nascondi', de: 'Ausblenden', fr: 'Masquer', en: 'Hide' },
      drag:     { it: 'Trascina per spostare', de: 'Zum Verschieben ziehen', fr: 'Glisser pour déplacer', en: 'Drag to reorder' },
      group:    { it: 'Tema e lingua', de: 'Design und Sprache', fr: 'Thème et langue', en: 'Theme and language' },
      frame:    { it: 'Contenuto', de: 'Inhalt', fr: 'Contenu', en: 'Content' },
      theme:    { it: 'Cambia tema', de: 'Thema wechseln', fr: 'Changer de thème', en: 'Toggle theme' },
      lang:     { it: 'Cambia lingua', de: 'Sprache wechseln', fr: 'Changer de langue', en: 'Change language' },
    };
    let curLang = 'it';
    function mt(key) {
      const e = MENU_T[key];
      if (!e) return key;
      return e[curLang] || e.it;
    }
    function menuLabel(d) {
      return (d.i18n && d.i18n[curLang]) || d.label;
    }
    const getGlobalLang = () => {
      const l = localStorage.getItem(LANG_KEY);
      if (LANGS.includes(l)) return l;
      const legacy = localStorage.getItem('sct-lang');
      return LANGS.includes(legacy) ? legacy : 'it';
    };
    const langBtn = document.getElementById('lang-btn');
    const langTxt = document.getElementById('lang-txt');
    function paintMenuEdit() {
      menuEditBtn.title = menuEditing ? mt('editDone') : mt('editMenu');
    }
    function paintLang(l) {
      curLang = LANGS.includes(l) ? l : 'it';
      document.documentElement.lang = curLang;
      langTxt.textContent = LANG_LABELS[curLang];
      langBtn.title = mt('lang');
      frame.title = mt('frame');
      document.getElementById('pref-group').setAttribute('aria-label', mt('group'));
      sidebar.querySelector('.menu-head h2').textContent = mt('tools');
      changelogTxt.textContent = mt('news');
      changelogLink.title = mt('newsTitle');
      paintMenuEdit();
      themeToggle.title = mt('theme');
      renderMenu();
      loadPage(location.hash); // aggiorna titolo documento con etichetta tradotta
    }
    function broadcastLang(l) {
      try { frame.contentWindow.postMessage({ type: LANG_KEY, lang: l }, '*'); } catch (e) {}
    }
    function setGlobalLang(l, broadcast = true) {
      l = LANGS.includes(l) ? l : 'it';
      try {
        localStorage.setItem(LANG_KEY, l);
        localStorage.setItem('sct-lang', l); // legacy SCT Tool
      } catch (e) {}
      paintLang(l);
      if (broadcast) broadcastLang(l);
    }

    function saveMenuState() {
      try { localStorage.setItem(MENU_KEY, JSON.stringify(menuState)); } catch (e) {}
    }
    function renderMenu() {
      const meta = new Map(DEFAULT_MENU.map(d => [d.id, d]));
      menuLinks.innerHTML = menuState.map((s) => {
        const d = meta.get(s.id);
        if (!d) return '';
        const label = menuLabel(d);
        const toggle = s.hidden ? mt('show') : mt('hide');
        const ctl = menuEditing ? `
          <span class="menu-ctl">
            <button type="button" data-act="eye" data-id="${d.id}" class="${s.hidden ? 'off' : ''}" title="${toggle}" aria-label="${toggle} ${label}" aria-pressed="${s.hidden ? 'false' : 'true'}">${s.hidden ? MENU_ICONS.eyeOff : MENU_ICONS.eye}</button>
          </span>` : '';
        return `
          <div class="menu-item${s.hidden ? ' hidden-item' : ''}"${menuEditing ? ` draggable="true" data-id="${d.id}" title="${mt('drag')}"` : ''}>
            <a href="#${d.id}" data-src="${d.src}"${menuEditing ? ' draggable="false"' : ''}><svg viewBox="0 0 24 24">${d.icon}</svg><span>${label}</span></a>
            ${ctl}
          </div>`;
      }).join('');
      links = [...menuLinks.querySelectorAll('a')];
    }
    function visibleLinks() {
      const hidden = new Set(menuState.filter(s => s.hidden).map(s => s.id));
      const vis = links.filter(a => !hidden.has(a.getAttribute('href').slice(1)));
      return vis.length ? vis : links;
    }

    menuEditBtn.onclick = () => {
      menuEditing = !menuEditing;
      menuEditBtn.setAttribute('aria-pressed', String(menuEditing));
      menuEditBtn.innerHTML = menuEditing ? MENU_ICONS.check : MENU_ICONS.pencil;
      paintMenuEdit();
      sidebar.classList.toggle('editing', menuEditing);
      renderMenu();
      loadPage(location.hash);
    };
    menuLinks.addEventListener('click', (e) => {
      const btn = e.target.closest('.menu-ctl button');
      if (btn) {
        e.preventDefault();
        const i = menuState.findIndex(s => s.id === btn.dataset.id);
        if (i < 0) return;
        menuState[i].hidden = !menuState[i].hidden;
        saveMenuState();
        renderMenu();
        loadPage(location.hash);
        return;
      }
      if (e.target.closest('a')) setMenu(false);
    });
    changelogLink.addEventListener('click', () => setMenu(false));

    // Riordino con trascinamento del mouse (solo in modalità modifica)
    let dragId = null;
    function menuItemFromEvent(e) {
      const t = e.target && e.target.closest ? e.target.closest('.menu-item') : null;
      return (t && menuLinks.contains(t)) ? t : null;
    }
    function clearDropMarks() {
      menuLinks.querySelectorAll('.drop-before, .drop-after')
        .forEach(el => el.classList.remove('drop-before', 'drop-after'));
    }
    menuLinks.addEventListener('dragstart', (e) => {
      if (!menuEditing) { e.preventDefault(); return; }
      const item = menuItemFromEvent(e);
      if (!item) { e.preventDefault(); return; }
      dragId = item.dataset.id;
      try { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId); } catch (err) {}
      setTimeout(() => item.classList.add('dragging'), 0);
    });
    menuLinks.addEventListener('dragover', (e) => {
      if (!menuEditing || !dragId) return;
      const item = menuItemFromEvent(e);
      if (!item || item.dataset.id === dragId) return;
      e.preventDefault();
      try { e.dataTransfer.dropEffect = 'move'; } catch (err) {}
      const r = item.getBoundingClientRect();
      const after = (e.clientY - r.top) > r.height / 2;
      clearDropMarks();
      item.classList.add(after ? 'drop-after' : 'drop-before');
    });
    menuLinks.addEventListener('dragleave', (e) => {
      const item = menuItemFromEvent(e);
      if (item) item.classList.remove('drop-before', 'drop-after');
    });
    menuLinks.addEventListener('drop', (e) => {
      if (!menuEditing || !dragId) return;
      const item = menuItemFromEvent(e);
      e.preventDefault();
      clearDropMarks();
      const from = menuState.findIndex(s => s.id === dragId);
      if (from < 0) { dragId = null; return; }
      const [moved] = menuState.splice(from, 1);
      if (item && item.dataset.id !== dragId) {
        const r = item.getBoundingClientRect();
        const after = (e.clientY - r.top) > r.height / 2;
        let idx = menuState.findIndex(s => s.id === item.dataset.id);
        if (idx < 0) idx = menuState.length;
        menuState.splice(after ? idx + 1 : idx, 0, moved);
      } else {
        menuState.push(moved); // rilasciato sullo spazio vuoto: in fondo
      }
      dragId = null;
      saveMenuState();
      renderMenu();
      loadPage(location.hash);
    });
    menuLinks.addEventListener('dragend', () => {
      dragId = null;
      clearDropMarks();
      menuLinks.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging'));
    });

    function loadPage(hash) {
      if (hash === '#novita') {
        if (frame.getAttribute('src') !== changelogLink.dataset.src) frame.src = changelogLink.dataset.src;
        links.forEach(a => a.classList.remove('active'));
        changelogLink.classList.add('active');
        document.title = 'MyLolloTool – ' + changelogTxt.textContent.trim();
        return;
      }
      const vis = visibleLinks();
      const link = vis.find(a => a.getAttribute('href') === hash) || vis[0];
      if (!link) return;
      if (frame.getAttribute('src') !== link.dataset.src) frame.src = link.dataset.src;
      links.forEach(a => a.classList.toggle('active', a === link));
      changelogLink.classList.remove('active');
      document.title = 'MyLolloTool – ' + link.textContent.trim();
    }

    window.addEventListener('hashchange', () => loadPage(location.hash));

    // ===== Tema globale condiviso con tutte le pagine (metodo SCT: un click cambia) =====
    const THEME_KEY = 'mylollotool-theme';
    const THEME_ICONS = {
      sun: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
      moon: '<svg viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>',
    };
    const themeToggle = document.getElementById('theme-toggle');
    const getGlobalTheme = () => localStorage.getItem(THEME_KEY) === 'dark' ? 'dark' : 'light';

    function paintThemeToggle(t) {
      const dark = t === 'dark';
      themeToggle.innerHTML = dark ? THEME_ICONS.moon : THEME_ICONS.sun;
      themeToggle.setAttribute('aria-pressed', String(dark));
      themeToggle.title = mt('theme');
    }
    // Allinea anche le chiavi storiche delle singole pagine (apertura diretta)
    function syncLegacyKeys(t) {
      try {
        localStorage.setItem('sct-theme', t);
        localStorage.setItem('turni_tema', t === 'dark' ? 'dark' : 'white');
        localStorage.setItem('theme', t);
      } catch (e) {}
    }
    // Applica subito al DOM dell'iframe (stessa origine): nessun reload richiesto.
    // Copre tutti i meccanismi delle pagine figlie + postMessage per stato interno.
    function paintFrameNow(t) {
      let doc = null;
      try { doc = frame.contentDocument; } catch (e) { doc = null; }
      if (!doc) return false;
      try {
        const dark = t === 'dark';
        if (doc.body) doc.body.classList.toggle('dark', dark);
        if (doc.documentElement) {
          doc.documentElement.classList.toggle('light-theme', !dark);
          // Turni Swisscom usa data-theme="white"|"dark"
          if ('theme' in doc.documentElement.dataset || doc.getElementById('tema')) {
            doc.documentElement.dataset.theme = dark ? 'dark' : 'white';
          }
        }
        return true;
      } catch (e) { return false; }
    }
    // Il pulsante menu (#toggle 40px a 14,14) può coprire il logo in alto a sinistra
    // delle pagine figlie: se li tocca, sposta il contenitore più a destra.
    // Usa la posizione originale (rect - margine già applicato) per non flappare.
    function fixToggleOverlap() {
      let doc = null;
      try { doc = frame.contentDocument; } catch (e) { return; }
      if (!doc || !doc.querySelectorAll) return;
      const SAFE_RIGHT = 14 + 40 + 12; // 66px
      const SAFE_BOTTOM = 14 + 40 + 12;
      const sels = ['.app-header', '.header-row', 'header.top', 'header', '.brand', '.app-logo', 'h1'];
      const seen = new Set();
      // Contenuti interni: se uno di questi è già fuori dal pulsante, il contenitore non va spostato
      const INNER = ['.app-logo', '.brand', 'h1'];
      const restore = (el, cur) => {
        if (el.dataset.mltSafe !== undefined && cur > 0) {
          el.style.marginLeft = el.dataset.mltSafe;
          el.style.width = '';
        }
      };
      sels.forEach((sel) => {
        let list = [];
        try { list = doc.querySelectorAll(sel); } catch (e) { list = []; }
        list.forEach((el) => {
          if (seen.has(el) || !el.getBoundingClientRect) return;
          seen.add(el);
          let r = null;
          try { r = el.getBoundingClientRect(); } catch (e) { return; }
          if (!r || r.width === 0) return;
          const cur = parseFloat(el.style.marginLeft) || 0;
          // Se un contenuto interno è già fuori dal pulsante, non spostare il contenitore
          // (evita di spingere header larghi fuori centro o fuori schermo)
          let innerClear = false;
          try {
            for (const s of INNER) {
              const inn = el.querySelectorAll ? el.querySelectorAll(s) : [];
              for (const n of inn) {
                if (seen.has(n) || !n.getBoundingClientRect) continue;
                const rb = n.getBoundingClientRect();
                if (rb && rb.width > 0 && rb.top < SAFE_BOTTOM && rb.left >= SAFE_RIGHT) { innerClear = true; break; }
              }
              if (innerClear) break;
            }
          } catch (e) {}
          if (innerClear) { restore(el, cur); return; }
          const origLeft = r.left - cur;
          if (r.top < 90 && origLeft < 90 && origLeft < SAFE_RIGHT && r.top < SAFE_BOTTOM) {
            if (el.dataset.mltSafe === undefined) el.dataset.mltSafe = '';
            const shift = Math.ceil(SAFE_RIGHT - origLeft);
            if (shift > 0) {
              el.style.marginLeft = shift + 'px';
              // width:100% + marginLeft traboccherebbe a destra: riempi lo spazio restante
              el.style.width = 'auto';
            }
          } else {
            restore(el, cur);
          }
        });
      });
    }
    let _mltT = null;
    function scheduleOverlapFix() {
      clearTimeout(_mltT);
      _mltT = setTimeout(fixToggleOverlap, 150);
    }
    window.addEventListener('resize', scheduleOverlapFix);

    function broadcastTheme(t) {
      try { frame.contentWindow?.postMessage({ type: 'mylollotool-theme', theme: t }, '*'); } catch (e) {}
      paintFrameNow(t);
      scheduleOverlapFix();
      // Retry: se l'iframe sta ancora caricando, il messaggio può perdersi
      setTimeout(() => {
        try { frame.contentWindow?.postMessage({ type: 'mylollotool-theme', theme: t }, '*'); } catch (e) {}
        paintFrameNow(t);
        fixToggleOverlap();
      }, 120);
    }
    // La sidebar segue il tema: grigia chiara / grigia scura (non blu)
    function paintMenuTheme(t) {
      document.body.dataset.mtheme = t === 'dark' ? 'dark' : 'light';
    }
    function setGlobalTheme(t, broadcast = true) {
      t = t === 'dark' ? 'dark' : 'light';
      try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
      syncLegacyKeys(t);
      paintThemeToggle(t);
      paintMenuTheme(t);
      if (broadcast) broadcastTheme(t);
    }

    // Click singolo stile SCT: tema e lingua cambiano a ogni click
    themeToggle.onclick = () =>
      setGlobalTheme(getGlobalTheme() === 'dark' ? 'light' : 'dark');
    langBtn.onclick = () => {
      const i = LANGS.indexOf(curLang);
      setGlobalLang(LANGS[(i + 1) % LANGS.length]);
    };
    frame.addEventListener('load', () => {
      const t = getGlobalTheme();
      paintThemeToggle(t);
      broadcastTheme(t);
      broadcastLang(curLang);
      setTimeout(fixToggleOverlap, 400);
    });
    // Se il tema viene cambiato dentro una pagina figlia, riallinea il menu
    window.addEventListener('message', (e) => {
      if (e?.data?.type === 'mylollotool-theme' && (e.data.theme === 'dark' || e.data.theme === 'light')) {
        setGlobalTheme(e.data.theme, false);
        paintFrameNow(e.data.theme);
      }
    });
    // Backup via storage event (stessa origine, anche da altre schede)
    window.addEventListener('storage', (e) => {
      if (e.key === THEME_KEY && (e.newValue === 'dark' || e.newValue === 'light')) {
        paintThemeToggle(e.newValue);
        paintMenuTheme(e.newValue);
        broadcastTheme(e.newValue);
      }
      if (e.key === LANG_KEY && LANGS.includes(e.newValue)) {
        paintLang(e.newValue);
        broadcastLang(e.newValue);
      }
    });

    // Apre la pagina indicata nell'URL (es. index.html#turni) oppure la prima
    setGlobalLang(getGlobalLang(), false);
    setGlobalTheme(getGlobalTheme(), false);
    loadPage(location.hash);
  </script>
</body>
</html>
