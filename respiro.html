<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Respiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root { --bg:#000000; --ink:#e8eef7; --soft:rgba(232,238,247,.62); --line:rgba(232,238,247,.22); }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; background:var(--bg); overflow:hidden; transition:background 2s; }
  body { font-family:"Cormorant Garamond", Georgia, "Times New Roman", serif; color:var(--ink); -webkit-user-select:none; user-select:none; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; cursor:crosshair; touch-action:none; }

  #hint { position:fixed; inset:0; display:grid; place-items:center; text-align:center; padding:2rem; pointer-events:none; transition:opacity 2.5s ease; }
  #hint p { font-size:clamp(1.6rem, 4.6vw, 2.8rem); font-style:italic; line-height:1.35; max-width:22ch; text-shadow:0 0 30px rgba(0,0,0,.35); }
  #hint.gone { opacity:0; }

  #breath { position:fixed; left:50%; bottom:calc(6.5rem + env(safe-area-inset-bottom, 0px)); width:150px; height:150px; margin-left:-75px; display:grid; place-items:center; pointer-events:none; opacity:0; transition:opacity 1.2s; }
  #breath.on { opacity:1; }
  #breath i { position:absolute; inset:0; border-radius:50%; border:1px solid var(--line); background:radial-gradient(circle, rgba(232,238,247,.16), rgba(232,238,247,.02) 70%); transform:scale(.55); will-change:transform; }
  #breath span { position:relative; font-size:1.35rem; font-style:italic; }


  #panel { position:fixed; top:12px; right:12px; width:270px; max-height:calc(100% - 24px); overflow:auto; box-sizing:border-box; background:rgba(10,10,14,.72); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.14); border-radius:14px; padding:12px 14px; user-select:none; z-index:10; }
  #panel h1 { font-size:17px; margin:0; display:flex; justify-content:space-between; align-items:center; font-style:italic; font-weight:500; }
  #toggle { all:unset; cursor:pointer; font-size:20px; padding:0 6px; line-height:1; }
  #pbody { margin-top:8px; }
  #pbody.hidden { display:none; }
  #panel .sep { margin:12px 0 4px; color:rgba(232,238,247,.5); font-size:11px; text-transform:uppercase; letter-spacing:.08em; font-style:normal; font-family:system-ui, sans-serif; }
  #panel .row { margin:9px 0; font-style:normal; font-family:system-ui, sans-serif; font-size:12px; }
  #panel .row label { display:flex; justify-content:space-between; opacity:.88; margin-bottom:2px; }
  #panel input[type=range] { width:100%; accent-color:#8fd3c1; margin:2px 0; }
  #panel select { width:100%; background:#0a0a10; color:#e8eef7; border:1px solid rgba(255,255,255,.22); border-radius:6px; padding:5px; font:inherit; }
  #panel .chk { display:flex; align-items:center; gap:8px; margin:8px 0; cursor:pointer; font-style:normal; font-family:system-ui, sans-serif; font-size:12px; }
  #panel .btns { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:10px; }
  #panel .btns button { background:rgba(255,255,255,.14); color:#e8eef7; border:1px solid rgba(255,255,255,.14); border-radius:8px; padding:8px 4px; font-family:system-ui, sans-serif; font-size:12px; cursor:pointer; }
  #panel .btns button:hover { background:rgba(255,255,255,.24); }
  #panel .btns button.wide { grid-column:1 / span 2; }
  #pnote { margin-top:8px; opacity:.55; font-size:11px; text-align:center; font-style:normal; font-family:system-ui, sans-serif; }
  #showPanel { position:fixed; top:12px; right:12px; width:40px; height:40px; border-radius:50%; border:1px solid rgba(255,255,255,.25); background:rgba(10,10,14,.72); color:#e8eef7; font-size:18px; line-height:1; cursor:pointer; display:none; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); z-index:10; user-select:none; }
  #showPanel:hover { background:rgba(255,255,255,.2); }
  #toast { position:fixed; top:calc(1.2rem + env(safe-area-inset-top, 0px)); left:50%; transform:translateX(-50%); font-style:italic; font-size:1.2rem; color:var(--soft); opacity:0; transition:opacity .8s; pointer-events:none; }
  #toast.show { opacity:1; }
</style>
</head>
<body>
<canvas id="c" aria-label="Tela artistica interattiva: muovi il dito o il mouse per disegnare con il colore"></canvas>

<div id="hint"><p>Muovi il dito sullo schermo.<br>Non serve fare niente.</p></div>
<div id="breath" aria-live="polite"><i></i><span>Inspira</span></div>
<div id="toast"></div>

<div id="panel">
  <h1><span data-tk="title">Respiro</span><button id="toggle" title="Riduci/espandi">&minus;</button></h1>
  <div id="pbody"></div>
</div>
<button id="showPanel" title="Mostra pannello">&#9881;</button>

<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const root = document.documentElement;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const SP = reduce ? 0.45 : 1;

  const pal = [
    { tk:'laguna',    bg:'#000000', cols:['#8fd3c1','#b8a9d9','#f3c58b','#7fb2e5'] },
    { tk:'aurora',    bg:'#000000', cols:['#a8e6a1','#5fd0c8','#c7a6f2','#f5e6a1'] },
    { tk:'tramonto',  bg:'#000000', cols:['#f2a38c','#f7c6a0','#d78fc2','#8e9be0'] },
    { tk:'inchiostro',bg:'#000000', cols:['#e8eef7','#9fb4d0','#6f87aa','#c9d6e8'] }
  ];
  const hex = h => [1,3,5].map(i => parseInt(h.slice(i, i+2), 16));

  /* ---------- impostazioni persistenti (come le altre pagine antistress) ---------- */
  const SOUND_TYPES = ['drone', 'sea', 'rain', 'wind'];
  const DEFAULTS = {
    brightness:.7, thick:1.6, trail:.025, speed:1, density:1,
    hoverR:170, repelR:260, repelF:7,
    palette:0, sound:false, soundType:'drone', volume:70, breath:false,
    collapsed:false, panelHidden:false
  };
  const STORE_KEY = 'respiro.impostazioni.v1';
  const SLIDERS = [
    { sep:'secStrokes' },
    { key:'brightness', tk:'brightness', min:.1, max:1,   step:.05, dec:2 },
    { key:'thick',      tk:'thick',      min:.5, max:4,   step:.1,  dec:1 },
    { key:'trail',      tk:'trail',      min:.005, max:.25, step:.005, dec:3 },
    { key:'speed',      tk:'speed',      min:.2, max:2.5, step:.1,  dec:1 },
    { key:'density',    tk:'density',    min:.3, max:1.6, step:.1,  dec:1 },
    { sep:'secMouse' },
    { key:'hoverR',     tk:'hoverR',     min:60, max:350, step:10,  dec:0 },
    { key:'repelR',     tk:'repelR',     min:80, max:500, step:10,  dec:0 },
    { key:'repelF',     tk:'repelF',     min:1,  max:14,  step:.5,  dec:1 }
  ];
  function loadSettings() {
    const s = { ...DEFAULTS };
    try {
      const o = JSON.parse(localStorage.getItem(STORE_KEY));
      for (const k in DEFAULTS) {
        if (o && k in o && typeof o[k] === typeof DEFAULTS[k]) {
          if (typeof o[k] === 'number' && !isFinite(o[k])) continue;
          s[k] = o[k];
        }
      }
    } catch (e) {}
    SLIDERS.forEach(d => { s[d.key] = Math.min(d.max, Math.max(d.min, s[d.key])); });
    s.palette = (s.palette | 0) % pal.length; if (s.palette < 0) s.palette = 0;
    if (!SOUND_TYPES.includes(s.soundType)) s.soundType = 'drone';
    s.volume = Math.min(100, Math.max(0, s.volume | 0));
    return s;
  }
  function saveSettings() { try { localStorage.setItem(STORE_KEY, JSON.stringify(cfg)); } catch (e) {} }
  const cfg = loadSettings();
  let pi = cfg.palette, bg = hex(pal[pi].bg), cols = pal[pi].cols.map(hex);
  let palSel = null, breathChk = null, soundChk = null;
  function syncPalSel() { if (palSel) palSel.value = String(cfg.palette); }

  let W, H, dpr, ps = [];
  const ptr = { x:0, y:0, on:false, down:false };

  function fillBg() {
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = pal[pi].bg;
    ctx.fillRect(0, 0, W, H);
  }
  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    fillBg();
    const n = Math.min(1400, Math.floor(W * H / 1700 * cfg.density));
    ps = Array.from({ length:n }, () => spawn({}));
  }
  function spawn(p, x, y) {
    p.x = x ?? Math.random() * W; p.y = y ?? Math.random() * H;
    p.px = p.x; p.py = p.y;
    p.life = 220 + Math.random() * 420;
    p.ci = Math.random() * 4 | 0;
    p.s = .6 + Math.random() * .7;
    return p;
  }
  function setPal(i, silent) {
    pi = ((i % pal.length) + pal.length) % pal.length;
    cfg.palette = pi; saveSettings(); syncPalSel();
    bg = hex(pal[pi].bg); cols = pal[pi].cols.map(hex);
    root.style.setProperty('--bg', pal[pi].bg);
    if (!silent) toast(tr(pal[pi].tk));
  }

  /* ---------- puntatore (raggi e forze dal pannello impostazioni) ---------- */
  function move(e) {
    ptr.x = e.clientX; ptr.y = e.clientY; ptr.on = true;
    for (let i = 0; i < 3; i++) {
      const p = ps[Math.random() * ps.length | 0];
      spawn(p, ptr.x + (Math.random() - .5) * 60, ptr.y + (Math.random() - .5) * 60);
    }
    dismissHint();
  }
  cv.addEventListener('pointermove', move);
  cv.addEventListener('pointerdown', e => {
    ptr.down = true;
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    move(e);
    if (soundOn && !ac) startAudio();
    bell();
  });
  const off = e => { ptr.down = false; if (e.pointerType !== 'mouse') ptr.on = false; };
  cv.addEventListener('pointerup', off);
  cv.addEventListener('pointercancel', off);
  cv.addEventListener('pointerleave', () => { ptr.down = false; ptr.on = false; });

  /* ---------- ciclo di disegno ---------- */
  let last = performance.now(), t = 0;
  function frame(now) {
    const dt = Math.min(50, now - last); last = now;
    t += dt * 0.00006 * SP * cfg.speed;

    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = `rgba(${bg},${cfg.trail})`;
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = 'source-over';
    ctx.lineWidth = cfg.thick; ctx.lineCap = 'round';

    if (ptr.down && ptr.on) {
      for (let i = 0; i < 4; i++) {
        const p = ps[Math.random() * ps.length | 0];
        spawn(p, ptr.x + (Math.random() - .5) * 70, ptr.y + (Math.random() - .5) * 70);
      }
    }

    for (const p of ps) {
      const a = (Math.sin(p.x * .0035 + t * 7) + Math.sin(p.y * .0042 - t * 5) + Math.sin((p.x - p.y) * .0028 + t * 3)) * 1.7;
      let vx = Math.cos(a), vy = Math.sin(a);
      if (ptr.on) {
        const dx = p.x - ptr.x, dy = p.y - ptr.y, d = Math.hypot(dx, dy) + .001;
        if (ptr.down) {
          if (d < cfg.repelR) {
            const f = 1 - d / cfg.repelR, ff = f * f;
            vx += (dx / d) * ff * cfg.repelF;
            vy += (dy / d) * ff * cfg.repelF;
          }
        } else if (d < cfg.hoverR) {
          const f = 1 - d / cfg.hoverR;
          vx += (-dy / d) * f * 2.4 + (dx / d) * f * .6;
          vy += ( dx / d) * f * 2.4 + (dy / d) * f * .6;
        }
      }
      p.px = p.x; p.py = p.y;
      const vv = SP * cfg.speed;
      p.x += vx * p.s * 1.1 * vv; p.y += vy * p.s * 1.1 * vv;
      p.life--;
      if (p.life <= 0 || p.x < -20 || p.x > W + 20 || p.y < -20 || p.y > H + 20) { spawn(p); continue; }
      ctx.strokeStyle = `rgba(${cols[p.ci % cols.length]},${cfg.brightness})`;
      ctx.beginPath(); ctx.moveTo(p.px, p.py); ctx.lineTo(p.x, p.y); ctx.stroke();
    }

    breathe(now);
    requestAnimationFrame(frame);
  }

  /* ---------- respirazione 4 - 4 - 6 ---------- */
  const bEl = document.getElementById('breath'), bCircle = bEl.querySelector('i'), bText = bEl.querySelector('span');
  let breathOn = false, bStart = 0, lastPhaseKey = '';
  const ease = x => .5 - Math.cos(Math.PI * x) / 2;
  function breathe(now) {
    if (!breathOn) return;
    const s = ((now - bStart) / 1000) % 14;
    let scale, key;
    if (s < 4)      { scale = .55 + .45 * ease(s / 4);        key = 'in'; }
    else if (s < 8) { scale = 1;                              key = 'hold'; }
    else            { scale = 1 - .45 * ease((s - 8) / 6);    key = 'out'; }
    bCircle.style.transform = `scale(${scale})`;
    if (key !== lastPhaseKey) { bText.textContent = tr(key); lastPhaseKey = key; }
  }

  /* ---------- suono (generato, nessun file esterno) ---------- */
  let ac, master, soundOn = false, audioGen = 0;
  let ambNodes = [];
  let noiseBuf = null;
  const volGain = () => (cfg.volume | 0) / 100;
  function ensureAudio() {
    if (!ac) {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value = 0;
      master.connect(ac.destination);
      const len = ac.sampleRate * 2;
      noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ac.state === 'suspended') ac.resume();
  }
  function track(n) { ambNodes.push(n); return n; }
  function stopAmbience() {
    ambNodes.forEach(n => { try { if (n.stop) n.stop(); } catch (e) {} try { n.disconnect(); } catch (e) {} });
    ambNodes = [];
  }
  function lfo(freq, amount, param) {
    const o = ac.createOscillator(); o.frequency.value = freq;
    const g = ac.createGain(); g.gain.value = amount;
    o.connect(g); g.connect(param); o.start();
    track(o); track(g);
  }
  function noiseSrc() {
    const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true; s.start();
    return track(s);
  }
  function filt(type, freq, q) {
    const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq;
    if (q) f.Q.value = q;
    return track(f);
  }
  function ambGain(v) {
    const g = ac.createGain(); g.gain.value = v;
    return track(g);
  }
  function buildAmbience(type) {
    stopAmbience();
    if (type === 'sea') {
      const lp = filt('lowpass', 520), g = ambGain(.38);
      noiseSrc().connect(lp); lp.connect(g); g.connect(master);
      lfo(.1, 260, lp.frequency); lfo(.07, .18, g.gain);
    } else if (type === 'rain') {
      const hp = filt('highpass', 1600), g = ambGain(.15);
      noiseSrc().connect(hp); hp.connect(g); g.connect(master);
      const lp = filt('lowpass', 350), g2 = ambGain(.1);
      noiseSrc().connect(lp); lp.connect(g2); g2.connect(master);
      lfo(.06, .05, g2.gain);
    } else if (type === 'wind') {
      const bp = filt('bandpass', 450, .7), g = ambGain(.3);
      noiseSrc().connect(bp); bp.connect(g); g.connect(master);
      lfo(.06, 260, bp.frequency); lfo(.13, 120, bp.frequency); lfo(.045, .12, g.gain);
    } else {
      const lp = filt('lowpass', 700);
      lp.connect(master);
      [110, 164.81, 220, 277.18, 329.63].forEach((f, i) => {
        const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = f;
        const g = ac.createGain(); g.gain.value = .5 / (i + 1.5);
        o.connect(g); g.connect(lp); o.start();
        track(o); track(g);
        lfo(.05 + i * .03, g.gain.value * .6, g.gain);
      });
    }
  }
  function startAudio() {
    ensureAudio(); audioGen++;
    buildAmbience(cfg.soundType);
    master.gain.setTargetAtTime(volGain(), ac.currentTime, 1.0);
  }
  function stopAudio() {
    if (!ac) return;
    const gen = ++audioGen;
    master.gain.setTargetAtTime(0, ac.currentTime, .4);
    setTimeout(() => { if (gen === audioGen && !soundOn) stopAmbience(); }, 2000);
  }
  function bell() {
    if (!soundOn || !ac) return;
    const f = [440, 493.88, 554.37, 659.25, 739.99, 880][Math.random() * 6 | 0];
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(.0001, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.12, ac.currentTime + .03);
    g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + 3.2);
    o.connect(g); g.connect(master);
    o.start(); o.stop(ac.currentTime + 3.3);
  }

  /* ---------- interfaccia ---------- */
  const hint = document.getElementById('hint'), toastEl = document.getElementById('toast');
  let toastT;
  function dismissHint() { hint.classList.add('gone'); }
  function toast(msg) { toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('show'), 1800); }
  setTimeout(dismissHint, 9000);
  addEventListener('keydown', e => {
    if ((e.key === 'h' || e.key === 'H') && !/INPUT|SELECT|TEXTAREA/.test(e.target?.tagName || '')) {
      cfg.panelHidden = !cfg.panelHidden; applyPanelHidden(); saveSettings();
    }
  });

  function setBreath(on) {
    breathOn = on; cfg.breath = on; bStart = performance.now();
    bEl.classList.toggle('on', breathOn);
    if (breathChk) breathChk.checked = breathOn;
    saveSettings();
  }
  function setSound(on) {
    soundOn = on; cfg.sound = on;
    if (soundChk) soundChk.checked = on;
    if (on) startAudio(); else if (ac) stopAudio();
    saveSettings();
  }
  function savePng() {
    cv.toBlob(b => {
      if (!b) { toast('PNG'); return; }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b); a.download = 'respiro.png';
      a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      toast(tr('saved'));
    });
  }


  /* ---------- lingua globale (dal menu laterale di index.html) ---------- */
  const LANG_KEY = 'mylollotool-lang';
  const LANGS = ['it', 'de', 'fr', 'en'];
  const T = {
    title:   { it: 'Respiro', de: 'Atempause', fr: 'Respiration', en: 'Breathe' },
    hint:    { it: 'Muovi il dito sullo schermo.<br>Non serve fare niente.',
               de: 'Bewege den Finger über den Bildschirm.<br>Du musst nichts tun.',
               fr: 'Bouge le doigt sur l’écran.<br>Tu n’as rien à faire.',
               en: 'Move your finger across the screen.<br>You don’t need to do anything.' },
    breath:  { it: 'Respira', de: 'Atmen', fr: 'Respirer', en: 'Breathe' },
    sound:   { it: 'Suono', de: 'Klang', fr: 'Son', en: 'Sound' },
    soundType:{ it: 'Tipo di suono', de: 'Klangart', fr: 'Type de son', en: 'Sound type' },
    volume:  { it: 'Volume', de: 'Lautstärke', fr: 'Volume', en: 'Volume' },
    snd_drone:{ it: 'Bordone', de: 'Bordun', fr: 'Bourdon', en: 'Drone' },
    snd_sea: { it: 'Mare', de: 'Meer', fr: 'Mer', en: 'Sea' },
    snd_rain:{ it: 'Pioggia', de: 'Regen', fr: 'Pluie', en: 'Rain' },
    snd_wind:{ it: 'Vento', de: 'Wind', fr: 'Vent', en: 'Wind' },
    colors:  { it: 'Colori', de: 'Farben', fr: 'Couleurs', en: 'Colors' },
    clear:   { it: 'Svuota', de: 'Leeren', fr: 'Effacer', en: 'Clear' },
    save:    { it: 'Salva immagine', de: 'Bild speichern', fr: 'Enregistrer l’image', en: 'Save image' },
    in:      { it: 'Inspira', de: 'Einatmen', fr: 'Inspire', en: 'Inhale' },
    hold:    { it: 'Trattieni', de: 'Halten', fr: 'Retiens', en: 'Hold' },
    out:     { it: 'Espira', de: 'Ausatmen', fr: 'Expire', en: 'Exhale' },
    laguna:  { it: 'Laguna', de: 'Lagune', fr: 'Lagune', en: 'Lagoon' },
    aurora:  { it: 'Aurora', de: 'Aurora', fr: 'Aurore', en: 'Aurora' },
    tramonto:{ it: 'Tramonto', de: 'Sonnenuntergang', fr: 'Coucher de soleil', en: 'Sunset' },
    inchiostro: { it: 'Inchiostro', de: 'Tinte', fr: 'Encre', en: 'Ink' },
    saved:   { it: 'Immagine salvata', de: 'Bild gespeichert', fr: 'Image enregistrée', en: 'Image saved' },
    canvasLab: { it: 'Tela artistica interattiva: muovi il dito o il mouse per disegnare con il colore',
               de: 'Interaktive Kunstleinwand: bewege Finger oder Maus, um mit Farbe zu malen',
               fr: 'Toile artistique interactive : bouge le doigt ou la souris pour dessiner avec la couleur',
               en: 'Interactive art canvas: move your finger or mouse to paint with color' },
    secStrokes: { it: 'Tratti', de: 'Striche', fr: 'Traits', en: 'Strokes' },
    secMouse: { it: 'Mouse', de: 'Maus', fr: 'Souris', en: 'Mouse' },
    brightness: { it: 'Luminosità tratti', de: 'Strich-Helligkeit', fr: 'Luminosité des traits', en: 'Stroke brightness' },
    thick:   { it: 'Spessore tratti', de: 'Strichstärke', fr: 'Épaisseur des traits', en: 'Stroke width' },
    trail:   { it: 'Scia', de: 'Schweif', fr: 'Traînée', en: 'Trail' },
    speed:   { it: 'Velocità', de: 'Geschwindigkeit', fr: 'Vitesse', en: 'Speed' },
    density: { it: 'Densità', de: 'Dichte', fr: 'Densité', en: 'Density' },
    hoverR:  { it: 'Raggio vortice', de: 'Wirbelradius', fr: 'Rayon du tourbillon', en: 'Vortex radius' },
    repelR:  { it: 'Raggio respinta', de: 'Abstoßungsradius', fr: 'Rayon de répulsion', en: 'Repulsion radius' },
    repelF:  { it: 'Forza respinta', de: 'Abstoßungskraft', fr: 'Force de répulsion', en: 'Repulsion force' },
    hide:    { it: 'Nascondi', de: 'Ausblenden', fr: 'Masquer', en: 'Hide' },
    random:  { it: 'Casuale', de: 'Zufällig', fr: 'Aléatoire', en: 'Random' },
    defaults:{ it: 'Valori predefiniti', de: 'Standardwerte', fr: 'Valeurs par défaut', en: 'Defaults' },
    note:    { it: 'Le impostazioni vengono salvate da sole.',
               de: 'Die Einstellungen werden automatisch gespeichert.',
               fr: 'Les réglages sont enregistrés automatiquement.',
               en: 'Settings are saved automatically.' },
    showPanel: { it: 'Mostra pannello', de: 'Bedienfeld anzeigen', fr: 'Afficher le panneau', en: 'Show panel' },
    collapse: { it: 'Riduci/espandi', de: 'Ein-/ausklappen', fr: 'Réduire/déplier', en: 'Collapse/expand' }
  };
  let curLang = 'it';
  try { const g = localStorage.getItem(LANG_KEY); if (LANGS.includes(g)) curLang = g; } catch (e) {}
  const tr = k => { const e = T[k]; return (!e ? k : (e[curLang] || e.it || k)); };
  function applyLang(l) {
    if (LANGS.includes(l)) curLang = l;
    document.documentElement.lang = curLang;
    try { localStorage.setItem(LANG_KEY, curLang); } catch (e) {}
    document.title = tr('title');
    document.querySelectorAll('[data-tk]').forEach(el => { el.textContent = tr(el.dataset.tk); });
    langUpdaters.forEach(f => f());
    toggleBtn.title = tr('collapse');
    showPanelBtn.title = tr('showPanel');
    hint.innerHTML = tr('hint');
    cv.setAttribute('aria-label', tr('canvasLab'));
    if (breathOn && lastPhaseKey) bText.textContent = tr(lastPhaseKey);
  }
  addEventListener('message', e => {
    if (e?.data?.type === LANG_KEY && LANGS.includes(e.data.lang)) applyLang(e.data.lang);
  });
  addEventListener('storage', e => {
    if (e.key === LANG_KEY && LANGS.includes(e.newValue)) applyLang(e.newValue);
  });


  /* ---------- pannello laterale impostazioni (come le altre pagine antistress) ---------- */
  const pbody = document.getElementById('pbody');
  const toggleBtn = document.getElementById('toggle');
  const panel = document.getElementById('panel');
  const showPanelBtn = document.getElementById('showPanel');
  const uiUpdaters = [], langUpdaters = [];
  const fmt = (v, dec) => Number(v).toFixed(dec);
  function sep(key) {
    const d = document.createElement('div'); d.className = 'sep';
    d.setAttribute('data-tk', key); d.textContent = tr(key);
    pbody.appendChild(d);
  }

  SLIDERS.forEach(d => {
    if (d.sep) { sep(d.sep); return; }
    const row = document.createElement('div'); row.className = 'row';
    const lab = document.createElement('label');
    const name = document.createElement('span'); name.setAttribute('data-tk', d.tk); name.textContent = tr(d.tk);
    const val = document.createElement('span');
    lab.appendChild(name); lab.appendChild(val);
    const inp = document.createElement('input');
    inp.type = 'range'; inp.min = d.min; inp.max = d.max; inp.step = d.step;
    inp.value = cfg[d.key]; val.textContent = fmt(cfg[d.key], d.dec);
    inp.addEventListener('input', () => {
      cfg[d.key] = parseFloat(inp.value);
      val.textContent = fmt(cfg[d.key], d.dec);
      saveSettings();
    });
    if (d.key === 'density') inp.addEventListener('change', resize);
    uiUpdaters.push(() => { inp.value = cfg[d.key]; val.textContent = fmt(cfg[d.key], d.dec); });
    row.appendChild(lab); row.appendChild(inp); pbody.appendChild(row);
  });

  sep('colors');
  {
    const row = document.createElement('div'); row.className = 'row';
    const sel = document.createElement('select'); palSel = sel;
    pal.forEach((p, i) => { const op = document.createElement('option'); op.value = String(i); op.textContent = tr(p.tk); sel.appendChild(op); });
    sel.value = String(cfg.palette);
    sel.title = tr('colors');
    langUpdaters.push(() => { [...sel.options].forEach((op, i) => { op.textContent = tr(pal[i].tk); }); sel.title = tr('colors'); });
    sel.addEventListener('change', () => setPal(parseInt(sel.value, 10)));
    uiUpdaters.push(() => { sel.value = String(cfg.palette); });
    row.appendChild(sel); pbody.appendChild(row);
  }

  sep('sound');
  soundChk = addCheck('sound', () => soundOn, v => setSound(v));

  {
    const row = document.createElement('div'); row.className = 'row';
    const lab = document.createElement('label'); lab.setAttribute('data-tk', 'soundType'); lab.textContent = tr('soundType');
    const sel = document.createElement('select');
    SOUND_TYPES.forEach(k => { const op = document.createElement('option'); op.value = k; op.textContent = tr('snd_' + k); sel.appendChild(op); });
    sel.value = cfg.soundType;
    langUpdaters.push(() => { [...sel.options].forEach(op => { op.textContent = tr('snd_' + op.value); }); });
    sel.addEventListener('change', () => {
      cfg.soundType = SOUND_TYPES.includes(sel.value) ? sel.value : 'drone';
      saveSettings();
      if (soundOn) startAudio();
      toast(tr('snd_' + cfg.soundType));
    });
    uiUpdaters.push(() => { sel.value = cfg.soundType; });
    row.appendChild(lab); row.appendChild(sel); pbody.appendChild(row);
  }

  {
    const row = document.createElement('div'); row.className = 'row';
    const lab = document.createElement('label');
    const name = document.createElement('span'); name.setAttribute('data-tk', 'volume'); name.textContent = tr('volume');
    const val = document.createElement('span'); val.textContent = String(cfg.volume | 0);
    lab.appendChild(name); lab.appendChild(val);
    const inp = document.createElement('input');
    inp.type = 'range'; inp.min = 0; inp.max = 100; inp.step = 1; inp.value = cfg.volume;
    inp.addEventListener('input', () => {
      cfg.volume = Math.min(100, Math.max(0, parseInt(inp.value, 10) || 0));
      val.textContent = String(cfg.volume);
      if (ac && soundOn) master.gain.setTargetAtTime(volGain(), ac.currentTime, .2);
      saveSettings();
    });
    uiUpdaters.push(() => { inp.value = cfg.volume; val.textContent = String(cfg.volume); });
    row.appendChild(lab); row.appendChild(inp); pbody.appendChild(row);
  }

  function addCheck(labelKey, get, set) {
    const l = document.createElement('label'); l.className = 'chk';
    const c = document.createElement('input'); c.type = 'checkbox'; c.checked = get();
    c.addEventListener('change', () => set(c.checked));
    uiUpdaters.push(() => { c.checked = get(); });
    const s = document.createElement('span'); s.setAttribute('data-tk', labelKey); s.textContent = tr(labelKey);
    l.appendChild(c); l.appendChild(s); pbody.appendChild(l);
    return c;
  }
  breathChk = addCheck('breath', () => breathOn, v => setBreath(v));

  const btns = document.createElement('div'); btns.className = 'btns';
  function addBtn(labelKey, cls, fn) {
    const b = document.createElement('button'); b.setAttribute('data-tk', labelKey); b.textContent = tr(labelKey);
    if (cls) b.className = cls;
    b.addEventListener('click', fn);
    btns.appendChild(b); return b;
  }
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function randomize() {
    cfg.brightness = +rnd(.4, 1).toFixed(2);
    cfg.thick = +rnd(.8, 3).toFixed(1);
    cfg.trail = +rnd(.008, .09).toFixed(3);
    cfg.speed = +rnd(.5, 2).toFixed(1);
    cfg.density = +rnd(.5, 1.6).toFixed(1);
    cfg.hoverR = Math.round(rnd(100, 350) / 10) * 10;
    cfg.repelR = Math.round(rnd(120, 420) / 10) * 10;
    cfg.repelF = +rnd(2, 12).toFixed(1);
    setPal(Math.random() * pal.length | 0, true);
    saveSettings(); refreshUI(); resize();
    toast(tr('random'));
  }
  addBtn('clear', '', () => { fillBg(); });
  addBtn('save', '', savePng);
  addBtn('random', '', randomize);
  addBtn('hide', '', () => { cfg.panelHidden = true; applyPanelHidden(); saveSettings(); });
  addBtn('defaults', 'wide', () => {
    const keepHidden = cfg.panelHidden, keepCollapsed = cfg.collapsed;
    Object.assign(cfg, DEFAULTS);
    cfg.panelHidden = keepHidden; cfg.collapsed = keepCollapsed;
    setPal(cfg.palette, true);
    setBreath(cfg.breath);
    if (!cfg.sound && soundOn) setSound(false);
    else { if (soundChk) soundChk.checked = soundOn; }
    refreshUI(); resize(); saveSettings();
  });
  pbody.appendChild(btns);
  const pnote = document.createElement('div'); pnote.id = 'pnote';
  pnote.setAttribute('data-tk', 'note'); pnote.textContent = tr('note');
  pbody.appendChild(pnote);

  function applyCollapsed() {
    pbody.classList.toggle('hidden', !!cfg.collapsed);
    toggleBtn.innerHTML = cfg.collapsed ? '+' : '&minus;';
  }
  function applyPanelHidden() {
    const h = !!cfg.panelHidden;
    panel.style.display = h ? 'none' : '';
    showPanelBtn.style.display = h ? 'block' : 'none';
  }
  showPanelBtn.addEventListener('click', () => { cfg.panelHidden = false; applyPanelHidden(); saveSettings(); });
  toggleBtn.addEventListener('click', () => { cfg.collapsed = !cfg.collapsed; applyCollapsed(); saveSettings(); });
  function refreshUI() { uiUpdaters.forEach(f => f()); applyCollapsed(); applyPanelHidden(); }

  addEventListener('resize', resize);
  resize();
  applyLang(curLang);
  refreshUI();
  if (cfg.breath) setBreath(true);
  if (cfg.sound) { soundOn = true; if (soundChk) soundChk.checked = true; }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
